<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mediks">
<title>MEDIKS — Centro Médico Odontológico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --porcelana:#EEF2F1;--papel:#fff;--tinta:#15302A;--tinta-suave:#5A706A;
  --linea:#D6DEDB;--clinico:#0E7C6B;--clinico-claro:#E2F0ED;
  --alerta:#B24A35;--alerta-claro:#F7E9E5;--azul:#1F5FA8;--r:10px;--r-lg:16px;
  --acento:#3E7BE0;--dorado:#C9962B;
  --sombra-sm:0 1px 2px rgba(15,40,35,.05),0 2px 8px rgba(15,40,35,.05);
  --sombra-md:0 6px 20px rgba(15,40,35,.09),0 1px 3px rgba(15,40,35,.06);
  --sombra-navy:0 10px 26px rgba(10,25,48,.22);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--porcelana);color:var(--tinta);
  font-family:Figtree,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:10px;padding:0 22px;height:76px;position:relative;
  background:radial-gradient(circle at 4% -40%,rgba(62,123,224,.4),transparent 60%),linear-gradient(135deg,#0C1B33,#132A52);
  box-shadow:var(--sombra-navy);flex-wrap:wrap;flex:none;z-index:6}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--acento),var(--azul) 45%,transparent 85%);opacity:.9;pointer-events:none}
header.top .marca{font-family:Newsreader,serif;font-size:23px;font-weight:500;color:#fff;margin-right:8px;position:relative}
header.top .marca em{font-style:normal;color:#6FA8DC}
header.top #logoConsultorio{box-shadow:0 2px 10px rgba(0,0,0,.35);position:relative}
header.top .btn{background:transparent;border:0;color:rgba(255,255,255,.82);padding:9px 15px;
  border-radius:8px;font-weight:500;font-size:14px;position:relative;transition:background .15s,color .15s}
header.top .btn:hover{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
header.top .btn.chico{background:rgba(255,255,255,.08);color:#fff;padding:6px 11px}
header.top .btn.chico:hover{background:rgba(255,255,255,.18)}
.menu-drop{position:relative}
.menu-drop-lista{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--papel);
  border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 28px rgba(10,25,45,.18);
  min-width:190px;padding:6px;z-index:50}
.menu-drop-lista.abierto{display:block}
.menu-drop-lista button{display:block;width:100%;text-align:left;background:none;border:0;
  padding:9px 11px;border-radius:7px;color:var(--tinta);font-weight:500;font-size:13.5px;cursor:pointer}
.menu-drop-lista button:hover{background:var(--porcelana)}
.menu-drop-lista hr{border:0;border-top:1px solid var(--linea);margin:5px 2px}
.spacer{flex:1}
.cuerpo{display:flex;flex:1;min-height:0}
aside{width:310px;flex:none;background:var(--papel);border-right:1px solid var(--linea);display:flex;flex-direction:column;
  min-height:0;box-shadow:2px 0 10px rgba(15,40,35,.03)}
.buscador{padding:11px;border-bottom:1px solid var(--linea);display:flex;gap:8px}
.lista{overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linea);
  padding:10px 13px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--porcelana)}
.item[aria-current="true"]{background:var(--clinico-claro);border-left-color:var(--clinico);box-shadow:inset 0 0 0 1px rgba(14,124,107,.12)}
.item .nom{font-weight:600}
.item .meta{font-size:12.5px;color:var(--tinta-suave);display:flex;gap:8px;margin-top:1px}
.item .deuda{color:var(--alerta);font-weight:600}
.vacio{padding:22px 16px;color:var(--tinta-suave);font-size:14px}
/* tarjetas resumen estilo kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:16px}
.kpi-card{border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden;
  box-shadow:var(--sombra-sm);transition:transform .15s,box-shadow .15s}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--sombra-md)}
.kpi-card::before{position:absolute;top:12px;right:14px;font-size:19px;opacity:.55;line-height:1}
.kpi-card span{font-size:12.5px;color:var(--tinta-suave);font-weight:500}
.kpi-card b{display:block;font-family:Newsreader,serif;font-size:30px;font-weight:600;margin-top:5px}
.kpi-verde{background:linear-gradient(135deg,#E3F3E9,#F5FBF7)}.kpi-verde b{color:#2F7A3C}.kpi-verde::before{content:"📅"}
.kpi-azul{background:linear-gradient(135deg,#E3EEFB,#F4F9FD)}.kpi-azul b{color:#1F5FA8}.kpi-azul::before{content:"✅"}
.kpi-naranja{background:linear-gradient(135deg,#FBEDDD,#FDF7EE)}.kpi-naranja b{color:#B98A2E}.kpi-naranja::before{content:"🩺"}
.kpi-rojo{background:linear-gradient(135deg,#FBE4DF,#FDF3F0)}.kpi-rojo b{color:#B24A35}.kpi-rojo::before{content:"✕"}
.kpi-morado{background:linear-gradient(135deg,#EEE6FB,#F8F5FD)}.kpi-morado b{color:#7A4FB5}.kpi-morado::before{content:"🆕"}
.kpi-teal{background:linear-gradient(135deg,#E2F0ED,#F3F9F8)}.kpi-teal b{color:#0E7C6B}.kpi-teal::before{content:"📋"}
.kpi-rosa{background:linear-gradient(135deg,#FBE4EF,#FDF3F8)}.kpi-rosa b{color:#B5457E}.kpi-rosa::before{content:"💰"}
.kpi-indigo{background:linear-gradient(135deg,#E6E9FB,#F6F7FD)}.kpi-indigo b{color:#45539E}.kpi-indigo::before{content:"👥"}
/* portada de inicio */
.hero-inicio{position:relative;overflow:hidden;border-radius:var(--r-lg);color:#fff;padding:42px 36px;
  background:radial-gradient(circle at 92% -25%,rgba(62,123,224,.38),transparent 55%),linear-gradient(135deg,#0C1B33,#132A52);
  box-shadow:var(--sombra-navy)}
.hero-inicio h1{font-family:Newsreader,serif;font-weight:500;font-size:29px;line-height:1.24;margin-bottom:10px;max-width:26ch}
.hero-inicio p{color:#B9C8E0;max-width:48ch;margin:0 0 18px;font-size:15px}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.hero-tags span{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);
  color:#D9E3F5;padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:500}
.hero-acciones{display:flex;gap:10px;flex-wrap:wrap}
.btn.btn-fantasma{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
.btn.btn-fantasma:hover{background:rgba(255,255,255,.12);border-color:#fff;color:#fff}
@media (max-width:560px){.hero-inicio{padding:30px 22px}.hero-inicio h1{font-size:25px;max-width:100%}}
.panel-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.panel-2col{grid-template-columns:1fr}}
.rango-fechas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rango-fechas input[type=date]{width:auto}
main{flex:1;overflow:auto;min-width:0;padding:20px 32px 70px}
.centro{max-width:1560px;margin:0 auto}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:7px 9px;background:var(--papel);border:1px solid var(--linea);border-radius:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--clinico);box-shadow:0 0 0 3px var(--clinico-claro)}
textarea{resize:vertical;min-height:64px}
label.campo{display:block;margin-bottom:11px}
label.campo>span{display:block;font-size:12.5px;color:var(--tinta-suave);margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 13px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 13px}
.btn{border:1px solid var(--linea);background:var(--papel);border-radius:8px;padding:7px 12px;cursor:pointer;
  font-weight:500;transition:transform .12s,box-shadow .12s,border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--clinico);color:var(--clinico)}
.btn.primario{background:linear-gradient(135deg,var(--acento),#1F5FA8);border-color:#1F5FA8;color:#fff;
  box-shadow:0 3px 10px rgba(31,95,168,.3)}
.btn.primario:hover{background:linear-gradient(135deg,#5c93ea,#1a4d8c);color:#fff;transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(31,95,168,.36)}
.btn.primario:active{transform:translateY(0)}
.btn.peligro:hover{border-color:var(--alerta);color:var(--alerta)}
.btn.chico{padding:4px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--clinico);outline-offset:2px}
.cabecera{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cabecera h2{font-family:Newsreader,serif;font-size:30px;font-weight:500;line-height:1.15}
.sub{color:var(--tinta-suave);font-size:13.5px;margin-top:2px}
.alergia{display:inline-block;background:var(--alerta-claro);color:var(--alerta);border-radius:6px;
  padding:3px 9px;font-size:13px;font-weight:600;margin-top:7px}
.pestanas{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:16px 0 18px;overflow:auto}
.pv-layout{display:flex;gap:22px;align-items:flex-start}
.pv-nav{width:230px;flex:none;background:linear-gradient(180deg,#0C1B33,#132A52);border-radius:16px;
  padding:28px 16px 20px;color:#fff;position:sticky;top:12px;box-shadow:var(--sombra-navy)}
.pv-nav .avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--acento),#1a4d8c);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pv-nav .nombre{text-align:center;font-weight:600;font-size:15px;padding:0 4px;line-height:1.3}
.pv-nav .hc{text-align:center;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:18px}
.pv-nav .botones button{display:block;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.75);
  padding:11px 13px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:3px}
.pv-nav .botones button:hover{background:rgba(255,255,255,.09);color:#fff}
.pv-nav .botones button[aria-selected="true"]{background:rgba(255,255,255,.18);color:#fff}
.pv-content{flex:1;min-width:0}
@media (max-width:760px){
  .pv-layout{flex-direction:column}
  .pv-content{width:100%}
  .pv-nav{width:100%;position:static;padding:14px}
  .pv-nav .avatar,.pv-nav .nombre,.pv-nav .hc{display:none}
  .pv-nav .botones{display:flex;overflow-x:auto;gap:4px}
  .pv-nav .botones button{width:auto;white-space:nowrap;margin-bottom:0}
}
.pestanas button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;
  cursor:pointer;color:var(--tinta-suave);font-weight:500;white-space:nowrap}
.pestanas button[aria-selected="true"]{color:var(--clinico);border-bottom-color:var(--clinico)}
.bloque{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;
  box-shadow:var(--sombra-sm)}
details.bloque{padding:0}
details.bloque>summary{padding:15px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
details.bloque>summary::-webkit-details-marker{display:none}
details.bloque>summary::after{content:'⌄';margin-left:auto;font-size:15px;color:var(--tinta-suave)}
details.bloque[open]>summary::after{content:'⌃'}
details.bloque[open]>summary{border-bottom:1px solid var(--linea)}
details.bloque>.cont{padding:14px 18px 18px}
details.opcional{border:1px solid var(--linea);border-radius:9px;margin-bottom:14px}
details.opcional>summary{padding:9px 12px;cursor:pointer;font-size:13px;color:var(--tinta-suave);
  font-weight:600;list-style:none;display:flex;align-items:center}
details.opcional>summary::-webkit-details-marker{display:none}
details.opcional>summary::after{content:'⌄';margin-left:auto;color:var(--tinta-suave)}
details.opcional[open]>summary::after{content:'⌃'}
details.opcional[open]>summary{border-bottom:1px solid var(--linea);color:var(--tinta)}
details.opcional>.cont{padding:12px}
.selector-diente{display:flex;flex-direction:column;gap:6px;align-items:center}
.selector-diente .arcada{display:flex;gap:10px}
.selector-diente .cuadrante{display:flex;gap:2px}
.selector-diente button{width:30px;height:30px;border:1px solid var(--linea);border-radius:6px;
  background:var(--papel);cursor:pointer;font-size:11px;color:var(--tinta)}
.selector-diente button:hover{border-color:var(--clinico);background:var(--clinico-claro)}
.fila-item-presu{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.fila-item-presu .caras-mini{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:4px}
.fila-item-presu .caras-mini label{display:flex;align-items:center;gap:4px}
details.bloque>summary b{background:var(--tinta);color:#fff;width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;font-size:12.5px;flex:none}
details.bloque>summary span.tit{font-size:14.5px;letter-spacing:.01em;color:var(--tinta);font-weight:600}
details.bloque>summary span.res{font-size:12.5px;color:var(--tinta-suave);font-weight:400;margin-left:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-tit{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.barra-tit b{background:var(--tinta);color:#fff;width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;font-size:12.5px;flex:none}
.barra-tit h3{font-size:14.5px;letter-spacing:.01em}
.barra-tit .der{margin-left:auto}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:2px 12px}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;padding:2px 0}
.chk input{width:15px;height:15px;accent-color:var(--clinico);flex:none}
.switch-wrap{display:flex;align-items:center;gap:9px;font-size:14px;white-space:nowrap}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#D5D9DE;border-radius:999px;cursor:pointer;transition:.18s}
.switch .slider::before{content:"";position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--clinico)}
.switch input:checked+.slider::before{transform:translateX(17px)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--tinta-suave);font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--linea)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
td.der,th.der{text-align:right;padding-right:0;font-variant-numeric:tabular-nums}
.mini{font-size:13px;color:var(--tinta-suave)}
/* odontograma */
.odonto{display:flex;flex-direction:column;gap:26px;align-items:flex-start;overflow-x:auto;padding:10px 4px 6px;width:100%}
.arcada{display:flex;gap:10px;position:relative;padding:0 2px 6px;flex-wrap:nowrap;justify-content:center;width:max-content;min-width:100%}
.arcada::after{content:"";position:absolute;left:50%;top:-4px;bottom:2px;width:1px;background:var(--linea)}
.cuadrante{display:flex;gap:3px;flex-wrap:nowrap}
.diente{width:46px;text-align:center;font-size:10px;color:var(--tinta-suave);font-variant-numeric:tabular-nums;
  background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:6px 2px 7px;
  box-shadow:var(--sombra-sm);transition:transform .12s,box-shadow .12s,border-color .12s}
.diente:hover{transform:translateY(-2px);box-shadow:var(--sombra-md);border-color:var(--clinico)}
.diente .sim{display:flex;align-items:center;justify-content:center;height:36px;width:36px;margin:0 auto;
  font-size:18px;font-weight:700;cursor:pointer;border-radius:9px;background:var(--porcelana);color:var(--tinta-suave)}
.diente .sim:hover{outline:2px solid var(--clinico);outline-offset:1px}
.diente .numd{display:block;margin-top:4px;font-weight:700;color:var(--tinta)}
.diente .mr{display:block;height:11px;font-size:8px;letter-spacing:.1px;color:var(--alerta)}
.carasmini{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:36px;height:36px;margin:0 auto;border:1.5px solid var(--tinta);border-radius:9px;overflow:hidden;background:var(--porcelana)}
.carasmini i{display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;
  border:1px solid #B9C4C1;font-size:8.5px;font-weight:700;font-style:normal;line-height:1;color:#fff}
.carasmini i:hover{outline:1.5px solid var(--clinico);outline-offset:-1.5px;position:relative;z-index:1}
.cara-v{grid-column:2;grid-row:1}
.cara-m{grid-column:1;grid-row:2}
.cara-o{grid-column:2;grid-row:2}
.cara-d{grid-column:3;grid-row:2}
.cara-l{grid-column:2;grid-row:3}
.diente .editar{display:block;margin:3px auto 0;width:14px;height:14px;line-height:13px;border-radius:50%;
  border:1px solid var(--linea);background:var(--papel);color:var(--tinta-suave);font-size:8px;cursor:pointer}
.diente .editar:hover{border-color:var(--clinico);color:var(--clinico)}
.paleta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.paleta button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--linea);border-radius:8px;
  padding:6px 10px;background:var(--papel);cursor:pointer;font-size:12.5px;color:var(--tinta)}
.paleta button i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15);flex:none}
.paleta button:hover{border-color:var(--clinico)}
.paleta button[aria-pressed="true"]{border-color:var(--clinico);background:var(--clinico-claro);font-weight:600}
.paleta .sep{width:1px;background:var(--linea);margin:2px 4px}
.leyenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:3px 14px;margin-top:14px;font-size:13px}
.leyenda span b{font-size:15px;display:inline-block;width:18px}
.leyenda-titulo{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--tinta);margin-bottom:2px}
/* odontograma — vista general anatómica */
.odonto-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;background:var(--porcelana);padding:4px;border-radius:11px;width:fit-content}
.odonto-tabs button{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 14px;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--tinta-suave);display:inline-flex;align-items:center}
.odonto-tabs button[aria-pressed="true"]{background:var(--tinta);color:#fff;box-shadow:var(--sombra-sm)}
.odonto2{display:flex;gap:18px;align-items:flex-start}
.odonto2-arcos{flex:1;min-width:0}
.arco-titulo{text-align:center;font-size:11px;letter-spacing:.12em;color:var(--tinta-suave);font-weight:700;margin-bottom:12px}
.pieza-card{width:52px;text-align:center;font-size:11px;color:var(--tinta-suave);cursor:pointer;
  border-radius:12px;padding:7px 2px 9px;border:1.5px solid transparent;transition:border-color .12s,transform .12s,background .12s,box-shadow .12s}
.pieza-card:hover{transform:translateY(-2px);background:var(--porcelana);box-shadow:var(--sombra-sm)}

let nubeApp=null,nubeAuth=null,nubeDb=null,nubeUid=null,nubeActiva=false;

function edad(f){if(!f)return null;const n=new Date(f),h=new Date();let e=h.getFullYear()-n.getFullYear();
  const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))e--;return(e>=0&&e<130)?e:null;}
function edadTexto(f){
  const anios=edad(f);if(anios===null)return'';
  if(anios>=5)return anios+' años';
  const n=new Date(f),h=new Date();
  let meses=(h.getFullYear()-n.getFullYear())*12+(h.getMonth()-n.getMonth());
  if(h.getDate()<n.getDate())meses--;
  const a=Math.floor(meses/12),mRes=meses%12;
  return `${a} año${a===1?'':'s'} ${mRes} mes${mRes===1?'':'es'}`;
}
function avisar(t){const a=$('#aviso');a.textContent=t;a.classList.add('ver');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('ver'),2200);}
let tGuarda;
function guardar(){try{sincronizarInicialAuto();vincularCitasPacientes();completarProcedimientosVacios();}catch(e){}versionDatos++;clearTimeout(tGuarda);tGuarda=setTimeout(async()=>{
  const miSeq=++seqGuardado,json=JSON.stringify(datos),viaNube=almacen!==almacenLocal;
  /* Lo que no se confirma en la nube queda marcado como «pendiente» y se junta con la nube al volver la conexión.
     La «base» es la última versión que este dispositivo y la nube compartían. */
  let baseCand='';
  try{baseCand=ultimoSync!==null?ultimoSync:(localStorage.getItem(CLAVE)||'');}catch(e){}
  if(usaNube()&&!hayPendiente()){
    try{
      localStorage.setItem(LS_PEND,'1');
      if(!viaNube)localStorage.setItem(LS_BASE,baseCand);
      else setTimeout(()=>{try{if(hayPendiente()&&!localStorage.getItem(LS_BASE))localStorage.setItem(LS_BASE,baseCand);}catch(e){}},2500);
    }catch(e){}
  }
  let localOk=true;
  try{await almacenLocal.set(CLAVE,json);}
  catch(e){localOk=false;console.error(e);if(!viaNube)avisar('No se pudo guardar. Descarga un respaldo.');}
  if(viaNube){
    try{await almacen.set(CLAVE,json);if(miSeq===seqGuardado)limpiarPendiente(json);}
    catch(e){
      console.error(e);
      try{if(usaNube()){localStorage.setItem(LS_PEND,'1');if(!localStorage.getItem(LS_BASE))localStorage.setItem(LS_BASE,baseCand);}}catch(_){}
      avisar(localOk?'Sin conexión con la nube: se guardó en este dispositivo y se subirá al volver el internet':'No se pudo guardar. Descarga un respaldo.');
    }
  }
  copiaAutomatica();
},350);}
async function cargar(){try{const r=await almacen.get(CLAVE);if(r&&r.value)datos=JSON.parse(r.value);}catch(e){}
  datos.pacientes=datos.pacientes||[];datos.config=datos.config||{};datos.citas=datos.citas||[];
  datos.tareas=datos.tareas||[];datos.inventario=datos.inventario||[];datos.profesionales=datos.profesionales||[];
  datos.gastosProfesionales=datos.gastosProfesionales||[];
  inicializarSecuenciaRecetas();
  // migración: el sellante pasó de marcarse por cara a marcarse como condición general del diente
  const migrarSellante=o=>{if(!o)return;Object.keys(o).forEach(n=>{const d=o[n];
    if(d&&d.caras){['V','M','O','D','L'].forEach(k=>{const v=d.caras[k];
      if(v==='sellante_nec'||v==='sellante_real'){if(!d.general)d.general=v;delete d.caras[k];}});}});};
  datos.pacientes.forEach(p=>{migrarSellante(p.odontograma);if(p.odontogramaInicial)migrarSellante(p.odontogramaInicial.dientes);});
}

function traducirErrorAuth(code){
  const mapa={'auth/email-already-in-use':'Ese correo ya tiene una cuenta creada. Usa «Iniciar sesión».',
    'auth/invalid-email':'Ese correo no es válido.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',

    'auth/user-not-found':'No existe una cuenta con ese correo. Usa «Crear cuenta».',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/network-request-failed':'No hay conexión a internet en este momento.'};
  return mapa[code]||'No se pudo completar. Intenta de nuevo.';
}
async function migrarOCargarNube(){
  let rawNube;
  try{rawNube=(await conTiempo(almacenNube.get(CLAVE),8000)).value;}
  catch(e){
    if(e&&e.code==='NOT_FOUND'){   // la nube está vacía: se suben los datos de este dispositivo
      try{
        const json=JSON.stringify(datos);
        await conTiempo(almacenNube.set(CLAVE,json),8000);
        marcarUsaNube();limpiarPendiente(json);pintar();avisar('Tus datos de este dispositivo se subieron a la nube');
      }catch(e2){pasarAModoLocal();}
      return;
    }
    pasarAModoLocal();return;   // sin conexión u otro fallo: se sigue con la copia de este dispositivo
  }
  marcarUsaNube();
  if(hayPendiente()){
    // hay cosas anotadas sin conexión: se juntan con lo que haya en la nube (de este u otro dispositivo)
    let base={},nube={};
    try{base=JSON.parse(localStorage.getItem(LS_BASE)||'{}')||{};}catch(e){}
    try{nube=JSON.parse(rawNube)||{};}catch(e){}
    const v0=versionDatos;
    const unido=unir3(base,JSON.parse(JSON.stringify(datos)),nube);
    const json=JSON.stringify(unido);
    try{await conTiempo(almacenNube.set(CLAVE,json),8000);}catch(e){pasarAModoLocal();return;}
    try{await subirImagenesPendientes();}catch(e){}
    if(versionDatos!==v0)return;   // anotaste algo mientras se juntaba: se junta de nuevo en la próxima vuelta
    datos=unido;
    await cargar();
    try{await almacenLocal.set(CLAVE,JSON.stringify(datos));}catch(e){}
    limpiarPendiente(json);
    pintar();avisar('Se juntaron los cambios hechos sin conexión con los de la nube');
    return;
  }
  await cargar();
  ultimoSync=rawNube;
  // copia en este dispositivo: así, sin internet, siguen viéndose los pacientes de la última vez que abriste con conexión
  try{await almacenLocal.set(CLAVE,JSON.stringify(datos));}catch(e){}
  try{await subirImagenesPendientes();}catch(e){}
  pintar();avisar('Datos sincronizados desde la nube');
}
function abrirLoginNube(){
  abrirModal('Conectar con tu cuenta',`
    <p class="mini">Usa el mismo correo y contraseña en todos tus dispositivos para que compartan la misma información.</p>
    <label class="campo"><span>Correo</span><input type="email" id="nb_email" autofocus></label>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
      <button class="btn chico" type="button" id="nb_crear">Crear cuenta (primera vez)</button>
      <button class="btn primario chico" type="button" id="nb_entrar">Iniciar sesión</button>
    </div>
    <p class="mini" id="nb_msg" style="color:var(--alerta);min-height:16px"></p>`,null);
  const leer=()=>({email:$('#nb_email').value.trim(),pass:$('#nb_pass').value});
  async function procesar(promesa){
    const m=$('#nb_msg');m.textContent='';
    try{
      const cred=await promesa;
      nubeUid=cred.user.uid;nubeActiva=true;almacen=almacenNube;
      $('#modal').close();actualizarBotonNube();
      await migrarOCargarNube();
    }catch(e){m.textContent=traducirErrorAuth(e.code);}
  }
  $('#nb_crear').onclick=()=>{const {email,pass}=leer();
    if(!email||pass.length<6){$('#nb_msg').textContent='Escribe un correo y una contraseña de al menos 6 caracteres.';return;}
    procesar(nubeAuth.createUserWithEmailAndPassword(email,pass));};
  $('#nb_entrar').onclick=()=>{const {email,pass}=leer();
    if(!email||!pass){$('#nb_msg').textContent='Completa correo y contraseña.';return;}
    procesar(nubeAuth.signInWithEmailAndPassword(email,pass));};
}
function abrirNube(){
  if(nubeActiva&&nubeAuth&&nubeAuth.currentUser){
    abrirModal('Sincronización en la nube',`
      <p>Conectado como <b>${esc(nubeAuth.currentUser.email)}</b>. Tus datos se guardan y actualizan automáticamente en todos los dispositivos donde inicies sesión con esta misma cuenta.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn chico" type="button" id="nb_salir">Cerrar sesión en este dispositivo</button>
      </div>`,null);
    $('#nb_salir').onclick=async()=>{
      if(hayPendiente()&&!confirm('Tienes cambios hechos sin conexión que todavía no se subieron a la nube. Si cierras sesión ahora se quedarán solo en este dispositivo. ¿Cerrar sesión de todas formas?'))return;
      try{localStorage.removeItem(LS_USA);localStorage.removeItem(LS_PEND);localStorage.removeItem(LS_BASE);}catch(e){}
      await nubeAuth.signOut();nubeActiva=false;almacen=almacenLocal;
      $('#modal').close();actualizarBotonNube();avisar('Sesión cerrada. Volviste al modo local en este dispositivo.');
      await cargar();pintar();
    };
    return;
  }
  abrirLoginNube();
}
async function arrancar(){
  inicializarFirebase();
  inicializarGoogleCalendar();
  await cargar(); // primero lo que haya localmente, para no mostrar la app vacía
  aplicarTema();
  pintar();
  if(nubeAuth){
    await new Promise(resolver=>{
      let resuelto=false;
      const terminar=()=>{if(!resuelto){resuelto=true;resolver();}};
      nubeAuth.onAuthStateChanged(async user=>{
        if(user){
          nubeUid=user.uid;nubeActiva=true;almacen=almacenNube;
          actualizarBotonNube();
          await migrarOCargarNube();
          aplicarTema();
        }else{
          nubeActiva=false;almacen=almacenLocal;
          actualizarBotonNube();
        }
        terminar();
      });
      setTimeout(terminar,4000);
    });
  }else{
    actualizarBotonNube();
  }
}

  'Sellante':{tipo:'general',estado:'sellante_real'},
  'Colocación de implante':{tipo:'general',estado:'implante_real'},'Corona sobre implante':{tipo:'general',estado:'corona_real'}

/* 'cara' = tratamiento que se aplica sobre una o más superficies de la pieza (ej. resina, sellante).
   'general' = tratamiento que afecta a la pieza completa (ej. corona, exodoncia, endodoncia).
   null = no está en el catálogo mapeado (tratamiento libre); se deja la cara como opcional. */
/* Reconoce el tratamiento aunque lo escribas a tu manera: «Corona de porcelana» se entiende como «Corona». */
function claveTratOdonto(nombre){
  if(!nombre)return null;
  if(TRAT_A_ODONTO[nombre])return nombre;
  const n=String(nombre).trim().toLowerCase();
  const claves=Object.keys(TRAT_A_ODONTO).filter(k=>n===k.toLowerCase()||n.startsWith(k.toLowerCase()+' '));
  if(claves.length)return claves.sort((a,b)=>b.length-a.length)[0];
  /* si lo escribes a tu manera («Restauración con resina», «Calza», «Tratamiento de conducto»), se reconoce por la palabra clave */
  const t=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const alias=[[/pulpotom/,'Pulpotomía'],[/endodoncia|conducto|pulpectom/,'Endodoncia unirradicular'],
    [/exodoncia|extraccion|exodonc/,'Exodoncia simple'],[/sellante/,'Sellante'],[/implante/,'Colocacion de implante'],
    [/protesis total|dentadura total/,'Prótesis total'],[/protesis parcial|removible/,'Prótesis parcial removible'],
    [/puente/,'Puente'],[/carilla/,'Carilla'],[/corona/,'Corona'],
    [/restauraci|resina|obturaci|empaste|calza|composite|amalgama|ionomero/,'Restauración simple']];
  const hit=alias.find(([re])=>re.test(t));
  if(!hit)return null;
  return TRAT_A_ODONTO[hit[1]]?hit[1]:(Object.keys(TRAT_A_ODONTO).find(k=>k.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===hit[1])||null);
}
function tipoTratamiento(nombre){
  const k=claveTratOdonto(nombre);
  return k?TRAT_A_ODONTO[k].tipo:null;
}

/* Etiqueta del botón según el modo elegido (pendiente/realizado) — ej. "Ausente" se lee
   "Exodoncia indicada" mientras está pendiente, y "Diente ausente" una vez realizada. */
function etiquetaGrupo(g,modo){
  if(modo==='pendiente'&&g.nombreInd)return g.nombreInd;
  if(modo==='realizado'&&g.nombreReal)return g.nombreReal;
  return g.nombre;
}
function grupoDeEstado(codigo){
  if(!codigo)return null;
  return ESTADO_GRUPOS.find(g=>g.ind===codigo||g.real===codigo)||null;
}
/* Una pieza puede tener VARIOS estados a la vez (ej. endodoncia + corona, o implante + corona).
   Compatibilidad: el primero sigue guardado en "general" (como siempre) y los demás en "adicionales",
   así los datos que ya existen no cambian. */
function codigosEstado(nd){
  const r=[];
  if(nd&&nd.general)r.push(nd.general);
  ((nd&&nd.adicionales)||[]).forEach(c=>{if(c&&!r.includes(c))r.push(c);});
  return r;
}
function guardarCodigosEstado(nd,lista){
  if(!lista.length){delete nd.general;delete nd.adicionales;return;}
  nd.general=lista[0];
  if(lista.length>1)nd.adicionales=lista.slice(1);else delete nd.adicionales;
}
/* Pone el estado de un grupo: reemplaza el del mismo grupo (ej. de "indicada" a "realizada") o lo agrega. */
function ponerEstadoGrupo(nd,grupo,codigo){
  const lista=codigosEstado(nd);
  const i=lista.findIndex(c=>grupoDeEstado(c)===grupo);
  if(i>=0)lista[i]=codigo;else lista.push(codigo);
  guardarCodigosEstado(nd,lista);
}
/* Al tocar un botón de estado: lo agrega, lo cambia de pendiente↔realizado, o lo quita si ya estaba igual. */
function alternarEstadoGrupo(nd,grupo,modo){
  const codigo=modo==='pendiente'?grupo.ind:grupo.real;
  const lista=codigosEstado(nd);
  const i=lista.findIndex(c=>grupoDeEstado(c)===grupo);
  if(i>=0&&lista[i]===codigo)lista.splice(i,1);
  else if(i>=0)lista[i]=codigo;
  else lista.push(codigo);
  guardarCodigosEstado(nd,lista);
}
function esPendienteSegunCodigo(codigo){
  const g=grupoDeEstado(codigo);
  return g?codigo===g.ind:false;
}

function cpo(p){
  const o=p.odontograma||{},permanente=n=>+n<51||+n>85;
  const r={C:0,P:0,O:0,c:0,e:0,o:0};
  for(const n in o){
    const d=o[n],perm=permanente(n);
    const caras=d.caras||{};
    const tieneCaries=Object.values(caras).includes('caries');
    const tieneObturado=Object.values(caras).some(v=>v==='obturado'||v==='provisional');
    if(['perdida_caries','removible_ind','removible_real','total_ind','total_real','implante_ind','implante_real'].includes(d.general)) perm?r.P++:r.e++;
    else if(d.general==='perdida_otra'||d.general==='retenido'||d.general==='otro'||d.general==='sellante_nec'||d.general==='sellante_real'){/* no cuentan en el índice */}

    else if(d.general==='endo_real'||d.general==='corona_real'||d.general==='puente_real'||tieneObturado) perm?r.O++:r.o++;
  }
  return r;
}

/* ---------- vincular citas con pacientes por nombre ---------- */
const _PALABRAS_RUIDO=new Set(['px','paciente','pcte','dr','dra','sr','sra','srta','de','del','la','las','los','y','mama','papa','hijo','hija','cita','control']);
const _cacheTokens=new Map();
function tokensNombre(n){
  const k=String(n||'');if(_cacheTokens.has(k))return _cacheTokens.get(k);
  const r=_tokensNombre(k);if(_cacheTokens.size>3000)_cacheTokens.clear();_cacheTokens.set(k,r);return r;
}
function _tokensNombre(n){
  return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]/g,' ')
    .split(/\s+/).filter(t=>t&&!_PALABRAS_RUIDO.has(t));
}
/* Paciente que corresponde a un nombre escrito en una cita (sin importar el orden de nombres/apellidos ni mayúsculas ni tildes).
   Solo devuelve un paciente si es único; con un solo nombre suelto no adivina. */
function buscarPacientePorNombre(nombre){
  const exacto=(datos.pacientes||[]).filter(p=>(p.nombre||'').trim().toLowerCase()===String(nombre||'').trim().toLowerCase());
  if(exacto.length===1)return exacto[0];
  const tc=tokensNombre(nombre);if(tc.length<2)return null;
  const set=new Set(tc),hits=[];
  (datos.pacientes||[]).forEach(p=>{
    const tp=tokensNombre(p.nombre);if(tp.length<2)return;
    const sp=new Set(tp);
    const igual=tp.length===tc.length&&tp.every(t=>set.has(t));
    const pEnC=tp.every(t=>set.has(t)),cEnP=tc.every(t=>sp.has(t));
    if(igual||pEnC||cEnP)hits.push({p,igual});
  });
  const iguales=hits.filter(h=>h.igual);
  if(iguales.length===1)return iguales[0].p;
  return hits.length===1?hits[0].p:null;
}
function vincularCitasPacientes(){
  let n=0;
  (datos.citas||[]).forEach(c=>{
    if(c.pacienteId&&pac(c.pacienteId))return;
    const p=buscarPacientePorNombre(c.nombre);
    if(p){c.pacienteId=p.id;if(!c.telefono&&p.telefono)c.telefono=p.telefono;n++;}
  });
  return n;
}

let _svgGradCounter=0;
const PIEZA_PATHS={
  molar:'M8 3 Q20 -3 32 3 Q35 14 31 24 Q35 34 30 44 Q26 56 20 58 Q14 56 10 44 Q5 34 9 24 Q5 14 8 3 Z',
  premolar:'M11 3 Q20 -2 29 3 Q31 14 27 25 Q29 36 24 47 Q21 56 20 58 Q19 56 16 47 Q11 36 13 25 Q9 14 11 3 Z',
  canino:'M13 3 Q20 -2 27 3 Q28 16 24 30 Q25 42 20 58 Q15 42 16 30 Q12 16 13 3 Z',
  incisivo:'M12 3 Q20 -2 28 3 Q29 16 26 30 Q27 42 24 52 Q22 57 20 58 Q18 57 16 52 Q13 42 14 30 Q11 16 12 3 Z'

/* Línea amelocementaria aproximada (límite corona/raíz) de cada forma, en coordenadas locales del path (y=0 arriba) */
const PIEZA_LIMITE_CORONA={molar:24,premolar:25,canino:18,incisivo:21};
function svgPiezaHTML(n,badgeColor,w,pendiente,ausente){
  w=w||34;
  const tipo=tipoPieza(n);
  const path=PIEZA_PATHS[tipo];
  const gid='tg'+(_svgGradCounter++);
  // La corona siempre está "arriba" en el path local; según el cuadrante se voltea para que
  // la corona quede junto al círculo oclusal (al centro) y la raíz apunte hacia el número (hacia afuera).
  const flip=esSuperiorPieza(n)?'transform:scaleY(-1)':'';
  if(ausente){
    return `<svg width="${w}" height="${Math.round(w*60/40)}" viewBox="0 0 40 60" style="${flip}">
      <path d="${path}" fill="#F1F0EB" stroke="#BDB6A6" stroke-width="1.3" stroke-dasharray="3 2.2"/>
      <line x1="10" y1="10" x2="30" y2="50" stroke="${badgeColor||'#8C97A3'}" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="30" y1="10" x2="10" y2="50" stroke="${badgeColor||'#8C97A3'}" stroke-width="3.2" stroke-linecap="round"/>
    </svg>`;
  }
  const limCorona=PIEZA_LIMITE_CORONA[tipo];
  const relleno=badgeColor&&!pendiente?`<rect x="0" y="0" width="40" height="${limCorona}" fill="${badgeColor}" clip-path="url(#${gid}c)"/>`:'';
  const anillo=badgeColor&&pendiente?`<path d="${path}" fill="none" stroke="${badgeColor}" stroke-width="2.8" clip-path="url(#${gid}r)"/>`:'';
  return `<svg width="${w}" height="${Math.round(w*60/40)}" viewBox="0 0 40 60" style="${flip}">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"/><stop offset="34%" stop-color="#FBF6E9"/>
        <stop offset="66%" stop-color="#EFE0BE"/><stop offset="100%" stop-color="#D9C194"/>
      </linearGradient>
      <clipPath id="${gid}c"><path d="${path}"/></clipPath>
      <clipPath id="${gid}r"><rect x="0" y="0" width="40" height="${limCorona}"/></clipPath>
    </defs>
    <path d="${path}" fill="url(#${gid})" stroke="#C7BCA3" stroke-width="1.2"/>
    ${relleno}
    ${anillo}
    <path d="${path}" fill="none" stroke="#C7BCA3" stroke-width="1.2"/>
    <line x1="3" y1="${limCorona}" x2="37" y2="${limCorona}" stroke="#BCAE8C" stroke-width="0.8" stroke-dasharray="1.6 1.4" clip-path="url(#${gid}c)" opacity=".55"/>
  </svg>`;
}
function estadoVisualPieza(d){
  const simbolo=d.general&&SIMB_GENERAL[d.general]?SIMB_GENERAL[d.general].s:null;

    const pendiente=esPendienteSegunCodigo(d.general);
    const ausenteReal=grupo.clave==='ausente'&&!pendiente;
    return {color:grupo.color,ausente:ausenteReal,pendiente,nombre:grupo.nombre+(pendiente?' (pendiente)':''),simbolo};
  }

const NOMBRE_CARA=Object.fromEntries(CARAS.map(([k,n])=>[k,n]));
/* La cara «L» se guarda igual para todos, pero en los dientes superiores se llama Palatina (P) y en los inferiores Lingual (L). */
function letraCara(k,pieza){return (k==='L'&&pieza&&esSuperiorPieza(String(pieza).match(/\d{2}/)?String(pieza).match(/\d{2}/)[0]:pieza))?'P':k;}
function nombreCara(k,pieza){
  const pz=String(pieza||'').match(/\d{2}/);
  if(k==='L'){if(!pz)return 'Lingual (inferiores) / Palatina (superiores)';return esSuperiorPieza(pz[0])?'Palatina':'Lingual';}
  return ({V:'Vestibular',M:'Mesial',O:'Oclusal / Incisal',D:'Distal'})[k]||k;
}
function occlusalHTML(n,d,ausente){
  const caras=d.caras||{};

  /* Mesial = hacia la línea media. En el dibujo la línea media está al centro: las piezas del lado derecho del paciente
     (cuadrantes 1, 4, 5 y 8, a la izquierda de la pantalla) tienen la mesial a la derecha; las del otro lado, a la izquierda. */
  const ladoDerechoPac=['1','4','5','8'].includes(String(n).charAt(0));
  const izq=ladoDerechoPac?'D':'M',der=ladoDerechoPac?'M':'D';
  return `<div class="occ-grid${ausente?' ausente':''}" data-pieza="${n}" title="Toca una cara para marcarla">
    ${esquina()}${cara(esSuperiorPieza(n)?'V':'L')}${esquina()}
    ${cara(izq)}${cara('O')}${cara(der)}
    ${esquina()}${cara(esSuperiorPieza(n)?'L':'V')}${esquina()}
    ${ausente?'<div class="og-x"><s></s><s></s></div>':''}
  </div>`;
}

function guardarOdontogramaInicial(p){
  const tieneAlgo=Object.keys(p.odontograma||{}).length>0;
  if(!tieneAlgo){avisar('Marca al menos un diente antes de guardar el odontograma inicial');return;}
  if(p.odontogramaInicial&&!confirm('Ya existe un odontograma inicial guardado del '+fechaCorta(p.odontogramaInicial.fecha)+'. Esto lo reemplaza con el estado actual. ¿Continuar?'))return;
  p.odontogramaInicial={dientes:JSON.parse(JSON.stringify(p.odontograma)),fecha:hoy()};
  guardar();avisar('Odontograma inicial guardado');pintarVista();
}
function generarPresupuestoDesdeOdontograma(p){
  const items=[],o=p.odontograma||{};
  Object.keys(o).sort((a,b)=>+a-+b).forEach(n=>{
    const d=o[n];
    codigosEstado(d).forEach(cod=>{
      if(SIMB_GENERAL[cod]&&SIMB_GENERAL[cod].c==='#E0564A')items.push({tratamiento:SIMB_GENERAL[cod].n,pieza:n,precio:''});
    });
    if(d.tratamientoPlan&&!items.some(it=>it.pieza===n&&it.tratamiento===d.tratamientoPlan))
      items.push({tratamiento:d.tratamientoPlan,pieza:n,precio:''});
    if(d.caras){
      const porEstado={};
      Object.entries(d.caras).forEach(([cara,est])=>{
        if(SIMB_CARA[est]&&SIMB_CARA[est].c==='#E0564A')porEstado[est]=(porEstado[est]||[]).concat(cara);
      });
      Object.entries(porEstado).forEach(([est,caras])=>{
        items.push({tratamiento:`${SIMB_CARA[est].n} (${caras.join('')})`,pieza:n,precio:''});
      });
    }
  });
  if(!items.length){avisar('No hay nada marcado en rojo ni tratamientos anotados en las piezas del odontograma actual');return;}
  p.presupuestos=p.presupuestos||[];
  const numero=`${new Date().getFullYear()}-${String(p.presupuestos.length+1).padStart(3,'0')}`;
  const nuevo={id:uid(),numero,fecha:hoy(),items,descuentoPct:0,estado:'Pendiente',notas:'Generado automáticamente a partir de lo marcado en rojo en el odontograma.'};
  p.presupuestos.push(nuevo);
  guardar();presupuestoEditando=nuevo.id;pestana='trat';pintarVista();
  avisar(`Presupuesto generado con ${items.length} tratamiento${items.length===1?'':'s'} pendientes — revisa y pon los precios`);
}

    const guardarCampoPieza=(campo,valor)=>{
      if(!verInicial)asegurarInicialAntesDePrimerCambio(p);
      const obj2=verInicial?p.odontogramaInicial.dientes:p.odontograma;
      const nd=obj2[piezaSeleccionada]||{};
      if(valor)nd[campo]=valor;else delete nd[campo];
      obj2[piezaSeleccionada]=nd;guardar();
    };
    const movSel=c.querySelector('#pz_mov'),recSel=c.querySelector('#pz_rec');
    if(movSel)movSel.onchange=()=>guardarCampoPieza('mov',movSel.value);
    if(recSel)recSel.onchange=()=>guardarCampoPieza('rec',recSel.value);
    const pendienteChk=c.querySelector('#pz_pendiente'),fechaInp=c.querySelector('#pz_fecha');
    if(pendienteChk)pendienteChk.onchange=()=>{if(fechaInp)fechaInp.style.visibility=pendienteChk.checked?'visible':'hidden';};
    const cancelarBtn=c.querySelector('[data-cancelarpieza]');
    if(cancelarBtn)cancelarBtn.onclick=()=>pintarVista();
    const guardarBtn=c.querySelector('[data-guardarpieza]');
    if(guardarBtn)guardarBtn.onclick=()=>{
      if(!verInicial)asegurarInicialAntesDePrimerCambio(p);
      const obj2=verInicial?p.odontogramaInicial.dientes:p.odontograma;
      const nd=obj2[piezaSeleccionada]||{};
      const diagInp=c.querySelector('#pz_diag'),tratInp=c.querySelector('#pz_trat'),notaInp=c.querySelector('#pz_nota');
      if(diagInp&&diagInp.value.trim())nd.diagnostico=diagInp.value.trim();else delete nd.diagnostico;
      if(notaInp&&notaInp.value.trim())nd.nota=notaInp.value.trim();else delete nd.nota;
      if(tratInp&&tratInp.value.trim())nd.tratamientoPlan=tratInp.value.trim();else delete nd.tratamientoPlan;
      if(pendienteChk&&pendienteChk.checked){nd.pendiente=true;nd.fechaPendiente=fechaInp?fechaInp.value:'';}else{delete nd.pendiente;delete nd.fechaPendiente;}
      obj2[piezaSeleccionada]=nd;guardar();avisar(nd.tratamientoPlan?'Datos guardados — el tratamiento también aparece en la pestaña Tratamientos':'Datos de la pieza guardados');pintarVista();
    };
  }
  c.querySelectorAll('[data-accrapida]').forEach(el=>el.onclick=()=>{
    if(!piezaSeleccionada)return;
    if(!verInicial)asegurarInicialAntesDePrimerCambio(p);
    const obj2=verInicial?p.odontogramaInicial.dientes:p.odontograma;
    const nd=obj2[piezaSeleccionada]||{};
    const clave=el.dataset.accrapida;
    if(clave==='caries'||clave==='restauracion'){
      nd.caras=nd.caras||{};const tipo=clave==='caries'?'caries':'obturado';
      ['V','M','O','D','L'].forEach(k=>nd.caras[k]=tipo);
    }else if(clave.startsWith('grupo:')){
      const grupo=ESTADO_GRUPOS.find(g=>g.clave===clave.slice(6));
      alternarEstadoGrupo(nd,grupo,modoPendienteActual(nd));
    }
    obj2[piezaSeleccionada]=nd;guardar();pintarVista();
  });
}
function asegurarInicialAntesDePrimerCambio(p){
  if(!p.odontogramaInicial){
    p.odontogramaInicial={dientes:JSON.parse(JSON.stringify(p.odontograma||{})),fecha:hoy(),auto:true};
  }
}
/* Piezas tratadas: si en el inicial no tenían nada marcado, se anota «caries» (en las caras tratadas) porque el tratamiento lo implica. */
function completarInicialDesdeLineas(dientes,lineas){
  (lineas||[]).forEach(l=>{
    const k=claveTratOdonto(l.trat);if(!k)return;
    const mapa=TRAT_A_ODONTO[k];if(mapa.estado==='perdida_caries'||mapa.estado==='sellante_real'||mapa.estado==='implante_real')return;
    piezasDeTexto(l.pieza).forEach(n=>{
      const nd=dientes[n]||{};
      if(Object.keys(nd.caras||{}).length||nd.general)return;
      nd.caras=nd.caras||{};
      const tp=tipoPieza(n),cs=mapa.tipo==='cara'?((l.caras||[]).length?l.caras:[(tp==='molar'||tp==='premolar')?'O':'V']):['V','M','O','D','L'];
      cs.forEach(c=>{if(['V','M','O','D','L'].includes(c))nd.caras[c]='caries';});
      dientes[n]=nd;
    });
  });
}
function reconstruirInicial(p){
  if(!confirm('Se rehará el odontograma inicial a partir del odontograma actual, anotando como «caries» las piezas/caras que ya fueron tratadas y que no tenían nada marcado. Lo que ya está marcado en el inicial se conserva. ¿Continuar?'))return;
  const base=JSON.parse(JSON.stringify((p.odontogramaInicial&&p.odontogramaInicial.dientes)||{}));
  Object.keys(base).length||Object.assign(base,{});
  const ya=Object.keys(base).length?base:{};
  const lineas=[];(p.tratamientos||[]).forEach(t=>(t.lineas||[]).forEach(l=>lineas.push(l)));
  completarInicialDesdeLineas(ya,lineas);
  p.odontogramaInicial={dientes:ya,fecha:(p.odontogramaInicial&&p.odontogramaInicial.fecha)||hoy()};
  guardar();avisar('Odontograma inicial reconstruido');pintarVista();
}
/* El odontograma inicial se guarda solo: mientras el paciente no tenga tratamientos registrados, sigue al odontograma actual.
   Al registrar el primer tratamiento queda congelado. Los iniciales ya guardados (sin marca auto) no se tocan. */
/* Sesiones guardadas con «Procedimientos» vacío pero con tratamientos en sus líneas: se completa el texto (solo si estaba vacío). */
function completarProcedimientosVacios(){
  (datos.pacientes||[]).forEach(p=>(p.tratamientos||[]).forEach(t=>{
    if(!(t.proc||'').trim()&&(t.lineas||[]).some(l=>(l.trat||'').trim()))t.proc=procSesion(t);
  }));
}
function sincronizarInicialAuto(){
  if(typeof vistaOdontoInicial!=='undefined'&&vistaOdontoInicial)return;
  (datos.pacientes||[]).forEach(p=>{
    const ini=p.odontogramaInicial;
    if((p.tratamientos||[]).length){if(ini&&ini.auto)delete ini.auto;return;}
    if(ini&&!ini.auto)return;
    const od=p.odontograma||{};
    if(!Object.keys(od).length&&!ini)return;
    p.odontogramaInicial={dientes:JSON.parse(JSON.stringify(od)),fecha:(ini&&ini.fecha)||hoy(),auto:true};
  });
}

/* ---------- tratamientos (barra 12) ---------- */
let presupuestoEditando=null;
function agruparTratPorEspecialidad(ts){
  const grupos={},orden=[];
  ts.forEach(t=>{
    let key='__general__',titulo='Odontología general (tú)';
    if(t.profesionalId){
      const prof=datos.profesionales.find(x=>x.id===t.profesionalId);
      if(prof&&prof.especialidad){key='esp:'+prof.especialidad;titulo=prof.especialidad;}
      else if(prof){key='prof:'+prof.id;titulo=prof.nombre;}
    }
    if(!grupos[key]){grupos[key]={titulo,items:[]};orden.push(key);}
    grupos[key].items.push(t);
  });
  orden.sort((a,b)=>(a==='__general__'?-1:1)-(b==='__general__'?-1:1));
  return orden.map(k=>grupos[k]);
}

        <td>${esc(t.dx||'')}${t.pieza?`<br><span class="mini">Pieza (FDI) ${esc(t.pieza)}${t.tipoOdonto?' · '+(t.tipoOdonto==='cara'?'por cara':'diente completo'):''}</span>`:''}</td>

function pendientesOdonto(p){
  const o=p.odontograma||{};
  return Object.keys(o).filter(n=>o[n]&&o[n].tratamientoPlan).sort((a,b)=>+a-+b)
    .map(n=>({pieza:n,tratamiento:o[n].tratamientoPlan,fecha:o[n].fechaPendiente||''}));
}
function registrarPendienteOdonto(n){
  const p=pac(selId),d=(p.odontograma||{})[n]||{};
  editarTrat(null,{pieza:n,dx:d.diagnostico||'',lineas:[{pieza:n,trat:d.tratamientoPlan||'',caras:[]}],_limpiarPlan:n});
}
function quitarPendienteOdonto(n){
  if(!confirm('¿Quitar este tratamiento pendiente de la pieza '+n+'?'))return;
  const p=pac(selId),d=(p.odontograma||{})[n];
  if(d){delete d.tratamientoPlan;delete d.fechaPendiente;}
  guardar();pintarVista();
}

        <div><span class="dx">${esc(x.tratamiento)}</span>

    <p class="mini" style="margin-top:-8px">Lo abonado aquí se suma automáticamente a la pestaña Pagos — es el mismo dinero, solo que aquí lo ves repartido por sesión. Los costos de laboratorio y honorarios de profesionales se manejan aparte, en «Gastos» (arriba), para no mostrarlos con el paciente en pantalla.</p>`;
  renderPresupuestos(p,document.getElementById('zonaPresupuestos'));

/* ---------- presupuestos / planes de tratamiento ---------- */
function renderPresupuestos(p,c){
  p.presupuestos=p.presupuestos||[];
  if(presupuestoEditando){renderEditorPresupuesto(p,c);return;}
  const rs=[...p.presupuestos].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  c.innerHTML=`<div class="bloque"><div class="barra-tit"><h3>Presupuestos</h3>
      <button class="btn chico der" onclick="nuevoPresupuesto()">Nuevo presupuesto</button></div>
    ${rs.length?rs.map(x=>{
      const t=totalPresupuesto(x);
      return `<div class="evo">
        <div class="fecha">${fechaCorta(x.fecha)}</div>
        <div><span class="dx">#${esc(x.numero||'')} — ${usd(t.total)}</span>
          <span class="mini" style="margin-left:8px;color:${x.estado==='Aceptado'?'var(--clinico)':x.estado==='Rechazado'?'var(--alerta)':'var(--tinta-suave)'}">${esc(x.estado||'Pendiente')}</span>
          <p class="mini">${(x.items||[]).length} tratamiento${(x.items||[]).length===1?'':'s'}</p>

    }).join(''):'<p class="mini">Este paciente aún no tiene presupuestos.</p>'}</div>`;

function totalPresupuesto(x){
  const subtotal=(x.items||[]).reduce((s,it)=>s+(Number(it.precio)||0),0);
  const descuento=subtotal*((Number(x.descuentoPct)||0)/100);
  return {subtotal,descuento,total:subtotal-descuento};
}

function nuevoPresupuesto(){
  const p=pac(selId);p.presupuestos=p.presupuestos||[];
  const numero=`${new Date().getFullYear()}-${String(p.presupuestos.length+1).padStart(3,'0')}`;
  const x={id:uid(),numero,fecha:hoy(),items:[{}],descuentoPct:0,estado:'Pendiente',notas:''};
  p.presupuestos.push(x);guardar();presupuestoEditando=x.id;pintarVista();

function editarPresupuestoId(id){presupuestoEditando=id;pintarVista();}

function borrarPresupuestoLista(id){if(!confirm('¿Eliminar este presupuesto?'))return;
  const p=pac(selId);p.presupuestos=p.presupuestos.filter(x=>x.id!==id);guardar();pintarVista();}
/* Al aceptar un presupuesto, cada tratamiento con pieza queda anotado como pendiente en esa pieza del odontograma
   (se ve en Tratamientos → «Pendientes del odontograma»). No pisa lo que ya estaba anotado. */
function pasarPresupuestoAPendientes(p,x){
  asegurarInicialAntesDePrimerCambio(p);
  p.odontograma=p.odontograma||{};let n=0;
  (x.items||[]).forEach(it=>{
    if(!it.tratamiento)return;
    const piezas=(String(it.pieza||'').match(/\d{1,2}/g)||[]).filter(v=>(+v>=11&&+v<=48)||(+v>=51&&+v<=85));
    piezas.forEach(num=>{const nd=p.odontograma[num]||{};
      if(!nd.tratamientoPlan){nd.tratamientoPlan=it.tratamiento;p.odontograma[num]=nd;n++;}});
  });
  if(n){guardar();avisar(`Presupuesto aceptado: ${n} tratamiento${n===1?'':'s'} pasaron a «Pendientes del odontograma» (pestaña Tratamientos)`);}
}

  c.querySelectorAll('[data-pk]').forEach(el=>el.onchange=()=>{x[el.dataset.pk]=el.value;guardar();

/* ---------- sesión de tratamiento: líneas «pieza + tratamiento + caras» que se aplican solas al odontograma ---------- */
const PIEZA_VALIDA=n=>{const v=+n;return (v>=11&&v<=48)||(v>=51&&v<=85);};
const piezasDeTexto=txt=>(String(txt||'').match(/\d{1,2}/g)||[]).filter(PIEZA_VALIDA);
function endodonciaSugerida(n){
  const t=tipoPieza(n);
  if(t==='molar')return 'Endodoncia multirradicular';
  if(t==='premolar'&&esSuperiorPieza(n))return 'Endodoncia birradicular';
  return 'Endodoncia unirradicular';
}
const TRAT_SUGERIDO={extraccion:'Exodoncia simple',corona_ind:'Corona',puente_ind:'Puente',removible_ind:'Prótesis parcial removible',
  total_ind:'Prótesis total',implante_ind:'Colocación de implante',sellante_nec:'Sellante'};
function carasConCaries(p,n){
  const d=(p.odontograma||{})[n];
  return d&&d.caras?['V','M','O','D','L'].filter(k=>d.caras[k]==='caries'):[];
}
function tratamientoParaCaries(nCaras){return nCaras<=1?'Restauración simple':nCaras===2?'Restauración compuesta':'Restauración compleja';}
/* Qué le falta hacer a este paciente, según su odontograma: cada sugerencia se convierte en una línea con un toque. */
function sugerenciasSesion(p){
  const out=[],o=p.odontograma||{};
  const todos=Object.values(CATALOGO_TRATAMIENTOS).flat();
  Object.keys(o).sort((a,b)=>+a-+b).forEach(n=>{
    const d=o[n];if(!d||!PIEZA_VALIDA(n))return;
    const caries=carasConCaries(p,n);
    if(caries.length)out.push({pieza:n,trat:tratamientoParaCaries(caries.length),caras:caries,texto:`${n} · Caries (${caries.join(', ')})`});
    codigosEstado(d).forEach(cod=>{
      if(!esPendienteSegunCodigo(cod))return;
      const trat=cod==='endo_nec'?endodonciaSugerida(n):TRAT_SUGERIDO[cod];
      if(trat)out.push({pieza:n,trat,caras:[],texto:`${n} · ${SIMB_GENERAL[cod].n}`});
    });
    if(d.tratamientoPlan){
      const plan=d.tratamientoPlan.trim();
      const enCat=todos.find(x=>x.toLowerCase()===plan.toLowerCase());
      const trat=enCat||plan;
      if(!out.some(x=>x.pieza===n&&x.trat.toLowerCase()===trat.toLowerCase()))
        out.push({pieza:n,trat,caras:enCat&&tipoTratamiento(enCat)==='cara'?carasConCaries(p,n):[],texto:`${n} · ${plan}`});
    }
  });
  return out;
}
/* Lo que se hizo en una sesión: lo escrito en «Procedimientos» o, si está vacío, lo que dicen sus líneas de tratamiento. */
function procSesion(t){
  const p=(t.proc||'').trim();if(p)return p;
  return (t.lineas||[]).filter(l=>(l.trat||'').trim()).map(l=>textoLinea(l)).join('\n');
}
function nombreSesion(t){return procSesion(t)||(t.dx||'').trim();}
function textoLinea(l){
  const caras=(l.caras||[]).length?' ('+l.caras.join('')+')':'';
  return `${l.trat}${caras}${(l.pieza||'').trim()?' — pieza '+l.pieza.trim():''}`;
}
/* Aplica una línea al odontograma. Devuelve un texto si algo quedó pendiente de completar. */
function aplicarLineaAOdonto(p,l,registro){
  const mapa=TRAT_A_ODONTO[claveTratOdonto(l.trat)];
  if(!mapa)return '';
  const piezas=piezasDeTexto(l.pieza);
  if(!piezas.length)return `falta la pieza de «${l.trat}»`;
  /* si no marcaste caras, se pinta la cara principal (oclusal en molares y premolares, vestibular en el resto) y se avisa */
  if(mapa.tipo==='cara'&&!(l.caras||[]).length){
    const tp=tipoPieza(piezas[0]);
    l.caras=[(tp==='molar'||tp==='premolar')?'O':'V'];
    l.carasAsumidas=true;
  }
  asegurarInicialAntesDePrimerCambio(p);
  p.odontograma=p.odontograma||{};
  piezas.forEach(n=>{
    const previo=p.odontograma[n]?JSON.parse(JSON.stringify(p.odontograma[n])):null;
    const nd=p.odontograma[n]||{};
    if(mapa.tipo==='general'){
      if(mapa.estado==='perdida_caries')guardarCodigosEstado(nd,[mapa.estado]); // el diente ya no está: quedan solo «ausente»
      else{const g=grupoDeEstado(mapa.estado);if(g)ponerEstadoGrupo(nd,g,mapa.estado);else nd.general=mapa.estado;}
    }else{
      nd.caras=nd.caras||{};l.caras.forEach(k=>{nd.caras[k]=mapa.estado;});
    }
    p.odontograma[n]=nd;
    if(registro)registro.push({pieza:n,previo,despues:JSON.parse(JSON.stringify(nd)),tipo:mapa.tipo,estado:mapa.estado,caras:mapa.tipo==='cara'?[...l.caras]:null});
  });
  return '';
}
/* Deshace en el odontograma lo que pintó una sesión. Devuelve las piezas que cambió. */
function revertirRegistroOdonto(p,reg){
  const piezas=[];
  const igual=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  [...(reg||[])].reverse().forEach(e=>{
    const od=p.odontograma=p.odontograma||{};
    const act=od[e.pieza];if(!act)return;
    if(igual(act,e.despues)){
      if(e.previo&&Object.keys(e.previo).length)od[e.pieza]=JSON.parse(JSON.stringify(e.previo));else delete od[e.pieza];
      piezas.push(e.pieza);return;
    }
    // la pieza se tocó después: se deshace solo lo que esta sesión puso
    let toco=false;
    if(e.tipo==='cara'){
      (e.caras||[]).forEach(k=>{
        if(act.caras&&act.caras[k]===e.estado){
          const antes=e.previo&&e.previo.caras&&e.previo.caras[k];
          if(antes)act.caras[k]=antes;else delete act.caras[k];toco=true;}
      });
      if(act.caras&&!Object.keys(act.caras).length)delete act.caras;
    }else if(igual(act.general,e.despues.general)&&igual(act.adicionales,e.despues.adicionales)){
      ['general','adicionales'].forEach(k=>{if(e.previo&&e.previo[k]!==undefined)act[k]=JSON.parse(JSON.stringify(e.previo[k]));else delete act[k];});
      toco=true;
    }
    if(!Object.keys(act).length)delete od[e.pieza];
    if(toco)piezas.push(e.pieza);
  });
  return [...new Set(piezas)];
}
/* Sesiones guardadas antes de que existiera el registro: se deduce de las líneas (usa el odontograma inicial como referencia). */
function revertirSesionAntigua(p,t){
  const piezas=[],od=p.odontograma=p.odontograma||{},ini=(p.odontogramaInicial&&p.odontogramaInicial.dientes)||{};
  (t.lineas||[]).forEach(l=>{
    const k=claveTratOdonto(l.trat);if(!k)return;const mapa=TRAT_A_ODONTO[k];
    piezasDeTexto(l.pieza).forEach(n=>{
      const act=od[n];if(!act)return;
      if(mapa.tipo==='cara'){
        const cs=(l.caras&&l.caras.length)?l.caras:[(tipoPieza(n)==='molar'||tipoPieza(n)==='premolar')?'O':'V'];
        let toco=false;
        cs.forEach(c=>{if(act.caras&&act.caras[c]===mapa.estado){
          const antes=ini[n]&&ini[n].caras&&ini[n].caras[c];
          if(antes&&antes!==mapa.estado)act.caras[c]=antes;else delete act.caras[c];toco=true;}});
        if(act.caras&&!Object.keys(act.caras).length)delete act.caras;
        if(toco)piezas.push(n);
      }else if(codigosEstado(act).includes(mapa.estado)){
        const i0=ini[n]||{};
        ['general','adicionales'].forEach(c=>{if(i0[c]!==undefined)act[c]=JSON.parse(JSON.stringify(i0[c]));else delete act[c];});
        piezas.push(n);
      }
      if(!Object.keys(act).length)delete od[n];
    });
  });
  return [...new Set(piezas)];
}
/* Costo que ya acordaste en un presupuesto aceptado para esa pieza y tratamiento. */
function precioPresupuestado(p,l){
  const piezas=piezasDeTexto(l.pieza);
  let total=0;
  (p.presupuestos||[]).filter(x=>x.estado==='Aceptado').forEach(x=>(x.items||[]).forEach(it=>{
    if((it.tratamiento||'').toLowerCase()!==(l.trat||'').toLowerCase())return;
    const ip=piezasDeTexto(it.pieza);
    if(piezas.length&&ip.length&&piezas.every(n=>ip.includes(n)))total+=(Number(it.precio)||0)*(piezas.length/ip.length);
  }));
  return total;
}

    }
    guardar();pintar();avisar('Sesión guardada'+avisoOdonto);
    sincronizarProximaCita(p.id,'tratamiento',d.id,d.prox,nombreSesion(d)||'Control de tratamiento',d.proxHora);
    // lo que sigue solo para sesiones nuevas: primero el aviso de consentimiento y luego el cobro
    if(!id){
      const _faltan=consentimientosFaltantes(p,[...lineasOk.map(l=>l.trat),d.proc||'']);
      if(_faltan.length)encolarModal(()=>avisarConsentimientoFaltante(p.id,_faltan));

  $('#t_elegirPieza').onclick=()=>{
    abrirSelectorDiente(num=>{
      const actual=$('#t_pieza').value.trim();
      $('#t_pieza').value=actual?actual+', '+num:num;
    });
  };
  // ---- líneas «pieza + tratamiento + caras» ----
  const procTxt=$('#t_proc'),costoInp=$('#t_costo');
  let costoAuto=null;
  procTxt.addEventListener('input',()=>{procManual=true;});
  const recomponer=()=>{
    if(!procManual){
      procTxt.value=lineas.filter(l=>(l.trat||'').trim()).map(textoLinea).join('\n');
      lineas.forEach(l=>{l._txProc=(l.trat||'').trim()?textoLinea(l):'';});
    }else{
      /* aunque hayas escrito a mano en «Procedimientos», cada tratamiento que agregues arriba se suma ahí (sin borrar lo tuyo) */
      let cur=procTxt.value;
      lineas.forEach(l=>{
        const tx=(l.trat||'').trim()?textoLinea(l):'',old=l._txProc||'';
        if(tx===old)return;
        if(old&&cur.includes(old))cur=cur.replace(old,tx).replace(/\n{2,}/g,'\n').replace(/^\n|\n$/g,'');
        else if(tx&&!cur.includes(tx))cur=(cur.trim()?cur.replace(/\s+$/,'')+'\n':'')+tx;
        l._txProc=tx;
      });
      procTxt.value=cur;
    }
    // costo sugerido desde un presupuesto aceptado (solo si el campo está vacío o es el sugerido anterior)
    const sug=lineas.reduce((acc,l)=>acc+precioPresupuestado(p,l),0);
    if(sug>0&&(costoInp.value===''||Number(costoInp.value)===costoAuto)){costoInp.value=sug.toFixed(2);costoAuto=Number(sug.toFixed(2));}
    let hint=document.getElementById('t_costoHint');
    if(!hint){hint=document.createElement('p');hint.id='t_costoHint';hint.className='mini';hint.style.margin='-4px 0 8px';costoInp.closest('.grid').after(hint);}
    hint.textContent=sug>0?`Costo tomado de tu presupuesto aceptado: ${usd(sug)}. Puedes cambiarlo.`:'';
    avisoConsentSesion(p,lineas,!id);
  };
  const pintarSugs=()=>{
    const ya=l=>lineas.some(x=>(x.pieza||'').trim()===l.pieza&&(x.trat||'').toLowerCase()===l.trat.toLowerCase());
    const sugs=sugerenciasSesion(p).filter(x=>!ya(x));
    const cont=$('#t_sugs');
    cont.innerHTML=sugs.length?`<span class="mini" style="align-self:center">Pendiente en el odontograma:</span>`+
      sugs.map((x,i)=>`<button type="button" class="btn chico" data-sug="${i}" title="Agregar «${esc(x.trat)}» a esta sesión">${esc(x.texto)} ＋</button>`).join(''):'';
    cont.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{
      const x=sugs[b.dataset.sug];
      lineas.push({pieza:x.pieza,trat:x.trat,caras:[...x.caras]});pintarLineas();
    });
  };
  const pintarLineas=()=>{
    const cont=$('#t_lineas');
    cont.innerHTML=lineas.length?lineas.map((l,i)=>{
      const tipo=tipoTratamiento(l.trat);l._tipo=tipo;
      return `<div class="t-linea" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;padding:6px;border:1px solid var(--linea);border-radius:9px">
        <input type="text" data-l="${i}-pieza" value="${esc(l.pieza||'')}" placeholder="Pieza" style="width:70px" title="Número FDI de la pieza (ej. 16)">
        <input type="text" list="dl_cat_trat" data-l="${i}-trat" value="${esc(l.trat||'')}" placeholder="Tratamiento (elige o escribe)" style="flex:1;min-width:240px">
        ${tipo==='cara'?`<span class="chks" style="display:flex;gap:4px;align-items:center"><span class="mini">Caras:</span>${CARAS.map(([k,n])=>
          `<label class="chk" title="${esc(nombreCara(k,l.pieza))}"><input type="checkbox" data-lc="${i}" value="${k}" ${(l.caras||[]).includes(k)?'checked':''}> ${letraCara(k,l.pieza)}</label>`).join('')}</span>`:''}
        <button type="button" class="btn chico peligro" data-lx="${i}" title="Quitar esta línea">✕</button></div>`;
    }).join(''):'<p class="mini" style="margin:0">Aún no agregaste tratamientos. Usa una sugerencia o «+ Agregar tratamiento».</p>';
    cont.querySelectorAll('[data-l]').forEach(el=>{
      const [i,campo]=el.dataset.l.split('-');
      el.oninput=()=>{if(!lineas[i])return;lineas[i][campo]=el.value;if(campo==='trat')recomponer();};
      // al salir del campo: solo se repinta la línea si hace falta mostrar/ocultar las caras (así no se pierde el cursor al pasar de pieza a tratamiento)
      el.onchange=()=>{
        const l=lineas[i];if(!l)return;
        l[campo]=el.value;
        const tipo=tipoTratamiento(l.trat);
        let repintar=tipo!==l._tipo;
        if(tipo==='cara'&&!(l.caras||[]).length&&piezasDeTexto(l.pieza).length===1){
          const cc=carasConCaries(p,piezasDeTexto(l.pieza)[0]);
          if(cc.length){l.caras=cc;repintar=true;}
        }
        l._tipo=tipo;
        recomponer();pintarSugs();
        if(repintar)pintarLineas();
      };
    });
    cont.querySelectorAll('[data-lc]').forEach(el=>el.onchange=()=>{
      const l=lineas[el.dataset.lc];l.caras=l.caras||[];
      if(el.checked){if(!l.caras.includes(el.value))l.caras.push(el.value);}else l.caras=l.caras.filter(k=>k!==el.value);
      lineas[el.dataset.lc]=l;recomponer();
    });
    /* se actúa al presionar (antes de que el campo pierda el foco y se repinte la línea); así se quita al primer clic */
    cont.querySelectorAll('[data-lx]').forEach(b=>{
      let hecho=false;
      const quitarLinea=()=>{if(hecho)return;hecho=true;
      const quitada=lineas.splice(+b.dataset.lx,1)[0];
      if(procManual&&quitada&&quitada._txProc&&procTxt.value.includes(quitada._txProc))procTxt.value=procTxt.value.replace(quitada._txProc,'').replace(/\n{2,}/g,'\n').replace(/^\n|\n$/g,'');
      recomponer();pintarLineas();pintarSugs();};
      b.onpointerdown=e=>{if(e.button)return;e.preventDefault();quitarLinea();};
      b.onclick=quitarLinea;
    });
    recomponer();
  };
  $('#t_addLinea').onclick=()=>{lineas.push({pieza:'',trat:'',caras:[]});pintarLineas();};
  pintarLineas();pintarSugs();
}
function borrarItem(lista,id){const p=pac(selId);
  if(lista==='tratamientos'){
    const t=p.tratamientos.find(x=>x.id===id);if(!t)return;
    const tieneReg=t.odontoAplicado&&t.odontoAplicado.length;
    const pz=[...new Set(tieneReg?t.odontoAplicado.map(e=>e.pieza):(t.lineas||[]).flatMap(l=>claveTratOdonto(l.trat)?piezasDeTexto(l.pieza):[]))];
    if(!confirm('¿Eliminar esta sesión?'+(pz.length?`\n\nEl odontograma volverá a como estaba antes en la${pz.length===1?' pieza':'s piezas'} ${pz.join(', ')}.`:'')))return;
    const rev=tieneReg?revertirRegistroOdonto(p,t.odontoAplicado):revertirSesionAntigua(p,t);
    p.tratamientos=p.tratamientos.filter(x=>x.id!==id);guardar();pintar();
    if(rev.length)avisar('Sesión eliminada · odontograma restablecido en '+rev.join(', '));
    return;
  }
  if(!confirm('¿Eliminar este registro?'))return;
  p[lista]=p[lista].filter(x=>x.id!==id);guardar();pintar();}

function sincronizarCuotaConControl(p,fechaProximoControl){
  const o=p.orto;
  if(!fechaProximoControl||!o||!o.cuotas||!o.cuotas.length)return;
  const pendientes=o.cuotas.filter(q=>!q.pagada&&!q.esEntrada).sort((a,b)=>(a.fechaVenc||'').localeCompare(b.fechaVenc||''));
  if(!pendientes.length)return;
  pendientes[0].fechaVenc=fechaProximoControl;
  guardar();
}

function generarCuotasOrto(){
  const p=pac(selId),o=p.orto;o.plan=o.plan||{};const plan=o.plan;
  const cuota=Number(plan.cuotaMensual)||0,n=Number(plan.numCuotas)||0;
  const entrada1=Number(plan.montoInicial)||0,entrada2=Number(plan.montoInicial2)||0;
  if(cuota<=0||n<=0){avisar('Define primero la cuota mensual y el número de cuotas');return;}
  if((o.cuotas||[]).length&&!confirm('Ya existen cuotas generadas. Esto crea un cronograma nuevo y se pierden los pagos ya marcados en las cuotas actuales. ¿Continuar?'))return;
  const inicio=plan.fechaInicio||hoy();
  const partes=inicio.split('-').map(Number);
  const dia=Number(plan.diaPago)||partes[2]||1;
  const cuotas=[];
  if(entrada1>0)cuotas.push({id:uid(),numero:0,esEntrada:true,entradaNum:1,fechaVenc:inicio,monto:entrada1,pagada:false});
  if(entrada2>0)cuotas.push({id:uid(),numero:0,esEntrada:true,entradaNum:2,fechaVenc:inicio,monto:entrada2,pagada:false});
  // La cuota 1 siempre cae un mes después de la fecha de inicio (donde van las entradas),
  // haya 1, 2 o ninguna entrada — así nunca coincide con la fecha de las entradas.
  for(let i=0;i<n;i++){
    const f=new Date(partes[0],partes[1]-1+i+1,Math.min(dia,28));
    cuotas.push({id:uid(),numero:i+1,fechaVenc:f.toISOString().slice(0,10),monto:cuota,pagada:false});
  }
  o.cuotas=cuotas;guardar();pintarVista();avisar('Cronograma de cuotas generado');
}
function agregarCuotaManual(){
  const p=pac(selId),o=p.orto;o.cuotas=o.cuotas||[];
  const n=(o.cuotas.length?Math.max(...o.cuotas.map(x=>x.numero||0)):0)+1;
  o.cuotas.push({id:uid(),numero:n,fechaVenc:hoy(),monto:Number(o.plan?.cuotaMensual)||0,pagada:false});
  guardar();pintarVista();
}

const MEDICAMENTOS_FLAT=Object.values(CATALOGO_MEDICAMENTOS).flat();
function numeroALetras(n){
  n=Math.round(Number(n)||0);
  if(n<=0)return 'cero';
  const unidades=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
  const especiales={10:'diez',11:'once',12:'doce',13:'trece',14:'catorce',15:'quince',16:'dieciséis',17:'diecisiete',18:'dieciocho',19:'diecinueve',20:'veinte'};
  const decenas=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const centenas=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const dosDigitos=v=>{
    if(v<10)return unidades[v];
    if(especiales[v])return especiales[v];
    if(v<30)return 'veinti'+unidades[v-20];
    const d=Math.floor(v/10),u=v%10;
    return decenas[d]+(u?' y '+unidades[u]:'');
  };
  const tresDigitos=v=>{
    if(v===100)return 'cien';
    const c=Math.floor(v/100),resto=v%100;
    let s=c>0?centenas[c]:'';
    if(resto>0)s+=(s?' ':'')+dosDigitos(resto);
    return s;
  };
  if(n<1000)return tresDigitos(n);
  return String(n);
}

function extraerVecesPorDia(texto){
  texto=texto||'';
  let m=texto.match(/cada\s+(\d+)\s*horas?/i);
  if(m)return Math.max(1,Math.round(24/(+m[1])));
  m=texto.match(/(\d+)\s*veces\s*al\s*d[ií]a/i);
  if(m)return +m[1];
  return null;
}
function extraerDias(texto){
  texto=texto||'';
  const nums=[...texto.matchAll(/(\d+)/g)];
  if(!nums.length)return null;
  return +nums[nums.length-1][1]; // en rangos "3 a 5 días" toma el más alto, más seguro
}
function recalcularCantidadMedicamento(r,i){
  const item=r.medicamentos[i];
  if(!item._unidad||!item._unidadPlural)return; // solo si vino originalmente del catálogo
  const veces=extraerVecesPorDia(item.dosis),dias=extraerDias(item.duracion);
  if(veces&&dias){
    const total=veces*dias;
    item.cantidad=`${total} (${numeroALetras(total)}) ${total===1?item._unidad:item._unidadPlural}`;
    guardar();pintarVista();
  }
}

function hojaReceta(r,p){

function imprimirReceta(id){

async function generarPDFReceta(id){
  const p=pac(selId),r=p.recetas.find(x=>x.id===id);
  $('#impresion').innerHTML=hojaReceta(r,p);
  document.body.classList.add('imprimiendo');
  try{
    const hoja=$('#impresion').querySelector('.hoja');
    const canvas=await html2canvas(hoja,{scale:2,backgroundColor:'#ffffff'});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4'});
    const anchoMM=210,altoMM=(canvas.height*anchoMM)/canvas.width;
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,anchoMM,altoMM);
    const nombreArchivo=`receta-${(p.nombre||'paciente').replace(/[^a-z0-9]+/gi,'-')}-${r.fecha||hoy()}.pdf`;
    return {blob:pdf.output('blob'),nombreArchivo};
  }finally{
    document.body.classList.remove('imprimiendo');
  }
}

function numeroWhatsappPaciente(p){
  let tel=telWhatsapp(p.telefono);
  if(!tel){
    const ingresado=prompt('Este paciente no tiene teléfono registrado. Escribe su número de WhatsApp (ej. 0991234567):');
    if(!ingresado||!ingresado.trim())return '';
    tel=telWhatsapp(ingresado);
    if(!tel){avisar('Ese número no parece válido');return '';}
    p.telefono=ingresado.trim();guardar();
  }
  return tel;
}

/* Texto de una plantilla: la versión que editó el usuario (si la guardó) o la original. Se guarda con {nombre}, {fecha}… */
function textoPlantillaWsp(id){
  const ov=(datos.config&&datos.config.plantillasWsp)||{};
  if(ov[id]!==undefined)return ov[id];
  const base=PLANTILLAS_WSP.find(x=>x.id===id);
  return base?base.texto:'';
}
/* Al guardar lo que se editó, los datos del paciente vuelven a ser {variables} para que sirva con cualquier paciente. */
function aPlantillaDesdeTexto(texto,vars){
  let t=texto;
  Object.entries(vars).filter(([k,v])=>typeof v==='string'&&v.length>=2&&!/^\[.*\]$/.test(v))
    .sort((a,b)=>b[1].length-a[1].length)
    .forEach(([k,v])=>{t=t.split(v).join('{'+k+'}');});
  return t;
}
function rellenarPlantilla(texto,vars){
  return String(texto).replace(/\{(\w+)\}/g,(m,k)=>vars[k]!==undefined?vars[k]:m);
}
function nombreDiaFecha(f){
  if(!f)return '';
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const d=new Date(f+'T00:00:00');
  return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
}
/* Variables de una plantilla para un paciente: usa su próxima cita agendada, si tiene. */
function variablesPlantillaWsp(p,idPlantilla,ctx){
  const g=datos.config||{};
  const proximas=(datos.citas||[]).filter(c=>(c.pacienteId===p.id||(!c.pacienteId&&buscarPacientePorNombre(c.nombre)===p))
      &&c.fecha>=hoy()&&c.estado!=='Cancelada')
    .sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const prox=(idPlantilla==='orto_control'&&proximas.find(c=>c.origen&&c.origen.tipo==='ortoControl'))||proximas[0];
  const sal=saldo(p);
  const dc=ctx&&ctx.cita?ctx.cita:null;   // si el mensaje sale desde una cita concreta, se usa la fecha y hora de esa cita
  return {nombre:p.nombre||'',consultorio:g.establecimiento||'nuestro consultorio',
    fecha:dc?nombreDiaFecha(dc.fecha):(prox?nombreDiaFecha(prox.fecha):'[fecha]'),hora:dc?dc.hora:(prox?prox.hora:'[hora]'),
    saldo:sal>0?usd(sal):'[monto]'};
}

      <button class="btn" type="button" id="wsp_restaurar" title="Vuelve al texto original de este mensaje">Restaurar original</button>

function textoRecetaWhatsapp(r,p){
  const est=datos.config&&datos.config.establecimiento;
  const meds=(r.medicamentos||[]).filter(m=>m.dci).map(m=>{
    const base=[m.dci,m.conc,m.forma].filter(Boolean).join(' ');
    const como=[m.dosis,m.duracion&&('por '+m.duracion)].filter(Boolean).join(' ');
    return '• '+base+(como?' — '+como:'');
  });
  return [`Hola ${p.nombre||''}, te comparto tu receta médica${est?' de '+est:''}.`,
    r.diagnostico?`Diagnóstico: ${r.diagnostico}`:'',
    meds.length?'Medicamentos:\n'+meds.join('\n'):'',
    r.indicaciones?`Indicaciones: ${r.indicaciones}`:'',

  $('#rw_chat').onclick=()=>window.open(`https://wa.me/${tel}?text=${encodeURIComponent(textoRecetaWhatsapp(r,p))}`,'_blank');
  let resultado;
  try{ resultado=await generarPDFReceta(id); }
  catch(e){ console.error(e); $('#rw_estado').textContent='No se pudo generar el PDF. Revisa tu conexión a internet e inténtalo de nuevo.'; return; }
  const {blob,nombreArchivo}=resultado;
  const archivo=new File([blob],nombreArchivo,{type:'application/pdf'});
  const puedeCompartir=!!(navigator.canShare&&navigator.canShare({files:[archivo]}));
  $('#rw_estado').textContent='✓ PDF listo: '+nombreArchivo;
  const btnDesc=$('#rw_descargar'),btnComp=$('#rw_compartir');
  btnDesc.disabled=false;
  btnDesc.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombreArchivo;a.click();
    avisar('PDF descargado. Adjúntalo en el chat con el clip (📎) → Documento.');};
  if(puedeCompartir){
    btnComp.style.display='';btnComp.disabled=false;
    $('#rw_ayuda').textContent='Al tocar «Enviar PDF por WhatsApp» elige WhatsApp y luego el chat de este paciente (aparece en «Recientes» después del paso 1).';
    btnComp.onclick=async()=>{
      try{await navigator.share({files:[archivo],title:'Receta médica'});}
      catch(e){if(e.name!=='AbortError'){console.error(e);avisar('No se pudo abrir el menú de compartir; usa «Descargar PDF».');}}

  }else{
    $('#rw_ayuda').textContent='En computadora: descarga el PDF y arrástralo al chat de WhatsApp (o usa el clip 📎 → Documento).';
  }
}

const RX_TIPOS=['Periapical','Bite-wing','Panorámica','Oclusal','Cefalométrica','Foto clínica','Otro'];
function claveRx(pacienteId,imgId){return `rximg:${pacienteId}:${imgId}`;}
function comprimirImagen(file){
  return new Promise((resolve,reject)=>{
    const lector=new FileReader();
    lector.onerror=()=>reject(new Error('lectura'));
    lector.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('imagen'));
      img.onload=()=>{
        const maxLado=1100;
        let w=img.width,h=img.height;
        if(w>maxLado||h>maxLado){const esc=maxLado/Math.max(w,h);w=Math.round(w*esc);h=Math.round(h*esc);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let calidad=0.72,url=cv.toDataURL('image/jpeg',calidad);
        while(url.length>820000&&calidad>0.3){calidad-=0.08;url=cv.toDataURL('image/jpeg',calidad);}
        resolve(url);
      };
      img.src=lector.result;
    };
    lector.readAsDataURL(file);
  });
}

const _soloDigitos=x=>String(x||'').replace(/\D/g,'');
function buscarDuplicados(d,excluirId){
  const res=[],tn=tokensNombre(d.nombre),ced=_soloDigitos(d.cedula),tel=_soloDigitos(d.telefono).slice(-9);
  (datos.pacientes||[]).forEach(p=>{
    if(p.id===excluirId)return;
    const m=[];
    if(ced.length>=5&&_soloDigitos(p.cedula)===ced)m.push('misma cédula');
    if(tel.length>=7&&_soloDigitos(p.telefono).slice(-9)===tel)m.push('mismo teléfono');
    const tp=tokensNombre(p.nombre);
    if(tn.length>=2&&tp.length>=2){
      const a=new Set(tn),b=new Set(tp);
      if(tn.length===tp.length&&tn.every(t=>b.has(t)))m.push('mismo nombre');
      else if(tn.every(t=>b.has(t))||tp.every(t=>a.has(t)))m.push('nombre parecido');
    }
    if(m.length)res.push({p,motivos:m});
  });
  return res;
}

function _rellenarVacios(dest,orig){
  Object.keys(orig||{}).forEach(k=>{

    if(a===undefined||a===null||a==='')dest[k]=JSON.parse(JSON.stringify(b));
    else if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b))_rellenarVacios(a,b);
  });
}

    fusionarPacientes(p.id,o.id);
  });

async function fusionarPacientes(keepId,dropId){
  const k=pac(keepId),o=pac(dropId);if(!k||!o||k===o)return;
  try{await snapPoner({clave:'antes:'+Date.now(),tipo:'antes',fecha:new Date().toISOString(),json:JSON.stringify(datos),pacientes:datos.pacientes.length});}catch(e){}
  // imágenes: están guardadas con el id del paciente, así que se copian a la ficha que se queda
  for(const [lista,clave] of [['fotografias',claveFoto],['radiografias',claveRx]]){
    for(const r of (o[lista]||[])){
      try{const v=await almacen.get(clave(o.id,r.id));const val=v&&v.value;
        if(val){await guardarImagen(clave(k.id,r.id),val);try{await almacen.delete(clave(o.id,r.id));}catch(e){}}}catch(e){}
    }
  }
  const SIMPLES=['id'];
  Object.keys(o).forEach(key=>{
    if(SIMPLES.includes(key))return;
    const a=k[key],b=o[key];
    if(Array.isArray(b)){
      k[key]=Array.isArray(a)?a:[];
      b.forEach(it=>{if(it&&it.id!==undefined&&k[key].some(x=>x&&x.id===it.id))return;k[key].push(it);});
    }else if(key==='alergias'){
      if(b&&a&&a!==b&&!String(a).toLowerCase().includes(String(b).toLowerCase()))k[key]=a+'; '+b;else if(!a)k[key]=b;
    }else if(b&&typeof b==='object'){
      if(!a||typeof a!=='object')k[key]=JSON.parse(JSON.stringify(b));
      else if(key==='odontograma'||key==='odontogramaInicial')_rellenarVacios(a,b);
      else _rellenarVacios(a,b);
    }else if(a===undefined||a===null||a==='')k[key]=b;
  });
  (datos.citas||[]).forEach(c=>{if(c.pacienteId===dropId)c.pacienteId=keepId;});
  (datos.tareas||[]).forEach(c=>{if(c.pacienteId===dropId)c.pacienteId=keepId;});
  datos.pacientes=datos.pacientes.filter(x=>x.id!==dropId);
  selId=keepId;guardar();pintar();avisar('Fichas fusionadas');
}
async function borrarPaciente(){const p=pac(selId);

let filtroListaPac='';
let ordenPacientes='nombre';
let filtroSoloOrto=false;
function esPacienteOrto(p){return !!(p.orto&&(p.orto.tipo||p.orto.inicio)&&!p.orto.altaRealizada);}
function verListaPacientes(){
  selId=null;ocultarPanel();renderListaPacientes();
}

    <div class="barra-pac" style="margin-top:16px">
      <input type="text" id="lp_buscar" placeholder="Buscar por nombre, cédula o teléfono…" value="${esc(filtroListaPac)}">

        <option value="nombre" ${ordenPacientes==='nombre'?'selected':''}>Ordenar por nombre</option>
        <option value="fecha" ${ordenPacientes==='fecha'?'selected':''}>Ordenar por fecha de registro</option>
        <option value="saldo" ${ordenPacientes==='saldo'?'selected':''}>Ordenar por saldo pendiente</option>
      </select>
      <label class="switch-wrap"><span class="switch"><input type="checkbox" id="lp_orto" ${filtroSoloOrto?'checked':''}><span class="slider"></span></span>Solo ortodoncia (${totalOrto})</label>
    </div>
    <div id="lpTabla"></div>`;
  $('#lp_buscar').oninput=(e)=>{filtroListaPac=e.target.value;actualizarTablaPacientes();};

  $('#lp_orto').onchange=(e)=>{filtroSoloOrto=e.target.checked;actualizarTablaPacientes();};
  actualizarTablaPacientes();
}
function actualizarTablaPacientes(){
  const q=filtroListaPac.trim().toLowerCase();
  let ps=datos.pacientes.filter(p=>!q||(p.nombre||'').toLowerCase().includes(q)||(p.cedula||'').includes(q)||(p.telefono||'').includes(q));
  if(filtroSoloOrto)ps=ps.filter(esPacienteOrto);
  if(ordenPacientes==='nombre')ps=[...ps].sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  else if(ordenPacientes==='fecha')ps=[...ps].sort((a,b)=>(b.apertura||'').localeCompare(a.apertura||''));
  else if(ordenPacientes==='saldo')ps=[...ps].sort((a,b)=>saldo(b)-saldo(a));
  const inicial=n=>(n||'?').trim().charAt(0).toUpperCase();
  document.getElementById('lpTabla').innerHTML=ps.length?`<table class="tabla-pac"><thead><tr>
      <th>Nombre</th><th>Fecha de registro</th><th>Teléfono</th><th class="der">Por cobrar</th><th class="der">Total pagado</th></tr></thead><tbody>
      ${ps.map(p=>{const d=saldo(p);
        return `<tr class="fila-pac" onclick="abrir('${p.id}')">
          <td><span class="avatar">${esc(inicial(p.nombre))}</span>${esc(p.nombre||'Sin nombre')}${esPacienteOrto(p)?' <span class="mini" style="color:var(--clinico)">🦷 Ortodoncia</span>':''}</td>
          <td class="num">${p.apertura?fechaCorta(p.apertura):'—'}</td>
          <td class="num">${esc(p.telefono||'—')}</td>
          <td class="der" style="color:${d>0.004?'var(--alerta)':'inherit'}">${usd(d)}</td>
          <td class="der">${usd(totalAbon(p))}</td></tr>`;}).join('')}
    </tbody></table>`
    :`<div class="bloque"><p class="mini">${filtroSoloOrto?'Ningún paciente en ortodoncia coincide con la búsqueda.':(datos.pacientes.length?'Ningún paciente coincide con la búsqueda.':'Aún no hay pacientes registrados. Usa «+ Nuevo paciente» para agregar el primero.')}</p></div>`;
}

/* ---------- tareas y seguimiento ---------- */
function diasHasta(f){if(!f)return null;return diasEntre(hoy(),f);}
function verTareas(){
  selId=null;ocultarPanel();renderTareas();
}
function renderTareas(){
  pintarLista();
  datos.tareas=datos.tareas||[];
  const todas=[...datos.tareas].sort((a,b)=>(a.fechaVence||'9999').localeCompare(b.fechaVence||'9999'));
  const pendientes=todas.filter(t=>!t.hecha);
  const hechas=todas.filter(t=>t.hecha);
  const atrasadas=pendientes.filter(t=>t.fechaVence&&t.fechaVence<hoy());
  const hoyMismo=pendientes.filter(t=>t.fechaVence===hoy());
  const proximas=pendientes.filter(t=>!t.fechaVence||t.fechaVence>hoy());
  const fila=t=>`<div class="evo" style="grid-template-columns:34px 1fr">
    <div><button class="check-pago ${t.hecha?'pagada':''}" onclick="alternarTarea('${t.id}')" title="${t.hecha?'Marcar pendiente':'Marcar hecha'}">${t.hecha?'✓':''}</button></div>
    <div style="cursor:pointer" onclick="abrirTarea('${t.id}')">
      <span class="dx" style="${t.hecha?'text-decoration:line-through;color:var(--tinta-suave)':''}">${esc(t.texto)}</span>
      ${t.pacienteId?`<button class="btn chico" style="padding:1px 8px;margin-left:6px" onclick="event.stopPropagation();abrir('${t.pacienteId}')">${esc(t.pacienteNombre||'')}</button>`
        :(t.pacienteNombre?`<span class="mini"> — ${esc(t.pacienteNombre)}</span>`:'')}
      ${t.fechaVence?`<p class="mini" style="color:${!t.hecha&&t.fechaVence<hoy()?'var(--alerta)':'var(--tinta-suave)'}">${fechaCorta(t.fechaVence)}</p>`:''}
    </div></div>`;
  $('#vista').innerHTML=`<div class="cabecera"><div><h2>Tareas y seguimiento</h2>
      <div class="sub">${pendientes.length} pendiente${pendientes.length===1?'':'s'}</div></div>
      <div class="spacer"></div><button class="btn primario" onclick="abrirTarea()">Nueva tarea</button></div>
    <div class="bloque"><div class="barra-tit"><h3>Atrasadas</h3></div>
      ${atrasadas.length?atrasadas.map(fila).join(''):'<p class="mini">Nada atrasado.</p>'}</div>
    <div class="bloque"><div class="barra-tit"><h3>Para hoy</h3></div>
      ${hoyMismo.length?hoyMismo.map(fila).join(''):'<p class="mini">Sin tareas para hoy.</p>'}</div>
    <div class="bloque"><div class="barra-tit"><h3>Próximas</h3></div>
      ${proximas.length?proximas.map(fila).join(''):'<p class="mini">Sin tareas próximas.</p>'}</div>
    ${hechas.length?`<details class="bloque"><summary><span class="tit">Hechas (${hechas.length})</span></summary>
      <div class="cont">${hechas.map(fila).join('')}</div></details>`:''}`;
}
function alternarTarea(id){
  const t=datos.tareas.find(x=>x.id===id);t.hecha=!t.hecha;guardar();renderTareas();
}
function abrirTarea(id){
  const t=id?datos.tareas.find(x=>x.id===id):{texto:'',fechaVence:'',pacienteId:null,pacienteNombre:''};
  const listaPac=datos.pacientes.map(p=>`<option value="${esc(p.nombre)}">`).join('');

/* ---------- recordatorios de citas por WhatsApp (cola de «un toque») ---------- */
/* Una página web no puede mandar WhatsApp sola (haría falta un servidor y la API de pago de WhatsApp Business).
   Lo que sí hace Mediks: reunir las citas de mañana y pasado mañana, con el mensaje ya escrito y el número del
   paciente, para enviarlas con un toque cada una, y recordar cuáles ya se enviaron. */
function citasPorRecordar(){
  const f1=addDias(hoy(),1),f2=addDias(hoy(),2);
  return (datos.citas||[]).filter(c=>(c.fecha===f1||c.fecha===f2)&&(c.estado==='Agendada'||c.estado==='Confirmada'))
    .sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
}
function telefonoDeCita(c){
  const pt=c.pacienteId?pac(c.pacienteId):null;
  return c.telefono||(pt&&pt.telefono)||'';
}
function pendientesDeRecordar(){return citasPorRecordar().filter(c=>!c.recordatorioEnviado&&telWhatsapp(telefonoDeCita(c)));}
function listaRecordatoriosHTML(){
  const cs=citasPorRecordar();
  if(!cs.length)return '<p class="mini" style="margin:0">No hay citas para mañana ni pasado mañana.</p>';
  const f1=addDias(hoy(),1);
  return cs.map(c=>{
    const tel=telefonoDeCita(c),hayTel=!!telWhatsapp(tel);
    const cuando=(c.fecha===f1?'Mañana':'Pasado mañana')+' · '+esc(c.hora);
    const enviado=c.recordatorioEnviado?`<span class="mini" style="color:var(--clinico)">✓ Recordatorio enviado</span>`:'';
    const boton=!hayTel
      ?`<span class="mini" style="color:var(--alerta)">Sin teléfono</span> <button class="btn chico" onclick="abrirCita('${c.id}')">Agregar</button>`
      :`<button class="btn chico ${c.recordatorioEnviado?'':'primario'}" onclick="enviarRecordatorioCita('${c.id}')">${c.recordatorioEnviado?'Enviar de nuevo':'Enviar recordatorio'}</button>`;
    return `<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--linea)">
      <div><b>${esc(c.nombre)}</b> <span class="mini">${cuando}${c.motivo?' · '+esc(c.motivo):''}</span> ${enviado}</div>
      <div style="display:flex;gap:6px;align-items:center">${boton}</div></div>`;
  }).join('');
}
function verTodosControles(){
  const f=hoy();
  const filas=datos.pacientes.map(p=>({p,up:ultimaProfilaxis(p)})).filter(x=>x.up)
    .map(x=>({...x,venc:sumarMeses(x.up,mesesControl(x.p))})).sort((a,b)=>a.venc.localeCompare(b.venc));
  abrirModal('Controles de limpieza — todos',`<p class="mini" style="margin-top:0">Pacientes con una limpieza o profilaxis registrada, ordenados por la fecha en que les toca el próximo control (cada ${mesesControl()} meses, ${mesesControlOrto()} si usa ortodoncia).</p>
    ${filas.length?`<div style="max-height:60vh;overflow:auto">${filas.map(x=>{
      const d=diasEntre(f,x.venc),cita=tieneCitaFutura(x.p);
      const est=cita?'<span class="mini" style="color:var(--clinico)">Ya tiene cita</span>':(d<0?`<span class="mini" style="color:var(--alerta)">Vencido hace ${-d} d</span>`:`<span class="mini">En ${d} d</span>`);
      return `<div style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--linea)">
        <div><b>${esc(x.p.nombre||'')}</b><br><span class="mini">Última limpieza ${fechaCorta(x.up)} · toca ${fechaCorta(x.venc)}</span></div>
        <div style="display:flex;gap:6px;align-items:center">${est}${cita?'':`<button class="btn chico" onclick="agendarControl('${x.p.id}','limpieza')">Agendar</button>`}</div></div>`;}).join('')}</div>`
    :'<p class="mini">Ningún paciente tiene todavía una limpieza registrada en Tratamientos.</p>'}`,null);
}
function bloqueRecordatorios(){
  const hayCitas=citasPorRecordar().length>0,ctl=controlesPorAgendar();
  const n=totalRecordatoriosPendientes();
  const conProf=datos.pacientes.filter(p=>ultimaProfilaxis(p)).length;
  if(!hayCitas&&!ctl.length)return `<div class="bloque"><div class="barra-tit"><h3>Recordatorios y controles</h3></div>
    <p class="mini" style="margin:0">Por ahora no hay citas de mañana ni controles por agendar. Aquí aparecerán los pacientes a los que les toca limpieza (cada ${mesesControl()} meses, o ${mesesControlOrto()} si usa ortodoncia, desde su última profilaxis o limpieza registrada en Tratamientos) y los controles de ortodoncia. Pacientes con limpieza registrada: <b>${conProf}</b>. <button class="btn chico" onclick="verTodosControles()">Ver todos los controles</button></p></div>`;

/* ---------- «Requiere tu atención»: cosas que el sistema detecta solo ---------- */
function ultimaVisitaPaciente(p){
  let u=p.apertura||'';
  (p.tratamientos||[]).forEach(t=>{if(t.fecha&&t.fecha>u)u=t.fecha;});
  (datos.citas||[]).forEach(c=>{if(c.pacienteId===p.id&&c.estado==='Atendida'&&c.fecha>u)u=c.fecha;});
  return u;
}
function tieneCitaFutura(p){
  return (datos.citas||[]).some(c=>(c.pacienteId===p.id||(!c.pacienteId&&buscarPacientePorNombre(c.nombre)===p))&&c.fecha>=hoy()&&c.estado!=='Cancelada'&&c.estado!=='No asistió');
}
function cambiarEstadoCita(id,estado){
  const c=(datos.citas||[]).find(x=>x.id===id);if(!c)return;
  c.estado=estado;guardar();sincronizarCitaGoogle(c);verResumen();
}
function bloqueAtencion(){
  const MAX=6,hoyF=hoy();
  const sinCerrar=(datos.citas||[]).filter(c=>c.fecha<hoyF&&c.fecha>=addDias(hoyF,-30)&&(c.estado==='Agendada'||c.estado==='Confirmada'))
    .sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  const conPendientes=datos.pacientes.filter(p=>pendientesOdonto(p).length&&!tieneCitaFutura(p));
  const idsPend=new Set([...conPendientes.map(p=>p.id),...controlesPorAgendar().map(x=>x.p.id)]);
  const sinConsent=citasHoySinConsentimiento();
  const sinVenir=datos.pacientes.filter(p=>!idsPend.has(p.id)&&!tieneCitaFutura(p)&&p.apertura
      &&Math.round((new Date(hoyF)-new Date(ultimaVisitaPaciente(p)))/864e5)>=180)
    .sort((a,b)=>ultimaVisitaPaciente(a).localeCompare(ultimaVisitaPaciente(b)));
  if(!sinCerrar.length&&!conPendientes.length&&!sinVenir.length&&!sinConsent.length)return '';
  const mas=(lista)=>lista.length>MAX?`<p class="mini" style="margin:6px 0 0">… y ${lista.length-MAX} más</p>`:'';
  const fila=(izq,der)=>`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--linea)"><div>${izq}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${der}</div></div>`;
  const sec=(titulo,ayuda,filas)=>`<div style="margin-bottom:14px"><b>${titulo}</b><p class="mini" style="margin:2px 0 4px">${ayuda}</p>${filas}</div>`;
  return `<div class="bloque"><div class="barra-tit"><h3>Requiere tu atención</h3></div>
    ${sinConsent.length?sec(`Citas de hoy sin consentimiento firmado (${sinConsent.length})`,'El procedimiento de la cita pide un consentimiento que aún no está firmado. Conviene firmarlo antes de empezar.',
      sinConsent.slice(0,MAX).map(x=>fila(`<b>${esc(x.p.nombre||'')}</b> <span class="mini">${esc(x.cita.hora)} · ${esc(x.titulo)}</span>`,
        `<button class="btn chico primario" onclick="firmarConsentimientoPara('${x.p.id}','${x.clave}')">Crear y firmar</button>`)).join('')+mas(sinConsent)):''}
    ${sinCerrar.length?sec(`Citas pasadas sin cerrar (${sinCerrar.length})`,'¿Vino el paciente? Márcalo para que la agenda y las estadísticas queden al día.',
      sinCerrar.slice(0,MAX).map(c=>fila(`<b>${esc(c.nombre)}</b> <span class="mini">${fechaCorta(c.fecha)} ${esc(c.hora)}${c.motivo?' · '+esc(c.motivo):''}</span>`,
        `<button class="btn chico" onclick="cambiarEstadoCita('${c.id}','Atendida')">Atendida</button>
         <button class="btn chico" onclick="cambiarEstadoCita('${c.id}','No asistió')">No asistió</button>`)).join('')+mas(sinCerrar)):''}
    ${conPendientes.length?sec(`Con tratamientos pendientes y sin cita (${conPendientes.length})`,'Tienen tratamientos anotados en el odontograma pero ninguna cita futura.',
      conPendientes.slice(0,MAX).map(p=>{const n=pendientesOdonto(p).length;
        return fila(`<b>${esc(p.nombre)}</b> <span class="mini">${n} pendiente${n===1?'':'s'}</span>`,

    ${sinVenir.length?sec(`Sin venir hace más de 6 meses (${sinVenir.length})`,'Buen momento para invitarlos a un control o limpieza.',
      sinVenir.slice(0,MAX).map(p=>{const meses=Math.floor(Math.round((new Date(hoyF)-new Date(ultimaVisitaPaciente(p)))/864e5)/30);
        return fila(`<b>${esc(p.nombre)}</b> <span class="mini">última visita hace ${meses} meses</span>`,

const COLOR_ESTADO={Agendada:'#0E7C6B',Confirmada:'#0b6759',Atendida:'#5A706A','No asistió':'#B24A35',Cancelada:'#9aa6a3'};

function minutos(hhmm){const [h,m]=(hhmm||'0:0').split(':').map(Number);return h*60+(m||0);}
function horaLabel(mins){const h=Math.floor(mins/60),m=((mins%60)+60)%60;return `${h}:${String(m).padStart(2,'0')}`;}
function addDias(f,n){const d=new Date(f+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function lunesDeSemana(f){const d=new Date(f+'T00:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return d.toISOString().slice(0,10);}

/* ---------- Google Calendar (un solo sentido: Mediks empuja las citas hacia allá) ---------- */
let intentoManualGoogle=false;
function tokenGoogleGuardado(){
  try{
    const g=JSON.parse(localStorage.getItem('mediks-google-token')||'null');
    return (g&&g.token&&g.vence>Date.now())?g:null;
  }catch(e){return null;}
}
function inicializarGoogleCalendar(intentos){
  intentos=intentos||0;
  const guardadoInicial=tokenGoogleGuardado();
  if(guardadoInicial)googleConectado=true; // se ve conectado de inmediato, sin esperar a que Google termine de cargar
  if(!window.google||!window.gapi){
    if(intentos<25)setTimeout(()=>inicializarGoogleCalendar(intentos+1),300); // reintenta hasta ~7.5s en vez de rendirse
    return;
  }
  try{
    googleTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,scope:GOOGLE_SCOPE,
      callback:async(resp)=>{
        if(resp.error){
          if(intentoManualGoogle)avisar('No se pudo conectar con Google Calendar');
          intentoManualGoogle=false;return;
        }
        gapi.client.setToken({access_token:resp.access_token});
        googleConectado=true;
        const vence=Date.now()+((Number(resp.expires_in)||3300)*1000);
        try{localStorage.setItem('mediks-google-token',JSON.stringify({token:resp.access_token,vence}));}catch(e){}
        actualizarBotonGoogle();
        if(intentoManualGoogle)avisar('Google Calendar conectado');
        intentoManualGoogle=false;
      }
    });
    gapi.load('client',async()=>{
      await gapi.client.init({discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']});
      googleListoParaUsar=true;
      const guardado=tokenGoogleGuardado();
      if(guardado){
        gapi.client.setToken({access_token:guardado.token});
        googleConectado=true;actualizarBotonGoogle();
      }else if(googleConectado){
        googleConectado=false;actualizarBotonGoogle(); // el permiso venció justo ahora
      }
    });
  }catch(e){console.error(e);}
}
function actualizarBotonGoogle(){ if(document.getElementById('agGrid'))renderAgenda(); }
function alternarGoogleCalendar(){
  if(googleConectado){
    if(!confirm('¿Desconectar Google Calendar? Las citas dejarán de copiarse allá hasta que vuelvas a conectar.'))return;
    googleConectado=false;
    try{localStorage.removeItem('mediks-google-token');}catch(e){}
    actualizarBotonGoogle();avisar('Google Calendar desconectado');return;
  }
  if(!googleTokenClient){
    avisar('Google Calendar todavía está cargando — vuelve a tocar «Conectar» en un par de segundos');
    return;
  }
  intentoManualGoogle=true;
  googleTokenClient.requestAccessToken();
}
function eventoGoogleDesdeCita(c){
  const inicio=`${c.fecha}T${c.hora}:00`;
  const finMin=minutos(c.hora)+(Number(c.duracion)||30);
  const finH=String(Math.floor(finMin/60)).padStart(2,'0'),finM=String(finMin%60).padStart(2,'0');
  return {summary:`${c.nombre||'Paciente'}${c.motivo?' — '+c.motivo:''}`,
    description:[c.motivo,c.nota,c.telefono&&('Tel: '+c.telefono)].filter(Boolean).join('\n'),
    start:{dateTime:inicio,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    end:{dateTime:`${c.fecha}T${finH}:${finM}:00`,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    extendedProperties:{private:{mediksCitaId:c.id}}};
}
async function sincronizarCitaGoogle(c){
  if(!googleConectado||!googleListoParaUsar)return;
  try{
    const evento=eventoGoogleDesdeCita(c);
    if(c.googleEventId){
      await gapi.client.calendar.events.update({calendarId:'primary',eventId:c.googleEventId,resource:evento});
    }else{
      const r=await gapi.client.calendar.events.insert({calendarId:'primary',resource:evento});
      c.googleEventId=r.result.id;guardar();
    }
  }catch(e){console.error('Google Calendar:',e);}
}
async function eliminarCitaGoogle(c){
  if(!googleConectado||!googleListoParaUsar||!c.googleEventId)return;
  try{ await gapi.client.calendar.events.delete({calendarId:'primary',eventId:c.googleEventId}); }
  catch(e){console.error('Google Calendar:',e);}
}
let ultimaSincronizacionGoogle=0,sincronizandoGoogle=false;
async function sincronizarDesdeGoogle(forzar){
  if(!googleConectado||!googleListoParaUsar||sincronizandoGoogle)return;
  const ahora=Date.now();
  if(!forzar&&ahora-ultimaSincronizacionGoogle<20000)return;
  ultimaSincronizacionGoogle=ahora;sincronizandoGoogle=true;
  try{
    const desde=addDias(hoy(),-7),hasta=addDias(hoy(),60);
    const r=await gapi.client.calendar.events.list({calendarId:'primary',
      timeMin:new Date(desde+'T00:00:00').toISOString(),timeMax:new Date(hasta+'T23:59:59').toISOString(),
      singleEvents:true,maxResults:250});
    const eventos=(r.result.items||[]).filter(ev=>ev.start&&ev.start.dateTime&&ev.status!=='cancelled');
    const idsVistos=new Set(eventos.map(ev=>ev.id));
    const pad=n=>String(n).padStart(2,'0');
    let cambios=false;
    for(const ev of eventos){
      const ini=new Date(ev.start.dateTime),fin=new Date(ev.end.dateTime);
      const fecha=`${ini.getFullYear()}-${pad(ini.getMonth()+1)}-${pad(ini.getDate())}`;
      const hora=`${pad(ini.getHours())}:${pad(ini.getMinutes())}`;
      const duracion=Math.max(5,Math.round((fin-ini)/60000));
      const citaId=ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.mediksCitaId;
      if(citaId){
        const local=(datos.citas||[]).find(c=>c.id===citaId);
        if(local&&(local.fecha!==fecha||local.hora!==hora||local.duracion!==duracion)){
          local.fecha=fecha;local.hora=hora;local.duracion=duracion;
          if(ev.summary)local.nombre=ev.summary.split(' — ')[0]||local.nombre;
          cambios=true;
        }
        // si ya no existe en Mediks (se borró aquí), no la recreamos: evitamos revivir algo que borraste a propósito
      }else{
        const yaImportada=(datos.citas||[]).some(c=>c.googleEventId===ev.id);
        if(!yaImportada){
          const nueva={id:uid(),pacienteId:null,nombre:ev.summary||'Cita (Google Calendar)',telefono:'',
            fecha,hora,duracion,estado:'Agendada',motivo:'',nota:'Importada de Google Calendar',
            profesionalId:null,profesionalNombre:'',origen:null,googleEventId:ev.id};
          datos.citas=datos.citas||[];datos.citas.push(nueva);cambios=true;
          try{await gapi.client.calendar.events.patch({calendarId:'primary',eventId:ev.id,
            resource:{extendedProperties:{private:{mediksCitaId:nueva.id}}}});}catch(e){}
        }
      }
    }
    // citas que sí tienen evento en Google pero ese evento ya no aparece en este rango: se borró en Google, se borra aquí también
    const paraBorrar=(datos.citas||[]).filter(c=>c.googleEventId&&!idsVistos.has(c.googleEventId)&&c.fecha>=desde&&c.fecha<=hasta);
    if(paraBorrar.length){
      const idsBorrar=new Set(paraBorrar.map(c=>c.id));
      datos.citas=(datos.citas||[]).filter(c=>!idsBorrar.has(c.id));
      cambios=true;
    }
    if(cambios){guardar();if(document.getElementById('agGrid'))renderAgenda();}
  }catch(e){console.error('Google Calendar (traer cambios):',e);}
  finally{sincronizandoGoogle=false;}
}

/* ---------- enlazar "próxima cita" de cualquier parte con la Agenda ---------- */
function sincronizarProximaCita(pacienteId,origenTipo,origenId,fecha,motivo,hora){
  datos.citas=datos.citas||[];
  const idx=datos.citas.findIndex(c=>c.origen&&c.origen.tipo===origenTipo&&c.origen.id===origenId);
  if(!fecha){
    if(idx>=0){datos.citas.splice(idx,1);guardar();avisar('Se quitó la cita programada');}
    return;
  }
  const paciente=pac(pacienteId);
  const d={
    id:idx>=0?datos.citas[idx].id:uid(),
    pacienteId,nombre:paciente?paciente.nombre:'',telefono:paciente?paciente.telefono:'',
    fecha,hora:hora||(idx>=0?datos.citas[idx].hora:'09:00'),
    duracion:idx>=0?datos.citas[idx].duracion:30,
    estado:idx>=0?datos.citas[idx].estado:'Agendada',
    motivo:motivo||(idx>=0?datos.citas[idx].motivo:'Control'),
    nota:idx>=0?datos.citas[idx].nota:'',
    origen:{tipo:origenTipo,id:origenId}
  };
  if(idx>=0)datos.citas[idx]=d;else datos.citas.push(d);
  guardar();avisar('Cita programada en la agenda para '+fechaCorta(fecha)+' a las '+d.hora);
}

function pintarGridAgenda(fechas){
  const cfg=datos.config||{};
  const iniMin=minutos(cfg.horaInicio||'08:00'), finMin=minutos(cfg.horaFin||'19:00');
  const intervalo=Number(cfg.intervalo)||30, px=0.85;
  const alto=Math.max(60,(finMin-iniMin)*px);
  const horasLineas=[];
  for(let hh=Math.ceil(iniMin/60);hh<=Math.floor(finMin/60);hh++) horasLineas.push(hh*60);
  const ahora=new Date(), minAhora=ahora.getHours()*60+ahora.getMinutes();

  const colsHTML=fechas.map(f=>{
    const citasDia=(datos.citas||[]).filter(c=>c.fecha===f);
    const slots=[];
    for(let m=iniMin;m<finMin;m+=intervalo)
      slots.push(`<div class="ag-slot" style="top:${(m-iniMin)*px}px;height:${intervalo*px}px" data-fecha="${f}" data-hora="${horaLabel(m)}"></div>`);
    const citasHTML=citasDia.map(c=>{
      const top=(minutos(c.hora)-iniMin)*px, h=Math.max(20,(Number(c.duracion)||30)*px-2);
      const cls=CLASE_ESTADO[c.estado]||'agendada';
      const cabe3=h>=44, cabe2=h>=30;
      return `<div class="ag-cita ${cls}" style="top:${top}px;height:${h}px" data-cita="${c.id}">
        <span class="hn"><span class="hora">${esc(c.hora)}</span><span class="nom">${esc(c.nombre)}</span></span>
        ${cabe2&&c.duracion?`<span class="mot">${esc(c.duracion)} min</span>`:''}
        ${cabe3&&c.motivo?`<span class="mot">${esc(c.motivo)}</span>`:''}
        ${cabe3&&c.profesionalNombre?`<span class="mot">${esc(c.profesionalNombre)}</span>`:''}</div>`;
    }).join('');
    const lineasHTML=horasLineas.map(m=>`<div class="ag-linea" style="top:${(m-iniMin)*px}px"></div>`).join('');
    const lineaHoy=(f===hoy()&&minAhora>=iniMin&&minAhora<=finMin)?`<div class="ag-linea-hoy" style="top:${(minAhora-iniMin)*px}px"></div>`:'';
    const d=new Date(f+'T00:00:00'), dCorto=['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()];
    return `<div class="ag-dia-col">
      <div class="ag-dia-head ${f===hoy()?'hoy':''}">${dCorto}<b>${d.getDate()}</b></div>
      <div style="position:relative;height:${alto}px">${lineasHTML}${slots.join('')}${citasHTML}${lineaHoy}</div>
    </div>`;
  }).join('');
  const horasLabelsHTML=horasLineas.map(m=>`<div class="ag-hora-lbl" style="top:${(m-iniMin)*px}px">${horaLabel(m)}</div>`).join('');
  $('#agGrid').innerHTML=`<div class="ag-grid-wrap">
      <div class="ag-horas">
        <div class="ag-dia-head" style="visibility:hidden">&nbsp;<b>00</b></div>
        <div class="ag-horas-cuerpo" style="height:${alto+16}px">${horasLabelsHTML}</div>
      </div>
      <div class="ag-dias">${colsHTML}</div>
    </div>
    <div class="leyenda" style="margin-top:12px">${ESTADOS_CITA.map(e=>`<span><b style="color:${COLOR_ESTADO[e]}">●</b> ${e}</span>`).join('')}</div>`;
  $('#agGrid').querySelectorAll('.ag-slot').forEach(el=>el.onclick=()=>abrirCita(null,{fecha:el.dataset.fecha,hora:el.dataset.hora}));
  activarArrastreCitas({iniMin,finMin,intervalo,px});
}
/* Arrastrar una cita a otro horario o día (ratón, lápiz o dedo con pulsación larga). Un toque sin mover abre la cita. */
function activarArrastreCitas(g){
  const grid=document.getElementById('agGrid');if(!grid)return;
  grid.querySelectorAll('.ag-cita').forEach(el=>{
    el.addEventListener('pointerdown',ev=>{
      if(ev.button>0)return;
      const id=el.dataset.cita,cita=(datos.citas||[]).find(x=>x.id===id);if(!cita)return;
      const r0=el.getBoundingClientRect(),offY=ev.clientY-r0.top,sx=ev.clientX,sy=ev.clientY;
      const tactil=ev.pointerType==='touch';
      let arrastrando=false,listo=!tactil,tm=null,destino=null;
      if(tactil)tm=setTimeout(()=>{listo=true;arrastrando=true;iniciar();if(navigator.vibrate)navigator.vibrate(15);},350);
      const iniciar=()=>{el.classList.add('arrastrando');el.style.pointerEvents='none';document.body.classList.add('arrastrando-cita');};
      const bloquearScroll=e=>{if(arrastrando)e.preventDefault();};
      document.addEventListener('touchmove',bloquearScroll,{passive:false});
      const calcular=(cx,cy)=>{
        const slot=document.elementsFromPoint(cx,cy).find(x=>x.classList&&x.classList.contains('ag-slot'));
        if(!slot)return null;
        const rc=slot.parentElement.getBoundingClientRect();
        const dur=Number(cita.duracion)||30;
        let m=g.iniMin+(cy-rc.top-offY)/g.px;
        m=Math.round(m/g.intervalo)*g.intervalo;
        m=Math.max(g.iniMin,Math.min(m,g.finMin-Math.min(dur,g.intervalo)));
        return {fecha:slot.dataset.fecha,hora:horaLabel(m).padStart(5,'0'),top:(m-g.iniMin)*g.px,col:slot.parentElement};
      };
      const mover=e=>{
        if(!arrastrando){
          if(Math.hypot(e.clientX-sx,e.clientY-sy)<6)return;
          if(!listo){cancelar();return;}   // en pantalla táctil, mover antes de la pulsación larga = desplazarse
          arrastrando=true;iniciar();
        }
        const d=calcular(e.clientX,e.clientY);
        if(d){destino=d;
          if(el.parentElement!==d.col)d.col.appendChild(el);
          el.style.top=d.top+'px';
          el.querySelector('.hora').textContent=d.hora;}
      };
      const limpiar=()=>{clearTimeout(tm);document.removeEventListener('pointermove',mover);document.removeEventListener('pointerup',soltar);
        document.removeEventListener('pointercancel',cancelar);document.removeEventListener('touchmove',bloquearScroll);
        document.body.classList.remove('arrastrando-cita');};
      const cancelar=()=>{limpiar();if(arrastrando){el.style.pointerEvents='';renderAgenda();}};
      const soltar=()=>{
        limpiar();
        if(!arrastrando){return;}          // fue un toque: el onclick abre la cita
        el.style.pointerEvents='';
        suprimirClickCita=true;setTimeout(()=>{suprimirClickCita=false;},50);
        if(destino&&(destino.fecha!==cita.fecha||destino.hora!==cita.hora)){
          const antes=nombreDiaFecha(cita.fecha)+' '+cita.hora;
          cita.fecha=destino.fecha;cita.hora=destino.hora;delete cita.recordatorioEnviado;
          guardar();try{sincronizarCitaGoogle(cita);}catch(e){}
          avisar('Cita movida: '+cita.nombre+' → '+nombreDiaFecha(cita.fecha)+' '+cita.hora+' (antes '+antes+')');
        }
        renderAgenda();
      };
      document.addEventListener('pointermove',mover);
      document.addEventListener('pointerup',soltar);
      document.addEventListener('pointercancel',cancelar);
    });
    el.onclick=ev=>{ev.stopPropagation();if(suprimirClickCita)return;abrirCita(el.dataset.cita);};
  });
}

function telWhatsapp(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('593'))return d;
  if(d.startsWith('0'))return '593'+d.slice(1);
  if(d.length===9)return '593'+d;

}

function aclararColor(hex,factor){
  hex=(hex||'#0E7C6B').replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  const mezc=(c)=>Math.round(c+(255-c)*factor);
  return `rgb(${mezc(r)},${mezc(g)},${mezc(b)})`;
}

function comprimirLogo(file,maxLado){
  maxLado=maxLado||200;
  return new Promise((resolve,reject)=>{
    const lector=new FileReader();
    lector.onerror=()=>reject(new Error('lectura'));
    lector.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('imagen'));
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxLado||h>maxLado){const esc=maxLado/Math.max(w,h);w=Math.round(w*esc);h=Math.round(h*esc);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/png'));
      };
      img.src=lector.result;
    };
    lector.readAsDataURL(file);
  });
}

/* Cola de ventanas: deja mostrar una ventana justo después de que se cierre la anterior
   (por ejemplo, al guardar una sesión: primero el aviso de consentimiento y luego el cobro). */
const colaModales=[];

    const fn=colaModales.shift();

    </div>
    <p class="mini" style="margin-bottom:0">Si hoy no cobraste nada, toca «Dejar pendiente»: queda como saldo del paciente.</p>`,
  ()=>{
    const m=Number($('#cb_monto').value)||0;

function montoEnLetras(m){
  const n=Math.round((Number(m)||0)*100),ent=Math.floor(n/100),cts=n%100;
  return `${numeroALetras(ent)} con ${String(cts).padStart(2,'0')}/100 dólares`;

function imprimirEstadoCuenta(){
  const p=pac(selId);if(!p)return;

  (p.tratamientos||[]).filter(t=>Number(t.costo)>0).forEach(t=>movs.push({f:t.fecha,det:(nombreSesion(t)||('Sesión '+(t.sesion||''))).split('\n')[0].slice(0,90),cargo:Number(t.costo)||0,abono:0}));
  (p.abonos||[]).forEach(a=>movs.push({f:a.fecha,det:'Pago'+(a.metodo?' ('+a.metodo+')':'')+(a.nota?' — '+a.nota:''),cargo:0,abono:Number(a.monto)||0}));
  movs.sort((x,y)=>(x.f||'').localeCompare(y.f||'')||(y.cargo>0)-(x.cargo>0));

/* ---------- 2. copias automáticas, último respaldo y tamaño de los datos ---------- */
const SNAP_DB='mediks-copias',SNAP_STORE='copias';
function snapAbrir(){
  return new Promise((res,rej)=>{
    try{
      const rq=indexedDB.open(SNAP_DB,1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore(SNAP_STORE,{keyPath:'clave'});
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    }catch(e){rej(e);}
  });
}
async function snapPoner(reg){
  const db=await snapAbrir();
  return new Promise((res,rej)=>{const tx=db.transaction(SNAP_STORE,'readwrite');tx.objectStore(SNAP_STORE).put(reg);
    tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>{db.close();rej(tx.error);};});
}
async function snapListar(){
  const db=await snapAbrir();
  return new Promise((res,rej)=>{const rq=db.transaction(SNAP_STORE,'readonly').objectStore(SNAP_STORE).getAll();
    rq.onsuccess=()=>{db.close();res(rq.result||[]);};rq.onerror=()=>{db.close();rej(rq.error);};});
}
async function snapBorrar(clave){
  const db=await snapAbrir();
  return new Promise((res,rej)=>{const tx=db.transaction(SNAP_STORE,'readwrite');tx.objectStore(SNAP_STORE).delete(clave);
    tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>{db.close();rej(tx.error);};});
}
/* Una copia al abrir cada día (queda 14 días) y una «última» que se renueva cada 20 min. Vive en este dispositivo. */
let _copiaTs=0;
async function copiaAutomatica(){
  try{
    if(!datos.pacientes||!datos.pacientes.length)return;
    const ahora=Date.now();
    if(ahora-_copiaTs<5*60*1000)return;
    _copiaTs=ahora;
    const json=JSON.stringify(datos),lista=await snapListar();
    const base={json,pacientes:datos.pacientes.length,fecha:new Date().toISOString()};
    const claveDia='dia:'+hoy();
    if(!lista.some(r=>r.clave===claveDia))await snapPoner({...base,clave:claveDia,tipo:'dia'});
    const ult=lista.find(r=>r.clave==='ultima');
    if(!ult||ahora-new Date(ult.fecha).getTime()>20*60*1000)await snapPoner({...base,clave:'ultima',tipo:'ultima'});
    const dias=lista.filter(r=>r.tipo==='dia').sort((a,b)=>b.clave.localeCompare(a.clave));
    for(const r of dias.slice(13))await snapBorrar(r.clave);
    const antes=lista.filter(r=>r.tipo==='antes').sort((a,b)=>b.fecha.localeCompare(a.fecha));
    for(const r of antes.slice(3))await snapBorrar(r.clave);
  }catch(e){}
}
function normalizarDatos(){
  datos.pacientes=datos.pacientes||[];datos.config=datos.config||{};datos.citas=datos.citas||[];
  datos.tareas=datos.tareas||[];datos.inventario=datos.inventario||[];datos.profesionales=datos.profesionales||[];

function reducirFirma(cv){

/* ---------- 3. alertas de alergias y contraindicaciones al recetar ---------- */
function contextoClinico(p,r){
  const h=p.hc033||{},ant=h.antecedentes||{};
  const idx=n=>ANTECEDENTES.indexOf(n);
  const marcado=n=>{const i=idx(n);return i>=0&&!!(ant[i]&&ant[i].x);};
  const det=n=>{const i=idx(n);return (i>=0&&ant[i]&&ant[i].det)||'';};
  const textoAlerg=normTxt([p.alergias,r&&r.alergias,det('Alergia a antibiótico'),det('Alergia a anestesia'),det('Otros')].join(' | '));
  const textoGral=normTxt([p.alergias,r&&r.alergias,h.antObs,h.actual,
    ...ANTECEDENTES.map(n=>det(n))].join(' | '));
  return {marcado,textoAlerg,textoGral};
}
function alertasMedicamento(dci,c){
  const d=normTxt(dci);if(!d.trim())return [];
  const out=[],add=(nivel,txt)=>out.push({nivel,txt});
  const es={
    peni:/amoxicilina|ampicilina|penicilina|clavulan/.test(d),
    cefa:/cefalexina|cefadroxilo|cefuroxima|ceftriaxona|cefixima/.test(d),
    macro:/azitromicina|eritromicina|claritromicina/.test(d),
    clinda:/clindamicina/.test(d),
    metro:/metronidazol/.test(d),
    aine:/ibuprofeno|diclofenaco|naproxeno|ketorolaco|meloxicam|mefenamico|aspirina|acetilsalicilico|ketoprofeno|piroxicam/.test(d),
    metamizol:/metamizol|dipirona/.test(d),
    cortico:/dexametasona|prednisona|prednisolona|betametasona|hidrocortisona|triamcinolona/.test(d),
    anest:/lidocaina|benzocaina|articaina|mepivacaina|bupivacaina|prilocaina/.test(d),
    paracet:/paracetamol|acetaminofen/.test(d)
  };
  const antib=es.peni||es.cefa||es.macro||es.clinda||es.metro;
  const A=c.textoAlerg,G=c.textoGral;
  if(es.peni&&/penicil|amoxi|ampicil|betalact|beta lact|clavul/.test(A))add('peligro','entre las alergias registradas figura penicilina / amoxicilina.');
  if(es.cefa&&/penicil|amoxi|ampicil|betalact|beta lact|cefa|cefal/.test(A))add('peligro','hay alergia a betalactámicos registrada; las cefalosporinas pueden dar reacción cruzada.');
  if(es.macro&&/macrolid|azitro|eritro|claritro/.test(A))add('peligro','entre las alergias registradas figuran los macrólidos.');
  if(es.clinda&&/clinda|lincosam/.test(A))add('peligro','entre las alergias registradas figura clindamicina.');
  if(es.metro&&/metronid|nitroimid/.test(A))add('peligro','entre las alergias registradas figura metronidazol.');
  if(es.aine&&/aine|ibuprofeno|aspirin|acetilsalic|diclofen|naproxen|ketorol|meloxic|mefenam|antiinflamat/.test(A))add('peligro','entre las alergias registradas figuran los antiinflamatorios (AINE).');
  if(es.metamizol&&/metamizol|dipirona|pirazolon|aine|aspirin|antiinflamat/.test(A))add('peligro','hay alergia registrada a metamizol / antiinflamatorios.');
  if(es.cortico&&/corticoid|dexameta|predniso/.test(A))add('peligro','entre las alergias registradas figuran los corticoides.');
  if(es.anest&&(/anest|lidoca|benzoca|articaina|mepivac|bupivac|prilocain/.test(A)||c.marcado('Alergia a anestesia')))add('peligro','el paciente tiene registrada alergia a anestesia / anestésicos locales.');
  if(antib&&!out.length&&c.marcado('Alergia a antibiótico'))add('revisar','en la historia está marcada «Alergia a antibiótico»; confirma a cuál antes de recetar.');
  const embarazo=/embaraz|gestac|gestante|lactanc|lactando/.test(G);
  if(es.aine||es.metamizol){
    if(c.marcado('Asma')||/asma|broncoespasmo/.test(G))add('revisar','asma: los antiinflamatorios pueden provocar una crisis en algunos pacientes.');
    if(c.marcado('Hipertensión')||/hipertens|presion alta/.test(G))add('revisar','hipertensión: pueden subir la presión o interferir con su medicación.');
    if(c.marcado('Enfermedad cardíaca')||/cardiac|cardio|infarto|marcapaso/.test(G))add('revisar','enfermedad cardíaca: usar con cuidado.');
    if(c.marcado('Hemorragias')||/hemorrag|anticoag|warfarina|sintrom|clopidogrel|trombo/.test(G))add('revisar','riesgo de sangrado / anticoagulantes: aumentan el sangrado.');
    if(/gastritis|ulcera|reflujo|sangrado digestivo/.test(G))add('revisar','gastritis o úlcera: pueden irritar el estómago.');
    if(/renal|rinon|dialisis/.test(G))add('revisar','problema renal: pueden empeorarlo.');
    if(embarazo)add('revisar','embarazo o lactancia: verificar si es seguro.');
  }
  if(es.cortico){
    if(c.marcado('Diabetes')||/diabet|glucosa|azucar/.test(G))add('revisar','diabetes: los corticoides elevan la glucosa.');
    if(c.marcado('Hipertensión')||/hipertens|presion alta/.test(G))add('revisar','hipertensión: los corticoides pueden subir la presión.');
    if(embarazo)add('revisar','embarazo o lactancia: verificar si es seguro.');
  }
  if(es.metro&&embarazo)add('revisar','embarazo o lactancia: verificar si es seguro.');
  if(es.paracet&&/hepat|higado|cirrosis/.test(G))add('revisar','problema hepático: ajustar dosis o evitar.');
  return out;
}
function alertasReceta(p,r){
  const c=contextoClinico(p,r),res=[];

/* ---------- 4. consentimientos: la app avisa cuándo falta uno firmado ---------- */
function claveConsentimientoPara(texto){
  const t=normTxt(texto);
  if(!t.trim())return null;
  if(/implante/.test(t))return 'implantes';
  if(/tercer molar|cordal|quirurgic|frenectom|biopsia|apicectom|cirugia/.test(t))return 'cirugia';
  if(/exodoncia|extraccion/.test(t))return 'exodoncia';
  if(/endodoncia|conducto|pulpotom|pulpectom|retratamiento/.test(t))return 'endodoncia';
  if(/raspado|curetaje|gingivectom|periodon/.test(t))return 'periodoncia';
  if(/blanqueamiento/.test(t))return 'blanqueamiento';
  if(/carilla|diseno de sonrisa/.test(t))return 'estetica';
  if(/corona|puente|protesis|incrustacion|removible/.test(t))return 'protesis';
  if(/bracket|ortodon|alineador/.test(t))return 'ortodoncia';
  if(/restauracion|resina|profilaxis|sellante|fluor|obturacion|caries|limpieza/.test(t))return 'general';
  return null;
}
const EQUIV_CONSENT={exodoncia:['exodoncia','cirugia','exodonciaLlanos'],cirugia:['cirugia','exodoncia','exodonciaLlanos'],
  ortodoncia:['ortodoncia','ortodonciaGallegos','ortopediaGallegos']};
function tieneConsentimientoFirmado(p,clave){
  const eq=EQUIV_CONSENT[clave]||[clave];
  return (p.consentimientos||[]).some(x=>eq.includes(x.clave)&&(x.firma||x.papel));
}
function consentimientosFaltantes(p,textos){
  const faltan=new Map();
  textos.forEach(tx=>{
    const k=claveConsentimientoPara(tx);
    if(k&&PLANTILLAS[k]&&!tieneConsentimientoFirmado(p,k)&&!faltan.has(k))faltan.set(k,tx);
  });
  return [...faltan.entries()].map(([clave,desde])=>({clave,desde,titulo:PLANTILLAS[clave].t}));
}
function firmarConsentimientoPara(pid,clave){
  selId=pid;pestana='cons';recetaEditando=null;vistaOdontoInicial=false;
  pintar();crearConsentimiento(clave);
}
function marcarConsentimientoPapel(cid){
  const p=pac(selId),x=(p.consentimientos||[]).find(k=>k.id===cid);if(!x)return;
  x.papel=!x.papel;guardar();pintarVista();
}
/* Aviso dentro de la ventana de la sesión, mientras se eligen los tratamientos (antes de guardar). */
function avisoConsentSesion(p,lineas,esNueva){
  const el=document.getElementById('t_consent');if(!el)return;
  if(!esNueva){el.innerHTML='';return;}
  const faltan=consentimientosFaltantes(p,lineas.map(l=>l.trat||''));

  el.innerHTML=(faltan.length?`<div class="mini" style="color:var(--alerta);margin:6px 0 2px">⚠ Falta el consentimiento firmado de: <b>${faltan.map(f=>esc(f.titulo)).join(', ')}</b>. Al guardar te ofreceré crearlo y firmarlo en pantalla.</div>`:'')
    +(limpieza?`<div class="mini" style="color:var(--clinico);margin:6px 0 2px">✓ La app te recordará solo su próxima limpieza y control en ${mesesControl(p)} meses (sección Recordatorios).</div>`:'');
}
function avisarConsentimientoFaltante(pid,faltan){
  const p=pac(pid);if(!p||!faltan.length)return;

    <p style="margin-top:0">Esta sesión incluye procedimientos para los que <b>${esc(p.nombre||'')}</b> aún no tiene el consentimiento firmado:</p>
    <ul style="margin:0 0 8px 18px;padding:0">${faltan.map(f=>`<li><b>${esc(f.titulo)}</b> <span class="mini">(por «${esc(String(f.desde).slice(0,50))}»)</span></li>`).join('')}</ul>

function citasHoySinConsentimiento(){
  const res=[];

/* ---------- 5. controles automáticos: limpieza cada 6 meses y ortodoncia ---------- */
function mesesControlOrto(){return Number(datos.config&&datos.config.mesesControlOrto)||4;}
/* Meses entre limpiezas: 6 en general y 4 en pacientes con ortodoncia (se puede cambiar en config.mesesControl / mesesControlOrto). */
function mesesControl(p){return (p&&esPacienteOrto(p))?mesesControlOrto():(Number(datos.config&&datos.config.mesesControl)||6);}
function ultimaProfilaxis(p){
  let u='';
  (p.tratamientos||[]).forEach(t=>{
    const txt=normTxt([t.proc,t.dx,(t.lineas||[]).map(l=>l.trat).join(' ')].join(' '));

function controlesPorAgendar(){
  const f=hoy(),res=[];
  datos.pacientes.forEach(p=>{
    if(tieneCitaFutura(p))return;
    const invitado=!!(p.controlInvitado&&diasEntre(p.controlInvitado,f)<14);
    const invitadoOrto=!!(p.controlInvitadoOrto&&diasEntre(p.controlInvitadoOrto,f)<14);
    if(esPacienteOrto(p)){
      const ult=[...(p.orto.controles||[])].filter(x=>x.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
      if(ult){
        const ref=ult.proxima||addDias(ult.fecha,30),dif=diasEntre(f,ref);
        if(dif<=7&&dif>=-90)res.push({tipo:'orto',p,fechaRef:ref,invitado:invitadoOrto});

  });

}

async function cargarDataUrl(clave){try{const r=await almacen.get(clave);return (r&&r.value)||'';}catch(e){return '';}}
function listaImagenes(p,origen){
  const arr=origen==='rx'?(p.radiografias||[]):(p.fotografias||[]);
  const clave=origen==='rx'?claveRx:claveFoto;
  return arr.map(r=>({...r,_clave:clave(p.id,r.id)})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
}
function etiquetaImagen(r){return [fechaCorta(r.fecha),r.tipo||'sin tipo',r.pieza?('pieza '+r.pieza):''].filter(Boolean).join(' · ');}
async function componerComparacion(rA,rB,urlA,urlB){
  const cargar=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
  const [a,b]=await Promise.all([cargar(urlA),cargar(urlB)]);
  const H=800,wa=Math.round(a.width*H/a.height),wb=Math.round(b.width*H/b.height),gap=16,top=54,pie=34;
  const cv=document.createElement('canvas');cv.width=wa+wb+gap*3;cv.height=H+top+pie+gap;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  x.drawImage(a,gap,top,wa,H);x.drawImage(b,gap*2+wa,top,wb,H);
  x.fillStyle='#15302A';x.font='bold 26px sans-serif';x.textBaseline='middle';
  const t=r=>`${r.tipo||'Imagen'} · ${fechaCorta(r.fecha)}`;
  x.fillText(t(rA),gap,top/2);x.fillText(t(rB),gap*2+wa,top/2);
  x.fillStyle='#5A706A';x.font='18px sans-serif';
  x.fillText((datos.config&&datos.config.establecimiento)||'',gap,top+H+pie/2+4);
  return cv;
}
async function abrirComparador(origen){
  const p=pac(selId);if(!p)return;

  if(imgs.length<2){avisar('Necesitas al menos 2 imágenes para comparar');return;}
  const antes=imgs.find(x=>x.tipo==='Antes')||imgs[0];
  let despues=[...imgs].reverse().find(x=>x.tipo==='Después')||imgs[imgs.length-1];
  if(despues.id===antes.id)despues=imgs[imgs.length-1].id!==antes.id?imgs[imgs.length-1]:imgs[0];
  const opts=sel=>imgs.map(r=>`<option value="${r.id}" ${r.id===sel.id?'selected':''}>${esc(etiquetaImagen(r))}</option>`).join('');
  abrirModal('Comparar imágenes',`
    <div class="grid">
      <label class="campo"><span>Izquierda</span><select id="cmp_a">${opts(antes)}</select></label>
      <label class="campo"><span>Derecha</span><select id="cmp_b">${opts(despues)}</select></label></div>
    <div id="cmp_vista" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;min-height:60px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn chico" type="button" id="cmp_desc">Descargar comparación</button>
      <button class="btn chico" type="button" id="cmp_comp" style="display:none">Compartir</button></div>`,null);
  let urlA='',urlB='';
  const cargar=async()=>{
    const rA=imgs.find(x=>x.id===$('#cmp_a').value),rB=imgs.find(x=>x.id===$('#cmp_b').value);
    $('#cmp_vista').innerHTML='<p class="mini">Cargando…</p>';
    [urlA,urlB]=await Promise.all([cargarDataUrl(rA._clave),cargarDataUrl(rB._clave)]);
    const v=document.getElementById('cmp_vista');if(!v)return;
    v.innerHTML=[[rA,urlA],[rB,urlB]].map(([r,u])=>`<figure style="margin:0"><img src="${u}" alt="" style="width:100%;border-radius:8px;display:block"><figcaption class="mini" style="margin-top:4px">${esc(r.tipo||'Imagen')} · ${fechaCorta(r.fecha)}</figcaption></figure>`).join('');
  };
  const generar=async()=>{
    const rA=imgs.find(x=>x.id===$('#cmp_a').value),rB=imgs.find(x=>x.id===$('#cmp_b').value);
    if(!urlA||!urlB){avisar('No se pudieron cargar las imágenes');return null;}
    const cv=await componerComparacion(rA,rB,urlA,urlB);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
    return {blob,nombre:`comparacion-${(p.nombre||'paciente').replace(/[^a-z0-9]+/gi,'-')}-${hoy()}.jpg`};
  };
  $('#cmp_a').onchange=cargar;$('#cmp_b').onchange=cargar;
  $('#cmp_desc').onclick=async()=>{
    const r=await generar();if(!r)return;
    const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=r.nombre;a.click();
  };
  try{
    const probe=new File([new Blob(['x'])],'x.jpg',{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[probe]})){
      const b=$('#cmp_comp');b.style.display='';
      b.onclick=async()=>{
        const r=await generar();if(!r)return;
        try{await navigator.share({files:[new File([r.blob],r.nombre,{type:'image/jpeg'})],title:'Comparación'});}
        catch(e){if(e.name!=='AbortError')avisar('No se pudo abrir el menú de compartir; usa «Descargar».');}
      };
    }
  }catch(e){}
  cargar();
}

function sumaMes(m,delta){
  const [y,mm]=m.split('-').map(Number),d=new Date(y,mm-1+delta,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function nombreMesAnio(m){const [y,mm]=m.split('-').map(Number);return MESES[mm-1]+' '+y;}
function categoriaDeTratamiento(nombre){
  const n=normTxt(nombre);
  for(const [cat,lista] of Object.entries(CATALOGO_TRATAMIENTOS)){
    if(lista.some(x=>normTxt(x)===n))return cat;
  }
  if(/endodon|conducto|pulpotom/.test(n))return 'Endodoncia';
  if(/extrac|exodon|cirug/.test(n))return 'Cirugía';
  if(/profilaxis|raspado|periodon|curetaje|limpieza/.test(n))return 'Periodoncia';
  if(/ortodon|bracket/.test(n))return 'Ortodoncia';
  if(/corona|puente|carilla|incrust|protes/.test(n))return 'Prótesis fija';
  if(/resina|restaur|obtur|sellante|caries/.test(n))return 'Restauradora';
  return 'Otros';
}
function nombresDeSesion(t){
  if(t.lineas&&t.lineas.length)return t.lineas.map(l=>l.trat).filter(Boolean);
  const base=(nombreSesion(t)||'').split('\n')[0].trim();
  return [base?base.slice(0,45):'Sesión sin detalle'];
}
function datosReporte(m){
  const enMes=f=>!!f&&String(f).slice(0,7)===m;
  const R={mes:m,cobrado:0,cobradoOrto:0,porMetodo:{},pagos:[],pacCobro:{},sesiones:0,produccion:0,porProf:{},porTrat:{},porCat:{},
    lab:0,hon:0,citas:{Agendada:0,Confirmada:0,Atendida:0,'No asistió':0,Cancelada:0},nuevos:0,presupuestos:0,atendidos:new Set()};
  const sumar=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  datos.pacientes.forEach(p=>{
    const nombre=p.nombre||'Sin nombre';
    if(enMes(p.apertura))R.nuevos++;
    (p.abonos||[]).forEach(a=>{
      if(!enMes(a.fecha))return;
      const v=Number(a.monto)||0;R.cobrado+=v;sumar(R.porMetodo,a.metodo||'Otro',v);sumar(R.pacCobro,nombre,v);
      R.pagos.push({fecha:a.fecha,paciente:nombre,metodo:a.metodo||'',nota:a.nota||'',monto:v});
    });
    ((p.orto&&p.orto.cuotas)||[]).forEach(q=>{
      if(!q.pagada||!enMes(q.fechaPago))return;
      const v=Number(q.monto)||0;R.cobrado+=v;R.cobradoOrto+=v;sumar(R.porMetodo,q.metodo||'Otro',v);sumar(R.pacCobro,nombre,v);
      R.pagos.push({fecha:q.fechaPago,paciente:nombre,metodo:q.metodo||'',nota:'Cuota de ortodoncia',monto:v});
    });
    (p.tratamientos||[]).forEach(t=>{
      if(!enMes(t.fecha))return;
      R.sesiones++;R.atendidos.add(p.id);
      const c=Number(t.costo)||0;R.produccion+=c;sumar(R.porProf,t.profesionalNombre||'Sin asignar',c);
      R.lab+=Number(t.labCosto)||0;R.hon+=Number(t.honorarioPagado)||0;
      nombresDeSesion(t).forEach(n=>{sumar(R.porTrat,n,1);sumar(R.porCat,categoriaDeTratamiento(n),1);});
    });
    ((p.orto&&p.orto.controles)||[]).forEach(x=>{
      if(!enMes(x.fecha))return;
      R.sesiones++;R.atendidos.add(p.id);R.hon+=Number(x.honorarioPagado)||0;
      sumar(R.porTrat,'Control de ortodoncia',1);sumar(R.porCat,'Ortodoncia',1);
    });
    (p.presupuestos||[]).forEach(x=>{if(enMes(x.fecha))R.presupuestos++;});
  });
  (datos.gastosProfesionales||[]).forEach(g=>{if(enMes(g.fecha))R.hon+=Number(g.monto)||0;});
  (datos.citas||[]).forEach(c=>{if(enMes(c.fecha)&&R.citas[c.estado]!==undefined)R.citas[c.estado]++;});
  R.gastos=R.lab+R.hon;
  const base=R.citas.Atendida+R.citas['No asistió'];
  R.inasistencia=base>0?Math.round(R.citas['No asistió']/base*100):null;
  R.citasTotal=Object.values(R.citas).reduce((s,v)=>s+v,0);
  return R;
}

/* ---------- 9. trabajo sin internet: lo anotado se junta con la nube al volver la conexión ---------- */
const LS_PEND='odonto-pendiente-nube',LS_BASE='odonto-base-nube',LS_USA='odonto-usa-nube',LS_IMGS='odonto-imgs-pendientes';
const usaNube=()=>{try{return localStorage.getItem(LS_USA)==='1';}catch(e){return false;}};
const hayPendiente=()=>{try{return localStorage.getItem(LS_PEND)==='1';}catch(e){return false;}};
const marcarUsaNube=()=>{try{localStorage.setItem(LS_USA,'1');}catch(e){}};
let seqGuardado=0,versionDatos=0,ultimoSync=null;
const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('tiempo')),ms))]);
function limpiarPendiente(json){
  try{localStorage.removeItem(LS_PEND);localStorage.removeItem(LS_BASE);}catch(e){}
  if(json!==undefined)ultimoSync=json;
}
/* ---- juntar dos versiones (la de este dispositivo y la de la nube) usando la última versión que ambas compartían ---- */
const esObjeto=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
function igualProf(a,b){
  if(a===b)return true;
  if(typeof a!==typeof b||a===null||b===null||a===undefined||b===undefined)return false;
  if(Array.isArray(a)){return Array.isArray(b)&&a.length===b.length&&a.every((x,i)=>igualProf(x,b[i]));}
  if(typeof a==='object'){const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>igualProf(a[k],b[k]));}
  return false;
}
const listaConId=a=>Array.isArray(a)&&a.length>0&&a.every(x=>esObjeto(x)&&x.id!==undefined);
function unir3(base,loc,nube){
  if(igualProf(loc,nube))return loc;
  if(igualProf(loc,base))return nube;
  if(igualProf(nube,base))return loc;
  if(loc===undefined)return nube;   // lo borraste aquí pero en la nube cambió: se conserva
  if(nube===undefined)return loc;
  if(esObjeto(loc)&&esObjeto(nube)){
    const b=esObjeto(base)?base:{},out={};
    new Set([...Object.keys(nube),...Object.keys(loc)]).forEach(k=>{const v=unir3(b[k],loc[k],nube[k]);if(v!==undefined)out[k]=v;});
    return out;
  }
  const okL=listaConId(loc)||(Array.isArray(loc)&&!loc.length),okN=listaConId(nube)||(Array.isArray(nube)&&!nube.length);
  if(okL&&okN){
    const b=Array.isArray(base)?base:[];
    const mb=new Map(b.filter(esObjeto).map(x=>[x.id,x])),ml=new Map(loc.map(x=>[x.id,x])),mn=new Map(nube.map(x=>[x.id,x]));
    const ids=[...nube.map(x=>x.id),...loc.map(x=>x.id).filter(id=>!mn.has(id))];
    const out=[];
    ids.forEach(id=>{const v=unir3(mb.get(id),ml.get(id),mn.get(id));if(v!==undefined)out.push(v);});
    return out;
  }
  return loc;   // cambio distinto en ambos lados y sin forma de juntarlos: gana lo hecho en este dispositivo
}
/* ---- imágenes subidas sin conexión ---- */
function guardarImagen(clave,url){
  if(almacen===almacenLocal){
    return almacenLocal.set(clave,url).then(()=>{
      if(!usaNube())return;
      try{const l=JSON.parse(localStorage.getItem(LS_IMGS)||'[]');if(!l.includes(clave)){l.push(clave);localStorage.setItem(LS_IMGS,JSON.stringify(l));}}catch(e){}
    });
  }
  return almacen.set(clave,url);
}
async function subirImagenesPendientes(){
  let l=[];try{l=JSON.parse(localStorage.getItem(LS_IMGS)||'[]');}catch(e){}
  const quedan=[];
  for(const k of l){
    try{
      const v=localStorage.getItem(k);
      if(v===null)continue;
      await conTiempo(almacenNube.set(k,v),20000);
      localStorage.removeItem(k);
    }catch(e){quedan.push(k);}
  }
  try{quedan.length?localStorage.setItem(LS_IMGS,JSON.stringify(quedan)):localStorage.removeItem(LS_IMGS);}catch(e){}
}
function pasarAModoLocal(){
  almacen=almacenLocal;actualizarBotonNube();
  avisar('Sin conexión con la nube: trabajas con la copia de este dispositivo. Lo que anotes se subirá solo al volver el internet');
}
async function reintentarNube(){
  if(!nubeAuth||!nubeAuth.currentUser||!usaNube()||almacen!==almacenLocal)return;
  const m=document.getElementById('modal');if(m&&m.open)return;   // no se cambian los datos mientras tienes una ventana abierta
  almacen=almacenNube;
  await migrarOCargarNube();
}
window.addEventListener('online',()=>setTimeout(reintentarNube,1500));
setInterval(()=>{if(hayPendiente()&&navigator.onLine!==false)reintentarNube();},60000);

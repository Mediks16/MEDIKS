<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Consultorio odontológico — HCU 033, consentimientos y pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --porcelana:#EEF2F1;--papel:#fff;--tinta:#15302A;--tinta-suave:#5A706A;
  --linea:#D6DEDB;--clinico:#0E7C6B;--clinico-claro:#E2F0ED;
  --alerta:#B24A35;--alerta-claro:#F7E9E5;--azul:#1F5FA8;--r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--porcelana);color:var(--tinta);
  font-family:Figtree,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:10px;padding:0 22px;height:76px;
  background:linear-gradient(135deg,#0C1B33,#132A52);border-bottom:1px solid #0a1730;flex-wrap:wrap;flex:none}
header.top .marca{font-family:Newsreader,serif;font-size:23px;font-weight:500;color:#fff;margin-right:8px}
header.top .marca em{font-style:normal;color:#6FA8DC}
header.top .btn{background:transparent;border:0;color:rgba(255,255,255,.82);padding:9px 15px;
  border-radius:8px;font-weight:500;font-size:14px}
header.top .btn:hover{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
header.top .btn.chico{background:rgba(255,255,255,.08);color:#fff;padding:6px 11px}
header.top .btn.chico:hover{background:rgba(255,255,255,.18)}
.menu-drop{position:relative}
.menu-drop-lista{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--papel);
  border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 28px rgba(10,25,45,.18);
  min-width:190px;padding:6px;z-index:50}
.menu-drop-lista.abierto{display:block}
.menu-drop-lista button{display:block;width:100%;text-align:left;background:none;border:0;
  padding:9px 11px;border-radius:7px;color:var(--tinta);font-weight:500;font-size:13.5px;cursor:pointer}
.menu-drop-lista button:hover{background:var(--porcelana)}
.menu-drop-lista hr{border:0;border-top:1px solid var(--linea);margin:5px 2px}
.spacer{flex:1}
.cuerpo{display:flex;flex:1;min-height:0}
aside{width:310px;flex:none;background:var(--papel);border-right:1px solid var(--linea);display:flex;flex-direction:column;min-height:0}
.buscador{padding:11px;border-bottom:1px solid var(--linea);display:flex;gap:8px}
.lista{overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linea);
  padding:10px 13px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--porcelana)}
.item[aria-current="true"]{background:var(--clinico-claro);border-left-color:var(--clinico)}
.item .nom{font-weight:600}
.item .meta{font-size:12.5px;color:var(--tinta-suave);display:flex;gap:8px;margin-top:1px}
.item .deuda{color:var(--alerta);font-weight:600}
.vacio{padding:22px 16px;color:var(--tinta-suave);font-size:14px}
/* tarjetas resumen estilo kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:16px}
.kpi-card{border-radius:14px;padding:16px 18px}
.kpi-card span{font-size:12.5px;color:var(--tinta-suave);font-weight:500}
.kpi-card b{display:block;font-family:Newsreader,serif;font-size:30px;font-weight:600;margin-top:5px}
.kpi-verde{background:linear-gradient(135deg,#E3F3E9,#F5FBF7)}.kpi-verde b{color:#2F7A3C}
.kpi-azul{background:linear-gradient(135deg,#E3EEFB,#F4F9FD)}.kpi-azul b{color:#1F5FA8}
.kpi-naranja{background:linear-gradient(135deg,#FBEDDD,#FDF7EE)}.kpi-naranja b{color:#B98A2E}
.kpi-rojo{background:linear-gradient(135deg,#FBE4DF,#FDF3F0)}.kpi-rojo b{color:#B24A35}
.kpi-morado{background:linear-gradient(135deg,#EEE6FB,#F8F5FD)}.kpi-morado b{color:#7A4FB5}
.kpi-teal{background:linear-gradient(135deg,#E2F0ED,#F3F9F8)}.kpi-teal b{color:#0E7C6B}
.kpi-rosa{background:linear-gradient(135deg,#FBE4EF,#FDF3F8)}.kpi-rosa b{color:#B5457E}
.panel-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.panel-2col{grid-template-columns:1fr}}
.rango-fechas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rango-fechas input[type=date]{width:auto}
main{flex:1;overflow:auto;min-width:0;padding:20px 32px 70px}
.centro{max-width:1400px;margin:0 auto}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:7px 9px;background:var(--papel);border:1px solid var(--linea);border-radius:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--clinico);box-shadow:0 0 0 3px var(--clinico-claro)}
textarea{resize:vertical;min-height:64px}
label.campo{display:block;margin-bottom:11px}
label.campo>span{display:block;font-size:12.5px;color:var(--tinta-suave);margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 13px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 13px}
.btn{border:1px solid var(--linea);background:var(--papel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--clinico);color:var(--clinico)}
.btn.primario{background:var(--clinico);border-color:var(--clinico);color:#fff}
.btn.primario:hover{background:#0b6759;color:#fff}
.btn.peligro:hover{border-color:var(--alerta);color:var(--alerta)}
.btn.chico{padding:4px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--clinico);outline-offset:2px}
.cabecera{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cabecera h2{font-family:Newsreader,serif;font-size:30px;font-weight:500;line-height:1.15}
.sub{color:var(--tinta-suave);font-size:13.5px;margin-top:2px}
.alergia{display:inline-block;background:var(--alerta-claro);color:var(--alerta);border-radius:6px;
  padding:3px 9px;font-size:13px;font-weight:600;margin-top:7px}
.pestanas{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:16px 0 18px;overflow:auto}
.pv-layout{display:flex;gap:22px;align-items:flex-start}
.pv-nav{width:230px;flex:none;background:linear-gradient(180deg,#0C1B33,#132A52);border-radius:16px;
  padding:28px 16px 20px;color:#fff;position:sticky;top:12px}
.pv-nav .avatar{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 12px}
.pv-nav .nombre{text-align:center;font-weight:600;font-size:15px;padding:0 4px;line-height:1.3}
.pv-nav .hc{text-align:center;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:18px}
.pv-nav .botones button{display:block;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.75);
  padding:11px 13px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:3px}
.pv-nav .botones button:hover{background:rgba(255,255,255,.09);color:#fff}
.pv-nav .botones button[aria-selected="true"]{background:rgba(255,255,255,.18);color:#fff}
.pv-content{flex:1;min-width:0}
@media (max-width:760px){
  .pv-layout{flex-direction:column}
  .pv-nav{width:100%;position:static;padding:14px}
  .pv-nav .avatar,.pv-nav .nombre,.pv-nav .hc{display:none}
  .pv-nav .botones{display:flex;overflow-x:auto;gap:4px}
  .pv-nav .botones button{width:auto;white-space:nowrap;margin-bottom:0}
}
.pestanas button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;
  cursor:pointer;color:var(--tinta-suave);font-weight:500;white-space:nowrap}
.pestanas button[aria-selected="true"]{color:var(--clinico);border-bottom-color:var(--clinico)}
.bloque{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
details.bloque{padding:0}
details.bloque>summary{padding:15px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
details.bloque>summary::-webkit-details-marker{display:none}
details.bloque>summary::after{content:'⌄';margin-left:auto;font-size:15px;color:var(--tinta-suave)}
details.bloque[open]>summary::after{content:'⌃'}
details.bloque[open]>summary{border-bottom:1px solid var(--linea)}
details.bloque>.cont{padding:14px 18px 18px}
details.opcional{border:1px solid var(--linea);border-radius:9px;margin-bottom:14px}
details.opcional>summary{padding:9px 12px;cursor:pointer;font-size:13px;color:var(--tinta-suave);
  font-weight:600;list-style:none;display:flex;align-items:center}
details.opcional>summary::-webkit-details-marker{display:none}
details.opcional>summary::after{content:'⌄';margin-left:auto;color:var(--tinta-suave)}
details.opcional[open]>summary::after{content:'⌃'}
details.opcional[open]>summary{border-bottom:1px solid var(--linea);color:var(--tinta)}
details.opcional>.cont{padding:12px}
.selector-diente{display:flex;flex-direction:column;gap:6px;align-items:center}
.selector-diente .arcada{display:flex;gap:10px}
.selector-diente .cuadrante{display:flex;gap:2px}
.selector-diente button{width:30px;height:30px;border:1px solid var(--linea);border-radius:6px;
  background:var(--papel);cursor:pointer;font-size:11px;color:var(--tinta)}
.selector-diente button:hover{border-color:var(--clinico);background:var(--clinico-claro)}
.fila-item-presu{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.fila-item-presu .caras-mini{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:4px}
.fila-item-presu .caras-mini label{display:flex;align-items:center;gap:4px}
details.bloque>summary b{background:var(--tinta);color:#fff;width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;font-size:12.5px;flex:none}
details.bloque>summary span.tit{font-size:14.5px;letter-spacing:.01em;color:var(--tinta);font-weight:600}
details.bloque>summary span.res{font-size:12.5px;color:var(--tinta-suave);font-weight:400;margin-left:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-tit{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.barra-tit b{background:var(--tinta);color:#fff;width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;font-size:12.5px;flex:none}
.barra-tit h3{font-size:14.5px;letter-spacing:.01em}
.barra-tit .der{margin-left:auto}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:2px 12px}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;padding:2px 0}
.chk input{width:15px;height:15px;accent-color:var(--clinico);flex:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--tinta-suave);font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--linea)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
td.der,th.der{text-align:right;padding-right:0;font-variant-numeric:tabular-nums}
.mini{font-size:13px;color:var(--tinta-suave)}
/* odontograma */
.odonto{display:flex;flex-direction:column;gap:10px;align-items:center;overflow-x:auto;padding:4px 0}
.arcada{display:flex;gap:14px}
.cuadrante{display:flex;gap:3px}
.diente{width:38px;text-align:center;font-size:9.5px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
.diente .sim{display:block;height:30px;line-height:30px;font-size:17px;font-weight:700;cursor:pointer;
  border:1px solid var(--linea);border-radius:6px;background:var(--papel)}
.diente .sim:hover{border-color:var(--clinico)}
.diente .numd{display:block;margin-top:3px;font-weight:600}
.diente .mr{display:block;height:10px;font-size:8px;letter-spacing:.1px;color:var(--alerta)}
.carasmini{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:30px;height:30px;margin:0 auto;border:1.5px solid var(--tinta);border-radius:6px;overflow:hidden;background:var(--porcelana)}
.carasmini i{display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;
  border:1px solid #B9C4C1;font-size:7.5px;font-weight:700;font-style:normal;line-height:1;color:#fff}
.carasmini i:hover{outline:1.5px solid var(--clinico);outline-offset:-1.5px;position:relative;z-index:1}
.cara-v{grid-column:2;grid-row:1}
.cara-m{grid-column:1;grid-row:2}
.cara-o{grid-column:2;grid-row:2}
.cara-d{grid-column:3;grid-row:2}
.cara-l{grid-column:2;grid-row:3}
.diente .editar{display:block;margin:3px auto 0;width:14px;height:14px;line-height:13px;border-radius:50%;
  border:1px solid var(--linea);background:var(--papel);color:var(--tinta-suave);font-size:8px;cursor:pointer}
.diente .editar:hover{border-color:var(--clinico);color:var(--clinico)}
.paleta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.paleta button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--linea);border-radius:8px;
  padding:6px 10px;background:var(--papel);cursor:pointer;font-size:12.5px;color:var(--tinta)}
.paleta button i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15);flex:none}
.paleta button:hover{border-color:var(--clinico)}
.paleta button[aria-pressed="true"]{border-color:var(--clinico);background:var(--clinico-claro);font-weight:600}
.paleta .sep{width:1px;background:var(--linea);margin:2px 4px}
.leyenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:3px 14px;margin-top:14px;font-size:13px}
.leyenda span b{font-size:15px;display:inline-block;width:18px}
.leyenda-titulo{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--tinta);margin-bottom:2px}
/* agenda */
.ag-topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ag-topbar input[type=date]{width:auto}
.ag-nav{display:flex;gap:4px}
.ag-nav button[aria-pressed="true"]{border-color:var(--clinico);color:var(--clinico);background:var(--clinico-claro)}
.ag-grid-wrap{display:flex;border:1px solid var(--linea);border-radius:14px;background:var(--papel);overflow:auto}
.ag-horas{width:50px;flex:none;border-right:1px solid var(--linea);position:relative}
.ag-hora-lbl{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
.ag-dias{flex:1;display:flex;position:relative;min-width:0}
.ag-dia-col{flex:1;min-width:118px;position:relative;border-right:1px solid var(--linea)}
.ag-dia-col:last-child{border-right:0}
.ag-dia-head{text-align:center;padding:9px 4px;border-bottom:1px solid var(--linea);font-size:12px;
  color:var(--tinta-suave);background:var(--porcelana);position:sticky;top:0;text-transform:lowercase}
.ag-dia-head b{display:block;font-size:16px;font-family:Newsreader,serif;color:var(--tinta);font-weight:500}
.ag-dia-head.hoy{color:var(--clinico)}
.ag-dia-head.hoy b{color:var(--clinico)}
.ag-linea{position:absolute;left:0;right:0;border-top:1px solid var(--linea)}
.ag-slot{position:absolute;left:0;right:0;cursor:pointer}
.ag-slot:hover{background:var(--clinico-claro)}
.ag-cita{position:absolute;left:4px;right:4px;border-radius:9px;padding:5px 9px;font-size:11.5px;
  overflow:hidden;cursor:pointer;border:1px solid transparent;line-height:1.32;z-index:2;
  box-shadow:0 1px 2px rgba(15,40,35,.06)}
.ag-cita:hover{filter:brightness(0.97)}
.ag-cita .hora{display:block;font-size:10.5px;font-weight:600;opacity:.8;letter-spacing:.01em}
.ag-cita .nom{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ag-cita .mot{display:block;font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-cita.agendada{background:#DCEEE9;border-color:#BFE1D7;color:#0b4a40}
.ag-cita.confirmada{background:var(--clinico);border-color:#0b6759;color:#fff}
.ag-cita.confirmada .hora,.ag-cita.confirmada .mot{opacity:.88}
.ag-cita.atendida{background:#E9ECEB;border-color:#DADFDD;color:var(--tinta-suave)}
.ag-cita.no_asistio{background:#F7E4DE;border-color:#F0CCC0;color:#8a3323}
.ag-cita.cancelada{background:#EDEFEE;border-color:var(--linea);color:var(--tinta-suave);text-decoration:line-through}
.ag-linea-hoy{position:absolute;left:0;right:0;height:2px;background:var(--alerta);z-index:3}
/* ortodoncia */
.orto-resumen{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.orto-progreso{background:var(--linea);border-radius:99px;height:8px;overflow:hidden;margin-top:6px}
.orto-progreso>div{background:var(--clinico);height:100%;border-radius:99px}
/* firma electrónica */
.firmapad{border:1.5px dashed var(--linea);border-radius:8px;touch-action:none;background:#fff;
  display:block;width:100%;height:150px;cursor:crosshair}
.firma-guardada{max-width:280px;border:1px solid var(--linea);border-radius:8px;background:#fff;padding:6px;display:block}
.firma-meta{font-size:12.5px;color:var(--tinta-suave);margin-top:6px}
/* radiografías */
.rx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rx-card{border:1px solid var(--linea);border-radius:9px;overflow:hidden;background:var(--papel);cursor:pointer}
.rx-card .thumb{width:100%;aspect-ratio:4/3;background:#0b1f1b url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22><text y=%2216%22 font-size=%2214%22>...</text></svg>') center/24px no-repeat;
  display:flex;align-items:center;justify-content:center;color:#8fb0a9;font-size:12px}
.rx-card img{width:100%;height:100%;object-fit:cover;display:block}
.rx-card .info{padding:7px 9px;font-size:12.5px}
.rx-card .info b{display:block;font-size:13px}
.rx-card .info span{color:var(--tinta-suave)}
.rx-full{width:100%;max-height:62vh;object-fit:contain;border-radius:8px;background:#0b1f1b;display:block;margin-bottom:12px}
.subir{border:1.5px dashed var(--linea);border-radius:10px;padding:22px;text-align:center;color:var(--tinta-suave);cursor:pointer}
.subir:hover{border-color:var(--clinico);color:var(--clinico)}
.subir input{display:none}
/* pagos */
.saldos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.barra-pac{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.barra-pac input[type=text]{flex:1;min-width:200px}
.barra-pac select{width:auto}
.tabla-pac{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.tabla-pac th{text-align:left;font-size:12px;color:var(--tinta-suave);font-weight:600;padding:10px 12px;
  background:var(--porcelana);border-bottom:1px solid var(--linea)}
.tabla-pac td{padding:11px 12px;border-bottom:1px solid var(--linea);font-size:13.5px;vertical-align:middle}
.tabla-pac tr:last-child td{border-bottom:0}
.tabla-pac tr.fila-pac{cursor:pointer}
.tabla-pac tr.fila-pac:hover{background:var(--porcelana)}
.tabla-pac .avatar{width:30px;height:30px;border-radius:50%;background:var(--clinico-claro);color:var(--clinico);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;margin-right:9px;flex:none}
.saldo{flex:1;min-width:145px;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:13px 15px}
.saldo b{display:block;font-family:Newsreader,serif;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.saldo span{font-size:12.5px;color:var(--tinta-suave)}

/* Guardado local: funciona sin internet, sirve como respaldo temporal y como modo
   de emergencia si por algún motivo no se puede llegar a la nube. */
const almacenLocal={
  async get(key){
    const v=localStorage.getItem(key);
    if(v===null){const err=new Error('no existe');err.code='NOT_FOUND';throw err;}
    return {key,value:v};
  },
  async set(key,value){localStorage.setItem(key,value);return {key,value};},
  async delete(key){localStorage.removeItem(key);return {key,deleted:true};}
};

/* Guardado en la nube (Firestore): así se sincroniza entre el computador y el teléfono. */
let nubeApp=null,nubeAuth=null,nubeDb=null,nubeUid=null,nubeActiva=false;
const almacenNube={
  async get(key){
    const snap=await nubeDb.collection('consultorios').doc(nubeUid).collection('kv').doc(key).get();
    if(!snap.exists){const err=new Error('no existe');err.code='NOT_FOUND';throw err;}
    return {key,value:snap.data().v};
  },
  async set(key,value){
    await nubeDb.collection('consultorios').doc(nubeUid).collection('kv').doc(key).set({v:value});
    return {key,value};
  },
  async delete(key){
    await nubeDb.collection('consultorios').doc(nubeUid).collection('kv').doc(key).delete();
    return {key,deleted:true};
  }
};
let almacen=almacenLocal; // se cambia a almacenNube en cuanto hay sesión activa

const CLAVE='odonto-033-v1';

function edad(f){if(!f)return null;const n=new Date(f),h=new Date();let e=h.getFullYear()-n.getFullYear();
  const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))e--;return(e>=0&&e<130)?e:null;}
function edadTexto(f){
  const anios=edad(f);if(anios===null)return'';
  if(anios>=5)return anios+' años';
  const n=new Date(f),h=new Date();
  let meses=(h.getFullYear()-n.getFullYear())*12+(h.getMonth()-n.getMonth());
  if(h.getDate()<n.getDate())meses--;
  const a=Math.floor(meses/12),mRes=meses%12;
  return `${a} año${a===1?'':'s'} ${mRes} mes${mRes===1?'':'es'}`;
}
function avisar(t){const a=$('#aviso');a.textContent=t;a.classList.add('ver');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('ver'),2200);}
let tGuarda;
function guardar(){clearTimeout(tGuarda);tGuarda=setTimeout(async()=>{
  try{await almacen.set(CLAVE,JSON.stringify(datos));}
  catch(e){console.error(e);avisar('No se pudo guardar. Descarga un respaldo.');}
  if(almacen!==almacenLocal){try{await almacenLocal.set(CLAVE,JSON.stringify(datos));}catch(e){}}
},350);}
async function cargar(){try{const r=await almacen.get(CLAVE);if(r&&r.value)datos=JSON.parse(r.value);}catch(e){}
  datos.pacientes=datos.pacientes||[];datos.config=datos.config||{};datos.citas=datos.citas||[];
  datos.tareas=datos.tareas||[];datos.inventario=datos.inventario||[];datos.profesionales=datos.profesionales||[];
  datos.gastosProfesionales=datos.gastosProfesionales||[];
  // migración: el sellante pasó de marcarse por cara a marcarse como condición general del diente
  const migrarSellante=o=>{if(!o)return;Object.keys(o).forEach(n=>{const d=o[n];
    if(d&&d.caras){['V','M','O','D','L'].forEach(k=>{const v=d.caras[k];
      if(v==='sellante_nec'||v==='sellante_real'){if(!d.general)d.general=v;delete d.caras[k];}});}});};
  datos.pacientes.forEach(p=>{migrarSellante(p.odontograma);if(p.odontogramaInicial)migrarSellante(p.odontogramaInicial.dientes);});
}

function actualizarBotonNube(){
  const b=$('#btnNube');if(!b)return;
  if(nubeActiva&&nubeAuth&&nubeAuth.currentUser){b.textContent='☁ '+nubeAuth.currentUser.email;}
  else{b.textContent='Nube: sin conectar';}
}
function inicializarFirebase(){
  try{
    nubeApp=firebase.apps.length?firebase.app():firebase.initializeApp(FIREBASE_CONFIG);
    nubeAuth=firebase.auth();
    nubeDb=firebase.firestore();
    try{nubeDb.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
  }catch(e){console.error(e);}
}
function traducirErrorAuth(code){
  const mapa={'auth/email-already-in-use':'Ese correo ya tiene una cuenta creada. Usa «Iniciar sesión».',
    'auth/invalid-email':'Ese correo no es válido.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/user-not-found':'No existe una cuenta con ese correo. Usa «Crear cuenta».',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/network-request-failed':'No hay conexión a internet en este momento.'};
  return mapa[code]||'No se pudo completar. Intenta de nuevo.';
}
async function migrarOCargarNube(){
  try{
    await almacenNube.get(CLAVE);
    await cargar();pintar();avisar('Datos sincronizados desde la nube');
  }catch(e){
    await almacenNube.set(CLAVE,JSON.stringify(datos));
    pintar();avisar('Tus datos de este dispositivo se subieron a la nube');
  }
}
function abrirLoginNube(){
  abrirModal('Conectar con tu cuenta',`
    <p class="mini">Usa el mismo correo y contraseña en todos tus dispositivos para que compartan la misma información.</p>
    <label class="campo"><span>Correo</span><input type="email" id="nb_email" autofocus></label>
    <label class="campo"><span>Contraseña</span><input type="password" id="nb_pass"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
      <button class="btn chico" type="button" id="nb_crear">Crear cuenta (primera vez)</button>
      <button class="btn primario chico" type="button" id="nb_entrar">Iniciar sesión</button>
    </div>
    <p class="mini" id="nb_msg" style="color:var(--alerta);min-height:16px"></p>`,null);
  const leer=()=>({email:$('#nb_email').value.trim(),pass:$('#nb_pass').value});
  async function procesar(promesa){
    const m=$('#nb_msg');m.textContent='';
    try{
      const cred=await promesa;
      nubeUid=cred.user.uid;nubeActiva=true;almacen=almacenNube;
      $('#modal').close();actualizarBotonNube();
      await migrarOCargarNube();
    }catch(e){m.textContent=traducirErrorAuth(e.code);}
  }
  $('#nb_crear').onclick=()=>{const {email,pass}=leer();
    if(!email||pass.length<6){$('#nb_msg').textContent='Escribe un correo y una contraseña de al menos 6 caracteres.';return;}
    procesar(nubeAuth.createUserWithEmailAndPassword(email,pass));};
  $('#nb_entrar').onclick=()=>{const {email,pass}=leer();
    if(!email||!pass){$('#nb_msg').textContent='Completa correo y contraseña.';return;}
    procesar(nubeAuth.signInWithEmailAndPassword(email,pass));};
}
function abrirNube(){
  if(nubeActiva&&nubeAuth&&nubeAuth.currentUser){
    abrirModal('Sincronización en la nube',`
      <p>Conectado como <b>${esc(nubeAuth.currentUser.email)}</b>. Tus datos se guardan y actualizan automáticamente en todos los dispositivos donde inicies sesión con esta misma cuenta.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn chico" type="button" id="nb_salir">Cerrar sesión en este dispositivo</button>
      </div>`,null);
    $('#nb_salir').onclick=async()=>{
      await nubeAuth.signOut();nubeActiva=false;almacen=almacenLocal;
      $('#modal').close();actualizarBotonNube();avisar('Sesión cerrada. Volviste al modo local en este dispositivo.');
      await cargar();pintar();
    };
    return;
  }
  abrirLoginNube();
}
async function arrancar(){
  inicializarFirebase();
  inicializarGoogleCalendar();
  await cargar(); // primero lo que haya localmente, para no mostrar la app vacía
  aplicarTema();
  pintar();
  if(nubeAuth){
    await new Promise(resolver=>{
      let resuelto=false;
      const terminar=()=>{if(!resuelto){resuelto=true;resolver();}};
      nubeAuth.onAuthStateChanged(async user=>{
        if(user){
          nubeUid=user.uid;nubeActiva=true;almacen=almacenNube;
          actualizarBotonNube();
          await migrarOCargarNube();
          aplicarTema();
        }else{
          nubeActiva=false;almacen=almacenLocal;
          actualizarBotonNube();
        }
        terminar();
      });
      setTimeout(terminar,4000);
    });
  }else{
    actualizarBotonNube();
  }
}

  orto:'Ortodoncia',receta:'Receta',fotos:'Fotos',rx:'Radiografías',cons:'Consentimientos',pagos:'Pagos'};
function ordenPestanasActual(){
  const guardado=(datos.config&&datos.config.ordenPestanas)||[];
  const claves=Object.keys(TABS_PACIENTE);
  const orden=guardado.filter(k=>claves.includes(k));
  claves.forEach(k=>{if(!orden.includes(k))orden.push(k);});
  return orden;
}

/* ================= cálculos ================= */
const pac=id=>datos.pacientes.find(p=>p.id===id);
const totalTrat=p=>(p.tratamientos||[]).reduce((s,t)=>s+(Number(t.costo)||0),0);
const totalAbon=p=>(p.abonos||[]).reduce((s,a)=>s+(Number(a.monto)||0),0);
const saldo=p=>totalTrat(p)-totalAbon(p);
function cpo(p){
  const o=p.odontograma||{},permanente=n=>+n<51||+n>85;
  const r={C:0,P:0,O:0,c:0,e:0,o:0};
  for(const n in o){
    const d=o[n],perm=permanente(n);
    const caras=d.caras||{};
    const tieneCaries=Object.values(caras).includes('caries');
    const tieneObturado=Object.values(caras).some(v=>v==='obturado'||v==='provisional');
    if(['perdida_caries','removible_ind','removible_real','total_ind','total_real','implante_ind','implante_real'].includes(d.general)) perm?r.P++:r.e++;
    else if(d.general==='perdida_otra'||d.general==='retenido'||d.general==='otro'||d.general==='sellante_nec'||d.general==='sellante_real'){/* no cuentan en el índice */}
    else if(d.general==='extraccion'||d.general==='endo_nec'||d.general==='corona_ind'||d.general==='puente_ind'||d.general==='fractura'||d.general==='lesion'||tieneCaries) perm?r.C++:r.c++;
    else if(d.general==='endo_real'||d.general==='corona_real'||d.general==='puente_real'||tieneObturado) perm?r.O++:r.o++;
  }
  return r;
}

let herramientaOdonto=null; // {tipo:'cara'|'general', valor:''}

function guardarOdontogramaInicial(p){
  const tieneAlgo=Object.keys(p.odontograma||{}).length>0;
  if(!tieneAlgo){avisar('Marca al menos un diente antes de guardar el odontograma inicial');return;}
  if(p.odontogramaInicial&&!confirm('Ya existe un odontograma inicial guardado del '+fechaCorta(p.odontogramaInicial.fecha)+'. Esto lo reemplaza con el estado actual. ¿Continuar?'))return;
  p.odontogramaInicial={dientes:JSON.parse(JSON.stringify(p.odontograma)),fecha:hoy()};
  guardar();avisar('Odontograma inicial guardado');pintarVista();
}
function generarPresupuestoDesdeOdontograma(p){
  const items=[],o=p.odontograma||{};
  Object.keys(o).sort((a,b)=>+a-+b).forEach(n=>{
    const d=o[n];
    if(d.general&&SIMB_GENERAL[d.general]&&SIMB_GENERAL[d.general].c==='#B24A35'){
      items.push({tratamiento:SIMB_GENERAL[d.general].n,pieza:n,precio:''});
    }
    if(d.caras){
      const porEstado={};
      Object.entries(d.caras).forEach(([cara,est])=>{
        if(SIMB_CARA[est]&&SIMB_CARA[est].c==='#B24A35')porEstado[est]=(porEstado[est]||[]).concat(cara);
      });
      Object.entries(porEstado).forEach(([est,caras])=>{
        items.push({tratamiento:`${SIMB_CARA[est].n} (${caras.join('')})`,pieza:n,precio:''});
      });
    }
  });
  if(!items.length){avisar('No hay nada marcado en rojo (pendiente) en el odontograma actual');return;}
  p.presupuestos=p.presupuestos||[];
  const numero=`${new Date().getFullYear()}-${String(p.presupuestos.length+1).padStart(3,'0')}`;
  const nuevo={id:uid(),numero,fecha:hoy(),items,descuentoPct:0,estado:'Pendiente',notas:'Generado automáticamente a partir de lo marcado en rojo en el odontograma.'};
  p.presupuestos.push(nuevo);
  guardar();presupuestoEditando=nuevo.id;pestana='trat';pintarVista();
  avisar(`Presupuesto generado con ${items.length} tratamiento${items.length===1?'':'s'} pendientes — revisa y pon los precios`);
}

  const set=p.odontoLeche?FDI.leche:FDI.adulto;

  const datosOdonto=verInicial?p.odontogramaInicial.dientes:p.odontograma;
  const activo=t=>herramientaOdonto&&herramientaOdonto.tipo===t.tipo&&herramientaOdonto.valor===t.valor;
  const fila=qs=>qs.map(q=>`<div class="cuadrante">${q.map(n=>{
    const d=datosOdonto[n]||{};
    const mr=[d.mov?'M'+d.mov:'',d.rec?'R'+d.rec:''].filter(Boolean).join(' ');
    let contenido,titulo;

    `<label class="campo"><span>Nota de la pieza</span><input type="text" id="d_nota" value="${esc(d.nota||'')}"></label>

/* ---------- tratamientos (barra 12) ---------- */
let presupuestoEditando=null;
function agruparTratPorEspecialidad(ts){
  const grupos={},orden=[];
  ts.forEach(t=>{
    let key='__general__',titulo='Odontología general (tú)';
    if(t.profesionalId){
      const prof=datos.profesionales.find(x=>x.id===t.profesionalId);
      if(prof&&prof.especialidad){key='esp:'+prof.especialidad;titulo=prof.especialidad;}
      else if(prof){key='prof:'+prof.id;titulo=prof.nombre;}
    }
    if(!grupos[key]){grupos[key]={titulo,items:[]};orden.push(key);}
    grupos[key].items.push(t);
  });
  orden.sort((a,b)=>(a==='__general__'?-1:1)-(b==='__general__'?-1:1));
  return orden.map(k=>grupos[k]);
}
function tablaTrat(items,abonadoDe){

      <th>Procedimientos y prescripciones</th><th class="der" style="width:75px">Costo</th>
      <th class="der" style="width:75px">Abonado</th><th class="der" style="width:75px">Saldo</th><th style="width:130px"></th></tr></thead><tbody>
      ${items.map(t=>{
        const abonado=abonadoDe(t.id),costo=Number(t.costo)||0,saldoT=costo-abonado;
        return `<tr><td class="num">${esc(t.sesion||'')}<br>${fechaCorta(t.fecha)}</td>
        <td>${esc(t.dx||'')}${t.pieza?`<br><span class="mini">Pieza ${esc(t.pieza)}</span>`:''}</td>
        <td style="white-space:pre-wrap">${esc(t.proc||'')}${t.presc?`\n${esc(t.presc)}`:''}</td>
        <td class="der">${costo?usd(costo):'—'}</td>
        <td class="der">${abonado?usd(abonado):'—'}</td>
        <td class="der" style="color:${saldoT>0.004?'var(--alerta)':'inherit'}">${costo?usd(saldoT):'—'}</td>
        <td class="der"><button class="btn chico" onclick="editarAbono(null,'${t.id}')">Abonar</button>
        <button class="btn chico" onclick="editarTrat('${t.id}')">Editar</button>
        <button class="btn chico peligro" onclick="borrarItem('tratamientos','${t.id}')">×</button></td></tr>`;}).join('')}
      </tbody></table>`;
}
function tabTrat(p,c){
  p.tratamientos=p.tratamientos||[];p.abonos=p.abonos||[];
  const abonadoDe=tId=>p.abonos.filter(a=>a.tratamientoId===tId).reduce((s,a)=>s+(Number(a.monto)||0),0);
  const ts=[...p.tratamientos];
  const grupos=agruparTratPorEspecialidad(ts);
  const hayVariasEspecialidades=grupos.length>1;
  c.innerHTML=`<div id="zonaPresupuestos"></div>

      <button class="btn primario" onclick="editarTrat()">Agregar sesión</button>

  renderPresupuestos(p,document.getElementById('zonaPresupuestos'));

function renderPresupuestos(p,c){
  p.presupuestos=p.presupuestos||[];
  if(presupuestoEditando){renderEditorPresupuesto(p,c);return;}
  const rs=[...p.presupuestos].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  c.innerHTML=`<div class="bloque"><div class="barra-tit"><h3>Presupuestos</h3>
      <button class="btn chico der" onclick="nuevoPresupuesto()">Nuevo presupuesto</button></div>
    ${rs.length?rs.map(x=>{
      const t=totalPresupuesto(x);
      return `<div class="evo">
        <div class="fecha">${fechaCorta(x.fecha)}</div>
        <div><span class="dx">#${esc(x.numero||'')} — ${usd(t.total)}</span>
          <span class="mini" style="margin-left:8px;color:${x.estado==='Aceptado'?'var(--clinico)':x.estado==='Rechazado'?'var(--alerta)':'var(--tinta-suave)'}">${esc(x.estado||'Pendiente')}</span>
          <p class="mini">${(x.items||[]).length} tratamiento${(x.items||[]).length===1?'':'s'}</p>
          <div class="acciones-evo"><button onclick="editarPresupuestoId('${x.id}')">Editar / imprimir</button>
          <button onclick="borrarPresupuestoLista('${x.id}')">Eliminar</button></div></div></div>`;
    }).join(''):'<p class="mini">Este paciente aún no tiene presupuestos.</p>'}</div>`;
}
function totalPresupuesto(x){
  const subtotal=(x.items||[]).reduce((s,it)=>s+(Number(it.precio)||0),0);
  const descuento=subtotal*((Number(x.descuentoPct)||0)/100);
  return {subtotal,descuento,total:subtotal-descuento};
}

        </div>
        <div class="grid">
          <label class="campo"><span>Pieza</span>
            <div style="display:flex;gap:6px">
              <input type="text" data-item="${i}-pieza" value="${esc(it.pieza||'')}" style="flex:1">
              <button class="btn chico" type="button" data-elegirpieza="${i}" title="Elegir del odontograma">🦷</button>
            </div></label>
          <label class="campo"><span>Precio (USD)</span><input type="number" step="0.01" min="0" data-item="${i}-precio" value="${it.precio??''}"></label>
        </div>
        <span class="mini">Cara(s), si aplica</span>
        <div class="caras-mini">${CARAS.map(([k,n])=>`<label><input type="checkbox" class="cara-item-chk" data-idx="${i}" value="${k}" ${it.caras.includes(k)?'checked':''}> ${k}</label>`).join('')}
          <button class="btn chico peligro" style="margin-left:auto" onclick="quitarItemPresupuesto(${i})">Eliminar</button></div>
        </div>`;}).join('')}</div>
      <div class="grid" style="margin-top:12px">
        <label class="campo"><span>Descuento (%)</span><input type="number" min="0" max="100" data-pk="descuentoPct" value="${x.descuentoPct??0}"></label>
      </div>
      <div class="saldos" style="margin-top:6px">
        <div class="saldo"><b>${usd(t.subtotal)}</b><span>Subtotal</span></div>
        <div class="saldo"><b>-${usd(t.descuento)}</b><span>Descuento</span></div>
        <div class="saldo"><b>${usd(t.total)}</b><span>Total</span></div>
      </div></div>
    <div class="bloque"><label class="campo"><span>Notas para el paciente</span>
      <textarea data-pk="notas" placeholder="Vigencia del presupuesto, forma de pago, condiciones…">${esc(x.notas||'')}</textarea></label></div>
    <div style="display:flex;gap:8px">
      <button class="btn primario" onclick="imprimirPresupuesto('${x.id}')">Guardar e imprimir</button>
      <button class="btn peligro" onclick="borrarPresupuestoEditor('${x.id}')">Eliminar presupuesto</button>
    </div>`;
  c.querySelectorAll('[data-pk]').forEach(el=>el.onchange=()=>{x[el.dataset.pk]=el.value;guardar();
    if(el.dataset.pk==='descuentoPct')pintarVista();});
  c.querySelectorAll('[data-item]').forEach(el=>el.onchange=()=>{
    const [i,campo]=el.dataset.item.split('-');x.items[i][campo]=el.value;guardar();
    if(campo==='precio')pintarVista();});
  c.querySelectorAll('.cat-shortcut').forEach(sel=>sel.onchange=()=>{
    if(!sel.value)return;
    x.items[sel.dataset.idx].tratamiento=sel.value;guardar();pintarVista();
  });
  c.querySelectorAll('[data-elegirpieza]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.elegirpieza;
    abrirSelectorDiente(num=>{
      const actual=(x.items[i].pieza||'').trim();
      x.items[i].pieza=actual?actual+', '+num:num;
      guardar();pintarVista();
    });
  });
  c.querySelectorAll('.cara-item-chk').forEach(chk=>chk.onchange=()=>{
    const i=chk.dataset.idx,it=x.items[i];it.caras=it.caras||[];
    if(chk.checked){if(!it.caras.includes(chk.value))it.caras.push(chk.value);}
    else{it.caras=it.caras.filter(c=>c!==chk.value);}
    guardar();
  });
}
function agregarItemPresupuesto(){
  const p=pac(selId),x=p.presupuestos.find(y=>y.id===presupuestoEditando);
  x.items.push({});guardar();pintarVista();
}
function quitarItemPresupuesto(i){
  const p=pac(selId),x=p.presupuestos.find(y=>y.id===presupuestoEditando);
  x.items.splice(i,1);if(!x.items.length)x.items.push({});guardar();pintarVista();
}
function borrarPresupuestoEditor(id){
  if(!confirm('¿Eliminar este presupuesto?'))return;
  const p=pac(selId);p.presupuestos=p.presupuestos.filter(y=>y.id!==id);presupuestoEditando=null;guardar();pintarVista();
}

  $('#impresion').innerHTML=`<div class="hoja">${encabezadoHoja(p)}
    <section><h4 style="text-align:center">PRESUPUESTO — PLAN DE TRATAMIENTO N.º ${esc(x.numero||'')}</h4>
      <div class="fila"><div><span class="rot">Fecha</span>${fechaCorta(x.fecha)}</div>
        <div><span class="rot">Estado</span>${esc(x.estado||'Pendiente')}</div></div></section>
    <section><table><thead><tr><th>Tratamiento</th><th>Pieza</th><th style="text-align:right">Precio</th></tr></thead>
      <tbody>${filas||'<tr><td colspan="3">Sin tratamientos</td></tr>'}</tbody></table></section>

        <div><span class="rot">Subtotal</span>${usd(t.subtotal)}</div>
        <div><span class="rot">Descuento (${esc(x.descuentoPct||0)}%)</span>-${usd(t.descuento)}</div>
        <div><span class="rot">Total</span><b style="font-size:13px">${usd(t.total)}</b></div>
      </div>${x.notas?`<div class="texto" style="margin-top:8px">${esc(x.notas)}</div>`:''}</section>
    <div class="firma" style="margin-top:46px">
      <div>${esc(p.nombre||'')}<br>Paciente</div>
      <div>${esc(g.profesional||'')}<br>Odontólogo/a — Cód. MSP ${esc(g.codigo||'')}</div></div>

function editarTrat(id){
  const p=pac(selId),t=p.tratamientos.find(x=>x.id===id)||{fecha:hoy(),sesion:'N.º '+(p.tratamientos.length+1)};
  const resumenLab=t.labCosto?`${t.labNombre||'Laboratorio'} — ${usd(t.labCosto)}`:'opcional';
  const resumenHon=t.honorarioMonto?`Acordado ${usd(t.honorarioMonto)}`:'opcional';
  abrirModal(`${id?'Editar':'Nueva'} sesión de tratamiento`,`
    <div class="grid">
      <label class="campo"><span>Sesión</span><input type="text" id="t_ses" value="${esc(t.sesion||'')}"></label>
      <label class="campo"><span>Fecha</span><input type="date" id="t_fecha" value="${esc(t.fecha||hoy())}"></label>
      <label class="campo"><span>Pieza(s)</span>
        <div style="display:flex;gap:6px">
          <input type="text" id="t_pieza" value="${esc(t.pieza||'')}" style="flex:1">
          <button class="btn chico" type="button" id="t_elegirPieza" title="Elegir del odontograma">🦷</button>
        </div></label>
      ${(datos.profesionales&&datos.profesionales.length)?`<label class="campo"><span>Profesional</span><select id="t_prof">
        ${opcionesProfesionales(t.profesionalId)}</select></label>`:''}
    </div>
    <label class="campo"><span>Diagnóstico y complicaciones</span>
      <textarea id="t_dx" placeholder="Si no hay complicaciones, anotar «no presenta complicaciones»">${esc(t.dx||'')}</textarea></label>

    <label class="campo"><span>Procedimientos realizados</span></label>
    <div class="grid">
      <label class="campo"><span>Elegir del catálogo (opcional)</span><select id="t_procCat">
        <option value="">— Elegir tratamiento —</option>
        ${Object.entries(CATALOGO_TRATAMIENTOS).map(([cat,lista])=>`<optgroup label="${esc(cat)}">
          ${lista.map(tr=>`<option value="${esc(tr)}">${esc(tr)}</option>`).join('')}
        </optgroup>`).join('')}
      </select></label>
      <div id="t_procCarasWrap" style="display:none">
        <span class="mini">¿Qué cara(s)?</span>
        <div class="chks">${CARAS.map(([k,n])=>`<label class="chk"><input type="checkbox" class="t_procCara_chk" value="${k}"> ${k}</label>`).join('')}</div>
      </div>
    </div>
    <textarea id="t_proc" placeholder="Se completa solo al elegir del catálogo, o escribe aquí directamente">${esc(t.proc||'')}</textarea>
    <p class="mini" style="margin-top:-6px">Al elegir del catálogo, el odontograma de esta pieza se actualiza solo al guardar.</p>

    <label class="campo"><span>Prescripciones</span><textarea id="t_presc">${esc(t.presc||'')}</textarea></label>
    <div class="grid">
      <label class="campo"><span>Costo del tratamiento (USD)</span><input type="number" step="0.01" min="0" id="t_costo" value="${t.costo??''}"></label>
      <label class="campo"><span>Próxima cita</span><input type="date" id="t_prox" value="${esc(t.prox||'')}"></label>
      <label class="campo"><span>Hora</span><input type="time" id="t_proxHora" value="${esc(t.proxHora||'09:00')}"></label>
    </div>

    <details class="opcional"><summary>¿El paciente pidió presupuesto de esto?</summary>
      <div class="cont">
        <label class="chk"><input type="checkbox" id="t_alPresu"> Agregar este tratamiento a un presupuesto (se usa el mismo costo de arriba)</label>
        <p class="mini">Se agrega al presupuesto «Pendiente» más reciente de este paciente, o crea uno nuevo si no hay ninguno.</p>
      </div></details>

    <details class="opcional"><summary>Laboratorio — <span class="mini" style="margin-left:4px">${esc(resumenLab)}</span></summary>
      <div class="cont grid">
        <label class="campo"><span>Nombre del laboratorio</span><input type="text" id="t_labNombre" value="${esc(t.labNombre||'')}"></label>
        <label class="campo"><span>Costo de laboratorio (USD)</span><input type="number" step="0.01" min="0" id="t_labCosto" value="${t.labCosto??''}"></label>
        <label class="campo"><span>Abonado al laboratorio (USD)</span><input type="number" step="0.01" min="0" id="t_labAbonado" value="${t.labAbonado??''}"></label>
      </div></details>

    <details class="opcional"><summary>Honorario al profesional — <span class="mini" style="margin-left:4px">${esc(resumenHon)}</span></summary>
      <div class="cont">
        <p class="mini" style="margin-top:0">No se muestra al paciente, solo en «Gastos».</p>
        <div class="grid">
          <label class="campo"><span>Honorario acordado (USD)</span><input type="number" step="0.01" min="0" id="t_honMonto" value="${t.honorarioMonto??''}"></label>
          <label class="campo"><span>Ya pagado al profesional (USD)</span><input type="number" step="0.01" min="0" id="t_honPagado" value="${t.honorarioPagado??''}"></label>
        </div>
      </div></details>`,
  ()=>{
    const d={id:t.id||uid(),sesion:$('#t_ses').value,fecha:$('#t_fecha').value,pieza:$('#t_pieza').value.trim(),
      dx:$('#t_dx').value.trim(),proc:$('#t_proc').value.trim(),presc:$('#t_presc').value.trim(),
      costo:Number($('#t_costo').value)||0,prox:$('#t_prox').value,proxHora:$('#t_proxHora').value||'09:00',
      labNombre:$('#t_labNombre').value.trim(),labCosto:Number($('#t_labCosto').value)||0,labAbonado:Number($('#t_labAbonado').value)||0,
      honorarioMonto:Number($('#t_honMonto').value)||0,honorarioPagado:Number($('#t_honPagado').value)||0};
    const profSel=document.getElementById('t_prof');
    if(profSel){const info=profSel.value?datos.profesionales.find(x=>x.id===profSel.value):null;
      d.profesionalId=profSel.value||null;d.profesionalNombre=info?info.nombre:'';}
    else{d.profesionalId=t.profesionalId||null;d.profesionalNombre=t.profesionalNombre||'';}
    const esPrimerTratamiento=p.tratamientos.length===0;
    const i=p.tratamientos.findIndex(x=>x.id===d.id);
    i>=0?p.tratamientos[i]=d:p.tratamientos.push(d);
    if(esPrimerTratamiento&&!p.odontogramaInicial){
      p.odontogramaInicial={dientes:JSON.parse(JSON.stringify(p.odontograma)),fecha:hoy()};
    }

    // actualizar el odontograma solo, según lo elegido en el catálogo
    const catTratamiento=$('#t_procCat').value;
    const mapa=catTratamiento?TRAT_A_ODONTO[catTratamiento]:null;
    let avisoOdonto='';
    if(mapa){
      const piezas=(d.pieza.match(/\d{1,2}/g)||[]).filter(n=>{const v=+n;return (v>=11&&v<=48)||(v>=51&&v<=85);});
      if(!piezas.length){
        avisoOdonto=' (no pude actualizar el odontograma: falta el número de pieza)';
      }else if(mapa.tipo==='general'){
        piezas.forEach(n=>{const nd=p.odontograma[n]||{};nd.general=mapa.estado;p.odontograma[n]=nd;});
        avisoOdonto=` y odontograma actualizado (pieza${piezas.length===1?'':'s'} ${piezas.join(', ')})`;
      }else if(mapa.tipo==='cara'){
        const carasElegidas=[...document.querySelectorAll('.t_procCara_chk:checked')].map(el=>el.value);
        if(!carasElegidas.length){
          avisoOdonto=' (elige al menos una cara para que se refleje en el odontograma)';
        }else{
          piezas.forEach(n=>{const nd=p.odontograma[n]||{};nd.caras=nd.caras||{};
            carasElegidas.forEach(cara=>{nd.caras[cara]=mapa.estado;});
            p.odontograma[n]=nd;});
          avisoOdonto=` y odontograma actualizado (pieza${piezas.length===1?'':'s'} ${piezas.join(', ')})`;
        }
      }
    }

    // agregar también a un presupuesto, si se marcó
    if(document.getElementById('t_alPresu')?.checked){
      p.presupuestos=p.presupuestos||[];
      let dest=p.presupuestos.find(x=>x.estado==='Pendiente');
      if(!dest){
        const numero=`${new Date().getFullYear()}-${String(p.presupuestos.length+1).padStart(3,'0')}`;
        dest={id:uid(),numero,fecha:hoy(),items:[],descuentoPct:0,estado:'Pendiente',notas:''};
        p.presupuestos.push(dest);
      }
      dest.items=(dest.items||[]).filter(it=>it.tratamiento||it.pieza||it.precio);
      const carasElegidas=[...document.querySelectorAll('.t_procCara_chk:checked')].map(el=>el.value);
      dest.items.push({tratamiento:catTratamiento||d.proc||'Tratamiento',pieza:d.pieza,precio:d.costo||'',caras:carasElegidas});
      avisoOdonto+=' y agregado al presupuesto';
    }

    guardar();pintar();avisar('Sesión guardada'+avisoOdonto);
    sincronizarProximaCita(p.id,'tratamiento',d.id,d.prox,d.proc||d.dx||'Control de tratamiento',d.proxHora);
  });
  $('#t_elegirPieza').onclick=()=>{
    abrirSelectorDiente(num=>{
      const actual=$('#t_pieza').value.trim();
      $('#t_pieza').value=actual?actual+', '+num:num;
    });
  };
  $('#t_procCat').onchange=(e)=>{
    const val=e.target.value;
    const cont=$('#t_proc');
    if(val){
      cont.value=cont.value?cont.value+'\n'+val:val;
      const mapa=TRAT_A_ODONTO[val];
      document.getElementById('t_procCarasWrap').style.display=(mapa&&mapa.tipo==='cara')?'':'none';
    }
  };
}

function textoConsentimiento(clave,p){
  const T=PLANTILLAS[clave],cfg=datos.config||{},e=edad(p.nacimiento);
  const prof=cfg.profesional||'________________________';
  return `CONSENTIMIENTO INFORMADO — ${T.t.toUpperCase()}

Yo, ${p.nombre||'________________________'}, con cédula de ciudadanía N.º ${p.cedula||'______________'}${e!==null?`, de ${e} años de edad`:''}, en pleno uso de mis facultades, declaro que el/la odontólogo/a ${prof} me ha explicado en lenguaje claro y comprensible lo siguiente:

1. PROCEDIMIENTO PROPUESTO
Se me ha indicado ${T.proc}.
${T.desc}

2. OBJETIVO
Recuperar y mantener mi salud bucal, aliviar la sintomatología y devolver la función y la estética en la medida en que el caso lo permita. Se me ha informado que la odontología no es una ciencia exacta y que el profesional se compromete con los medios y el cuidado adecuados, no con un resultado garantizado.

3. RIESGOS Y COMPLICACIONES POSIBLES
${T.riesgos.map(r=>'• '+r).join('\n')}
• Riesgos derivados de mi condición personal de salud, que declaro haber informado en su totalidad en la historia clínica.

4. ALTERNATIVAS
${T.alt}

5. CONSECUENCIAS DE NO TRATARSE
Se me ha explicado que no realizar el tratamiento puede llevar a la progresión de la enfermedad, dolor, infección, pérdida de piezas dentales y tratamientos más complejos y costosos en el futuro.

6. CUIDADOS Y RESPONSABILIDADES
${T.cuidados}
Me comprometo a cumplir las indicaciones, asistir a los controles y comunicar cualquier cambio en mi estado de salud o medicación.

7. DECLARACIÓN
He tenido la oportunidad de hacer preguntas y todas fueron respondidas satisfactoriamente. Entiendo que puedo revocar este consentimiento en cualquier momento antes del procedimiento, sin que ello afecte la calidad de mi atención. Autorizo también al profesional a realizar cualquier maniobra adicional que resulte necesaria ante una situación imprevista durante el procedimiento, en resguardo de mi salud.

En consecuencia, ACEPTO de manera libre y voluntaria que se me realice el procedimiento descrito.

Lugar y fecha: ______________________________________`;
}
function tabCons(p,c){
  p.consentimientos=p.consentimientos||[];
  const cs=[...p.consentimientos].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  c.innerHTML=`<div class="bloque"><div class="barra-tit"><h3>Generar consentimiento</h3></div>
    <div class="plantillas">${Object.entries(PLANTILLAS).map(([k,t])=>
      `<button data-p="${k}"><b>${t.t}</b><span>${t.d}</span></button>`).join('')}</div></div>
    <div class="bloque"><div class="barra-tit"><h3>Consentimientos del paciente</h3></div>
    ${cs.length?`<table><thead><tr><th style="width:90px">Fecha</th><th>Documento</th><th style="width:150px"></th></tr></thead><tbody>
      ${cs.map(x=>`<tr><td class="num">${fechaCorta(x.fecha)}</td>
        <td>${esc(x.titulo)}${x.pieza?`<br><span class="mini">Pieza ${esc(x.pieza)}</span>`:''}
          <br><span class="mini" style="color:${x.firma?'var(--clinico)':'var(--tinta-suave)'}">${x.firma?'✓ Firmado':'Sin firmar'}</span></td>
        <td class="der"><button class="btn chico" onclick="imprimirConsentimiento('${x.id}')">Imprimir</button>
          <button class="btn chico" onclick="verConsentimiento('${x.id}')">Editar</button>
          <button class="btn chico peligro" onclick="borrarItem('consentimientos','${x.id}')">×</button></td></tr>`).join('')}
      </tbody></table>`:'<p class="mini">Este paciente aún no tiene consentimientos generados.</p>'}</div>
    <p class="mini">Los textos son plantillas base: revísalas y ajústalas a tu criterio clínico y al caso antes de hacerlas firmar. El paciente debe firmar antes del procedimiento, y el documento se archiva con la historia clínica.</p>`;
  c.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>crearConsentimiento(b.dataset.p));
}
function crearConsentimiento(clave){
  const p=pac(selId),T=PLANTILLAS[clave];
  const doc={id:uid(),clave,titulo:T.t,fecha:hoy(),pieza:'',texto:textoConsentimiento(clave,p)};
  p.consentimientos=p.consentimientos||[];p.consentimientos.push(doc);guardar();verConsentimiento(doc.id);
}
function verConsentimiento(id){
  const p=pac(selId),d=p.consentimientos.find(x=>x.id===id);
  abrirModal(d.titulo,`
    <div class="grid">
      <label class="campo"><span>Fecha</span><input type="date" id="c_fecha" value="${esc(d.fecha)}"></label>
      <label class="campo"><span>Pieza(s) o detalle</span><input type="text" id="c_pieza" value="${esc(d.pieza||'')}"></label>
      <label class="campo"><span>Firma</span><select id="c_rep">
        <option ${!d.rep?'selected':''}>El propio paciente</option>
        <option ${d.rep?'selected':''}>Representante legal</option></select></label>
    </div>
    <label class="campo"><span>Nombre y cédula del representante (si aplica)</span>
      <input type="text" id="c_repdato" value="${esc(d.repdato||'')}"></label>
    <label class="campo"><span>Texto del documento — edítalo libremente</span>
      <textarea id="c_texto" style="min-height:260px;font-size:13.5px">${esc(d.texto)}</textarea></label>
    <div class="bloque" style="margin:4px 0 0;padding:14px 16px">
      <div class="barra-tit" style="margin-bottom:8px"><h3>Firma electrónica</h3></div>
      <div id="firmaGuardadaWrap" style="${d.firma?'':'display:none'}">
        <img class="firma-guardada" id="firmaImg" src="${d.firma||''}" alt="Firma guardada">
        <p class="firma-meta">${d.firmaPor?('Firmado por '+esc(d.firmaPor)+(d.firmaFecha?(' el '+new Date(d.firmaFecha).toLocaleString('es-EC')):'')):''}</p>
        <button class="btn chico" type="button" id="c_refirmar">Firmar de nuevo</button>
      </div>
      <div id="firmaPadWrap" style="${d.firma?'display:none':''}">
        <canvas class="firmapad" id="firmaPad"></canvas>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px">
          <span class="mini">Pide al paciente (o representante) que firme aquí con el dedo o el mouse, antes del procedimiento.</span>
          <button class="btn chico" type="button" id="c_limpiarFirma">Limpiar</button>
        </div>
      </div>
    </div>`,
  ()=>{
    d.fecha=$('#c_fecha').value;d.pieza=$('#c_pieza').value.trim();
    d.rep=$('#c_rep').value==='Representante legal';d.repdato=$('#c_repdato').value.trim();
    d.texto=$('#c_texto').value;
    const cv=document.getElementById('firmaPad');
    const padWrap=document.getElementById('firmaPadWrap');
    if(cv&&padWrap&&padWrap.style.display!=='none'&&huboTrazo){
      d.firma=cv.toDataURL('image/png');
      d.firmaFecha=new Date().toISOString();
      d.firmaPor=d.rep?(d.repdato||'Representante legal'):(p.nombre||'');
    }
    guardar();pintarVista();avisar('Consentimiento guardado');});
  let ctxFirma=null,huboTrazo=false;
  function iniciarPad(){
    const cv=document.getElementById('firmaPad');if(!cv)return;
    const ratio=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
    cv.width=rect.width*ratio;cv.height=rect.height*ratio;
    ctxFirma=cv.getContext('2d');ctxFirma.scale(ratio,ratio);
    ctxFirma.lineWidth=2.2;ctxFirma.lineCap='round';ctxFirma.strokeStyle='#15302A';
    huboTrazo=false;
    let dibujando=false,x0=0,y0=0;
    const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return [t.clientX-r.left,t.clientY-r.top];};
    const down=e=>{dibujando=true;[x0,y0]=pos(e);e.preventDefault();};
    const move=e=>{if(!dibujando)return;const [x,y]=pos(e);ctxFirma.beginPath();ctxFirma.moveTo(x0,y0);ctxFirma.lineTo(x,y);ctxFirma.stroke();[x0,y0]=[x,y];huboTrazo=true;e.preventDefault();};
    const up=()=>{dibujando=false;};
    cv.onmousedown=down;cv.onmousemove=move;window.addEventListener('mouseup',up);
    cv.ontouchstart=down;cv.ontouchmove=move;cv.ontouchend=up;
  }
  if(!d.firma)iniciarPad();
  const btnRe=document.getElementById('c_refirmar');
  if(btnRe)btnRe.onclick=()=>{document.getElementById('firmaGuardadaWrap').style.display='none';
    document.getElementById('firmaPadWrap').style.display='';iniciarPad();};
  const btnLimpiar=document.getElementById('c_limpiarFirma');
  if(btnLimpiar)btnLimpiar.onclick=()=>{const cv=document.getElementById('firmaPad');
    const ratio=window.devicePixelRatio||1;ctxFirma.clearRect(0,0,cv.width/ratio,cv.height/ratio);huboTrazo=false;};
}

const APARATOLOGIAS=['Brackets metálicos','Brackets estéticos','Autoligado','Alineadores transparentes','Ortopedia funcional','Otro'];
function diasEntre(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function sumarMeses(fechaISO,meses){
  const d=new Date(fechaISO+'T00:00:00');
  d.setMonth(d.getMonth()+Number(meses||0));
  return d.toISOString().slice(0,10);
}
function tabOrto(p,c){

  o.plan=o.plan||{};o.cuotas=o.cuotas||[];
  const plan=o.plan;
  const cuotas=[...o.cuotas].sort((a,b)=>(a.fechaVenc||'').localeCompare(b.fechaVenc||''));
  const totalPlan=cuotas.reduce((s,q)=>s+(Number(q.monto)||0),0);
  const totalPagadoPlan=cuotas.filter(q=>q.pagada).reduce((s,q)=>s+(Number(q.monto)||0),0);
  const saldoPlan=totalPlan-totalPagadoPlan;
  let progreso='',alerta='';
  if(o.inicio&&o.altaEstimada){

    </div>
    ${o.inicio&&o.altaEstimada?`<p class="mini" style="margin-top:-6px">Alta estimada: <b style="color:var(--tinta)">${fechaCorta(o.altaEstimada)}</b></p>`:''}
    <label class="campo"><span>Objetivo del tratamiento</span><textarea data-k="objetivo" placeholder="Corrección de clase, apiñamiento, arcada tratada, extracciones previas…">${esc(o.objetivo||'')}</textarea></label>

  <div class="bloque"><div class="barra-tit"><h3>Controles</h3>

      <div class="fecha">${fechaCorta(x.fecha)}</div>

function sincronizarCuotaConControl(p,fechaProximoControl){
  const o=p.orto;
  if(!fechaProximoControl||!o||!o.cuotas||!o.cuotas.length)return;
  const pendientes=o.cuotas.filter(q=>!q.pagada&&!q.esEntrada).sort((a,b)=>(a.fechaVenc||'').localeCompare(b.fechaVenc||''));
  if(!pendientes.length)return;
  pendientes[0].fechaVenc=fechaProximoControl;
  guardar();
}

function generarCuotasOrto(){
  const p=pac(selId),o=p.orto;o.plan=o.plan||{};const plan=o.plan;
  const cuota=Number(plan.cuotaMensual)||0,n=Number(plan.numCuotas)||0;
  const entrada1=Number(plan.montoInicial)||0,entrada2=Number(plan.montoInicial2)||0;
  if(cuota<=0||n<=0){avisar('Define primero la cuota mensual y el número de cuotas');return;}
  if((o.cuotas||[]).length&&!confirm('Ya existen cuotas generadas. Esto crea un cronograma nuevo y se pierden los pagos ya marcados en las cuotas actuales. ¿Continuar?'))return;
  const inicio=plan.fechaInicio||hoy();
  const partes=inicio.split('-').map(Number);
  const dia=Number(plan.diaPago)||partes[2]||1;
  const cuotas=[];
  if(entrada1>0)cuotas.push({id:uid(),numero:0,esEntrada:true,entradaNum:1,fechaVenc:inicio,monto:entrada1,pagada:false});
  if(entrada2>0)cuotas.push({id:uid(),numero:0,esEntrada:true,entradaNum:2,fechaVenc:inicio,monto:entrada2,pagada:false});
  for(let i=0;i<n;i++){
    const f=new Date(partes[0],partes[1]-1+i,Math.min(dia,28));
    cuotas.push({id:uid(),numero:i+1,fechaVenc:f.toISOString().slice(0,10),monto:cuota,pagada:false});
  }
  o.cuotas=cuotas;guardar();pintarVista();avisar('Cronograma de cuotas generado');
}

function numeroALetras(n){
  n=Math.round(Number(n)||0);
  if(n<=0)return 'cero';
  const unidades=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
  const especiales={10:'diez',11:'once',12:'doce',13:'trece',14:'catorce',15:'quince',16:'dieciséis',17:'diecisiete',18:'dieciocho',19:'diecinueve',20:'veinte'};
  const decenas=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const centenas=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const dosDigitos=v=>{
    if(v<10)return unidades[v];
    if(especiales[v])return especiales[v];
    if(v<30)return 'veinti'+unidades[v-20];
    const d=Math.floor(v/10),u=v%10;
    return decenas[d]+(u?' y '+unidades[u]:'');
  };
  const tresDigitos=v=>{
    if(v===100)return 'cien';
    const c=Math.floor(v/100),resto=v%100;
    let s=c>0?centenas[c]:'';
    if(resto>0)s+=(s?' ':'')+dosDigitos(resto);
    return s;
  };
  if(n<1000)return tresDigitos(n);
  return String(n);
}

    </optgroup>`).join('')}

function extraerVecesPorDia(texto){
  texto=texto||'';
  let m=texto.match(/cada\s+(\d+)\s*horas?/i);
  if(m)return Math.max(1,Math.round(24/(+m[1])));
  m=texto.match(/(\d+)\s*veces\s*al\s*d[ií]a/i);
  if(m)return +m[1];
  return null;
}
function extraerDias(texto){
  texto=texto||'';
  const nums=[...texto.matchAll(/(\d+)/g)];
  if(!nums.length)return null;
  return +nums[nums.length-1][1]; // en rangos "3 a 5 días" toma el más alto, más seguro
}
function recalcularCantidadMedicamento(r,i){
  const item=r.medicamentos[i];
  if(!item._unidad||!item._unidadPlural)return; // solo si vino originalmente del catálogo
  const veces=extraerVecesPorDia(item.dosis),dias=extraerDias(item.duracion);
  if(veces&&dias){
    const total=veces*dias;
    item.cantidad=`${total} (${numeroALetras(total)}) ${total===1?item._unidad:item._unidadPlural}`;

async function generarPDFReceta(id){
  const p=pac(selId),r=p.recetas.find(x=>x.id===id);
  $('#impresion').innerHTML=hojaReceta(r,p);
  document.body.classList.add('imprimiendo');
  try{
    const hoja=$('#impresion').querySelector('.hoja');
    const canvas=await html2canvas(hoja,{scale:2,backgroundColor:'#ffffff'});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4'});
    const anchoMM=210,altoMM=(canvas.height*anchoMM)/canvas.width;
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,anchoMM,altoMM);
    const nombreArchivo=`receta-${(p.nombre||'paciente').replace(/[^a-z0-9]+/gi,'-')}-${r.fecha||hoy()}.pdf`;
    return {blob:pdf.output('blob'),nombreArchivo};
  }finally{
    document.body.classList.remove('imprimiendo');
  }
}
async function enviarRecetaWhatsapp(id){
  const p=pac(selId);
  avisar('Generando PDF…');
  let resultado;
  try{ resultado=await generarPDFReceta(id); }
  catch(e){ console.error(e); avisar('No se pudo generar el PDF'); return; }
  const {blob,nombreArchivo}=resultado;
  const archivo=new File([blob],nombreArchivo,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[archivo]})){
    try{
      await navigator.share({files:[archivo],title:'Receta médica',text:`Receta de ${p.nombre||'paciente'}`});
      return;
    }catch(e){ if(e.name==='AbortError')return; }
  }
  // alternativa: descargar el PDF y abrir WhatsApp con el número del paciente, para adjuntarlo a mano
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=nombreArchivo;a.click();
  const tel=(p.telefono||'').replace(/\D/g,'');
  const texto=encodeURIComponent(`Hola ${p.nombre||''}, te comparto tu receta médica. Se descargó como "${nombreArchivo}" — adjúntala aquí mismo en este chat.`);
  window.open(`https://wa.me/${tel}?text=${texto}`,'_blank');
  avisar('PDF descargado. Adjúntalo manualmente en el chat de WhatsApp que se abrió.');
}

const RX_TIPOS=['Periapical','Bite-wing','Panorámica','Oclusal','Cefalométrica','Foto clínica','Otro'];
function claveRx(pacienteId,imgId){return `rximg:${pacienteId}:${imgId}`;}
function comprimirImagen(file){
  return new Promise((resolve,reject)=>{
    const lector=new FileReader();
    lector.onerror=()=>reject(new Error('lectura'));
    lector.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('imagen'));
      img.onload=()=>{
        const maxLado=1100;
        let w=img.width,h=img.height;
        if(w>maxLado||h>maxLado){const esc=maxLado/Math.max(w,h);w=Math.round(w*esc);h=Math.round(h*esc);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let calidad=0.72,url=cv.toDataURL('image/jpeg',calidad);
        while(url.length>820000&&calidad>0.3){calidad-=0.08;url=cv.toDataURL('image/jpeg',calidad);}
        resolve(url);
      };
      img.src=lector.result;
    };
    lector.readAsDataURL(file);
  });
}

function produccionDe(profId){
  let sesiones=0,total=0;
  datos.pacientes.forEach(p=>{
    (p.tratamientos||[]).forEach(t=>{if(t.profesionalId===profId){sesiones++;total+=Number(t.costo)||0;}});
    ((p.orto&&p.orto.controles)||[]).forEach(x=>{if(x.profesionalId===profId)sesiones++;});
  });
  return {sesiones,total};
}

function diasHasta(f){if(!f)return null;return diasEntre(hoy(),f);}

}
function renderTareas(){
  pintarLista();
  datos.tareas=datos.tareas||[];
  const todas=[...datos.tareas].sort((a,b)=>(a.fechaVence||'9999').localeCompare(b.fechaVence||'9999'));
  const pendientes=todas.filter(t=>!t.hecha);
  const hechas=todas.filter(t=>t.hecha);
  const atrasadas=pendientes.filter(t=>t.fechaVence&&t.fechaVence<hoy());
  const hoyMismo=pendientes.filter(t=>t.fechaVence===hoy());

  const fila=t=>`<div class="evo" style="grid-template-columns:34px 1fr">

        :(t.pacienteNombre?`<span class="mini"> — ${esc(t.pacienteNombre)}</span>`:'')}
      ${t.fechaVence?`<p class="mini" style="color:${!t.hecha&&t.fechaVence<hoy()?'var(--alerta)':'var(--tinta-suave)'}">${fechaCorta(t.fechaVence)}</p>`:''}
    </div></div>`;
  $('#vista').innerHTML=`<div class="cabecera"><div><h2>Tareas y seguimiento</h2>
      <div class="sub">${pendientes.length} pendiente${pendientes.length===1?'':'s'}</div></div>

      ${hoyMismo.length?hoyMismo.map(fila).join(''):'<p class="mini">Sin tareas para hoy.</p>'}</div>

function verResumen(){
  selId=null;const meses={};let pend=0,cob=0;
  datos.pacientes.forEach(p=>{pend+=Math.max(0,saldo(p));
    (p.abonos||[]).forEach(a=>{const m=(a.fecha||'').slice(0,7);if(!m)return;
      meses[m]=(meses[m]||0)+(Number(a.monto)||0);cob+=Number(a.monto)||0;});});
  const ord=Object.keys(meses).sort().slice(-12),max=Math.max(...ord.map(m=>meses[m]),1),mAct=hoy().slice(0,7);
  const mesAnt=(()=>{const d=new Date();d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();
  const NM=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const deb=datos.pacientes.filter(p=>saldo(p)>0.004).sort((a,b)=>saldo(b)-saldo(a));
  const citasHoy=(datos.citas||[]).filter(c=>c.fecha===hoy()).sort((a,b)=>a.hora.localeCompare(b.hora));

  // cumpleaños de hoy
  const hoyMD=hoy().slice(5);
  const cumples=datos.pacientes.filter(p=>p.nacimiento&&p.nacimiento.slice(5)===hoyMD);

  // ortodoncias atrasadas
  const ortoAtrasadas=datos.pacientes.filter(p=>p.orto&&p.orto.altaEstimada&&!p.orto.altaRealizada&&hoy()>p.orto.altaEstimada);

  // tareas
  const tareasPend=(datos.tareas||[]).filter(t=>!t.hecha);
  const tareasAtrasadas=tareasPend.filter(t=>t.fechaVence&&t.fechaVence<hoy());
  const tareasHoy=tareasPend.filter(t=>t.fechaVence===hoy());

  // inventario por vencer / bajo
  const porVencer=(datos.inventario||[]).filter(it=>{const d=diasHasta(it.fechaVenc);return d!==null&&d<=30;})
    .sort((a,b)=>(a.fechaVenc||'').localeCompare(b.fechaVenc||''));
  const bajoStock=(datos.inventario||[]).filter(it=>Number(it.stockMinimo)>0&&Number(it.cantidad)<=Number(it.stockMinimo));

  // KPIs del mes (tarjetas de abajo, tabla de ingresos)
  const nuevosMes=datos.pacientes.filter(p=>(p.apertura||'').slice(0,7)===mAct).length;
  const cobradoMes=meses[mAct]||0,cobradoMesAnt=meses[mesAnt]||0;
  const variacion=cobradoMesAnt>0?Math.round((cobradoMes-cobradoMesAnt)/cobradoMesAnt*100):null;
  const citasMes=(datos.citas||[]).filter(c=>(c.fecha||'').slice(0,7)===mAct);
  const citasAtendidasMes=citasMes.filter(c=>c.estado==='Atendida').length;
  const ocupacion=citasMes.length?Math.round(citasAtendidasMes/citasMes.length*100):null;

  // rango de actividades (tarjetas de colores de arriba)
  const desde=resumenDesde||hoy(),hasta=resumenHasta||hoy();
  const citasRango=(datos.citas||[]).filter(c=>c.fecha>=desde&&c.fecha<=hasta);
  const creadas=citasRango.length;
  const confirmadas=citasRango.filter(c=>c.estado==='Confirmada').length;
  const atendidas=citasRango.filter(c=>c.estado==='Atendida').length;
  const canceladas=citasRango.filter(c=>c.estado==='Cancelada'||c.estado==='No asistió').length;
  const nuevosPacRango=datos.pacientes.filter(p=>p.apertura&&p.apertura>=desde&&p.apertura<=hasta).length;
  let nuevosPresRango=0,cobradoRango=0;
  datos.pacientes.forEach(p=>{
    (p.presupuestos||[]).forEach(x=>{if(x.fecha>=desde&&x.fecha<=hasta)nuevosPresRango++;});
    (p.abonos||[]).forEach(a=>{if(a.fecha>=desde&&a.fecha<=hasta)cobradoRango+=Number(a.monto)||0;});
  });

  $('#vista').innerHTML=`<div class="cabecera"><div><h2>Resumen de actividades</h2>
      <div class="sub">Al ${fechaCorta(hoy())}</div></div>
      <div class="spacer"></div>
      <div class="rango-fechas">
        <input type="date" id="res_desde" value="${desde}">
        <span class="mini">a</span>
        <input type="date" id="res_hasta" value="${hasta}">
      </div></div>
    <div class="kpi-grid" style="margin-top:16px">
      <div class="kpi-card kpi-verde"><span>Citas creadas</span><b>${creadas}</b></div>
      <div class="kpi-card kpi-azul"><span>Citas confirmadas</span><b>${confirmadas}</b></div>
      <div class="kpi-card kpi-naranja"><span>Citas atendidas</span><b>${atendidas}</b></div>

/* ---------- agenda de citas ---------- */
const ESTADOS_CITA=['Agendada','Confirmada','Atendida','No asistió','Cancelada'];
const CLASE_ESTADO={Agendada:'agendada',Confirmada:'confirmada',Atendida:'atendida','No asistió':'no_asistio',Cancelada:'cancelada'};
const COLOR_ESTADO={Agendada:'#0E7C6B',Confirmada:'#0b6759',Atendida:'#5A706A','No asistió':'#B24A35',Cancelada:'#9aa6a3'};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_SEM=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
let agendaFecha=hoy(), agendaVista='dia';

function minutos(hhmm){const [h,m]=(hhmm||'0:0').split(':').map(Number);return h*60+(m||0);}
function horaLabel(mins){const h=Math.floor(mins/60),m=((mins%60)+60)%60;return `${h}:${String(m).padStart(2,'0')}`;}
function addDias(f,n){const d=new Date(f+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function lunesDeSemana(f){const d=new Date(f+'T00:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return d.toISOString().slice(0,10);}

/* ---------- Google Calendar (un solo sentido: Mediks empuja las citas hacia allá) ---------- */
let intentoManualGoogle=false;
function inicializarGoogleCalendar(){
  if(!window.google||!window.gapi)return;
  try{
    googleTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,scope:GOOGLE_SCOPE,
      callback:async(resp)=>{
        if(resp.error){
          if(intentoManualGoogle)avisar('No se pudo conectar con Google Calendar');
          intentoManualGoogle=false;return;
        }
        gapi.client.setToken({access_token:resp.access_token});
        googleConectado=true;
        actualizarBotonGoogle();
        if(intentoManualGoogle)avisar('Google Calendar conectado');
        intentoManualGoogle=false;
      }
    });
    gapi.load('client',async()=>{
      await gapi.client.init({discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']});
      googleListoParaUsar=true;
    });
  }catch(e){console.error(e);}
}
function actualizarBotonGoogle(){ if(document.getElementById('agGrid'))renderAgenda(); }
function alternarGoogleCalendar(){
  if(googleConectado){
    if(!confirm('¿Desconectar Google Calendar? Las citas dejarán de copiarse allá hasta que vuelvas a conectar.'))return;
    googleConectado=false;
    actualizarBotonGoogle();avisar('Google Calendar desconectado');return;
  }
  if(!googleTokenClient){avisar('Google Calendar todavía está cargando, intenta de nuevo en un segundo');return;}
  intentoManualGoogle=true;
  googleTokenClient.requestAccessToken();
}
function eventoGoogleDesdeCita(c){
  const inicio=`${c.fecha}T${c.hora}:00`;
  const finMin=minutos(c.hora)+(Number(c.duracion)||30);
  const finH=String(Math.floor(finMin/60)).padStart(2,'0'),finM=String(finMin%60).padStart(2,'0');
  return {summary:`${c.nombre||'Paciente'}${c.motivo?' — '+c.motivo:''}`,
    description:[c.motivo,c.nota,c.telefono&&('Tel: '+c.telefono)].filter(Boolean).join('\n'),
    start:{dateTime:inicio,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    end:{dateTime:`${c.fecha}T${finH}:${finM}:00`,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    extendedProperties:{private:{mediksCitaId:c.id}}};
}
async function sincronizarCitaGoogle(c){
  if(!googleConectado||!googleListoParaUsar)return;
  try{
    const evento=eventoGoogleDesdeCita(c);
    if(c.googleEventId){
      await gapi.client.calendar.events.update({calendarId:'primary',eventId:c.googleEventId,resource:evento});
    }else{
      const r=await gapi.client.calendar.events.insert({calendarId:'primary',resource:evento});
      c.googleEventId=r.result.id;guardar();
    }
  }catch(e){console.error('Google Calendar:',e);}
}
async function eliminarCitaGoogle(c){
  if(!googleConectado||!googleListoParaUsar||!c.googleEventId)return;
  try{ await gapi.client.calendar.events.delete({calendarId:'primary',eventId:c.googleEventId}); }
  catch(e){console.error('Google Calendar:',e);}
}
let ultimaSincronizacionGoogle=0,sincronizandoGoogle=false;
async function sincronizarDesdeGoogle(forzar){
  if(!googleConectado||!googleListoParaUsar||sincronizandoGoogle)return;
  const ahora=Date.now();
  if(!forzar&&ahora-ultimaSincronizacionGoogle<20000)return;
  ultimaSincronizacionGoogle=ahora;sincronizandoGoogle=true;
  try{
    const desde=addDias(hoy(),-7),hasta=addDias(hoy(),60);
    const r=await gapi.client.calendar.events.list({calendarId:'primary',
      timeMin:new Date(desde+'T00:00:00').toISOString(),timeMax:new Date(hasta+'T23:59:59').toISOString(),
      singleEvents:true,maxResults:250});
    const eventos=(r.result.items||[]).filter(ev=>ev.start&&ev.start.dateTime&&ev.status!=='cancelled');
    const pad=n=>String(n).padStart(2,'0');
    let cambios=false;
    for(const ev of eventos){
      const ini=new Date(ev.start.dateTime),fin=new Date(ev.end.dateTime);
      const fecha=`${ini.getFullYear()}-${pad(ini.getMonth()+1)}-${pad(ini.getDate())}`;
      const hora=`${pad(ini.getHours())}:${pad(ini.getMinutes())}`;
      const duracion=Math.max(5,Math.round((fin-ini)/60000));
      const citaId=ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.mediksCitaId;
      if(citaId){
        const local=(datos.citas||[]).find(c=>c.id===citaId);
        if(local&&(local.fecha!==fecha||local.hora!==hora||local.duracion!==duracion)){
          local.fecha=fecha;local.hora=hora;local.duracion=duracion;
          if(ev.summary)local.nombre=ev.summary.split(' — ')[0]||local.nombre;
          cambios=true;
        }
        // si ya no existe en Mediks (se borró aquí), no la recreamos: evitamos revivir algo que borraste a propósito
      }else{
        const yaImportada=(datos.citas||[]).some(c=>c.googleEventId===ev.id);
        if(!yaImportada){
          const nueva={id:uid(),pacienteId:null,nombre:ev.summary||'Cita (Google Calendar)',telefono:'',
            fecha,hora,duracion,estado:'Agendada',motivo:'',nota:'Importada de Google Calendar',
            profesionalId:null,profesionalNombre:'',origen:null,googleEventId:ev.id};
          datos.citas=datos.citas||[];datos.citas.push(nueva);cambios=true;
          try{await gapi.client.calendar.events.patch({calendarId:'primary',eventId:ev.id,
            resource:{extendedProperties:{private:{mediksCitaId:nueva.id}}}});}catch(e){}
        }
      }
    }
    if(cambios){guardar();if(document.getElementById('agGrid'))renderAgenda();}
  }catch(e){console.error('Google Calendar (traer cambios):',e);}
  finally{sincronizandoGoogle=false;}
}

/* ---------- enlazar "próxima cita" de cualquier parte con la Agenda ---------- */
function sincronizarProximaCita(pacienteId,origenTipo,origenId,fecha,motivo,hora){
  datos.citas=datos.citas||[];
  const idx=datos.citas.findIndex(c=>c.origen&&c.origen.tipo===origenTipo&&c.origen.id===origenId);
  if(!fecha){
    if(idx>=0){datos.citas.splice(idx,1);guardar();avisar('Se quitó la cita programada');}
    return;
  }
  const paciente=pac(pacienteId);
  const d={
    id:idx>=0?datos.citas[idx].id:uid(),
    pacienteId,nombre:paciente?paciente.nombre:'',telefono:paciente?paciente.telefono:'',
    fecha,hora:hora||(idx>=0?datos.citas[idx].hora:'09:00'),
    duracion:idx>=0?datos.citas[idx].duracion:30,
    estado:idx>=0?datos.citas[idx].estado:'Agendada',
    motivo:motivo||(idx>=0?datos.citas[idx].motivo:'Control'),
    nota:idx>=0?datos.citas[idx].nota:'',
    origen:{tipo:origenTipo,id:origenId}
  };
  if(idx>=0)datos.citas[idx]=d;else datos.citas.push(d);
  guardar();avisar('Cita programada en la agenda para '+fechaCorta(fecha)+' a las '+d.hora);
}

function moverAgenda(dir){agendaFecha=addDias(agendaFecha,dir*(agendaVista==='semana'?7:1));renderAgenda();}
function irHoyAgenda(){agendaFecha=hoy();renderAgenda();}
function cambiarVistaAgenda(v){agendaVista=v;renderAgenda();}
function tituloDia(f){const d=new Date(f+'T00:00:00');return `${DIAS_SEM[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}`;}
function tituloSemana(fechas){const a=new Date(fechas[0]+'T00:00:00'),b=new Date(fechas[6]+'T00:00:00');
  return `${a.getDate()} – ${b.getDate()} de ${MESES[b.getMonth()]} ${b.getFullYear()}`;}

function renderAgenda(){
  pintarLista();
  if(googleConectado)sincronizarDesdeGoogle(false);
  const fechas=agendaVista==='dia'?[agendaFecha]:(()=>{const lun=lunesDeSemana(agendaFecha);return Array.from({length:7},(_,i)=>addDias(lun,i));})();

    <div class="cabecera"><div><h2>Agenda</h2>
      <div class="sub">${agendaVista==='dia'?tituloDia(agendaFecha):tituloSemana(fechas)}</div></div>
      <div class="spacer"></div>
      <button class="btn chico" onclick="alternarGoogleCalendar()">${googleConectado?'✓ Google Calendar conectado':'Conectar Google Calendar'}</button>

      <button class="btn primario" onclick="abrirCita(null,{fecha:'${agendaFecha}'})">Nueva cita</button></div>
    <div class="ag-topbar">
      <div class="ag-nav">
        <button class="btn chico" onclick="moverAgenda(-1)" aria-label="Anterior">←</button>
        <button class="btn chico" onclick="irHoyAgenda()">Hoy</button>
        <button class="btn chico" onclick="moverAgenda(1)" aria-label="Siguiente">→</button>
      </div>
      <input type="date" id="agFecha" value="${agendaFecha}">
      <div class="spacer"></div>
      <div class="ag-nav">
        <button class="btn chico" aria-pressed="${agendaVista==='dia'}" onclick="cambiarVistaAgenda('dia')">Día</button>
        <button class="btn chico" aria-pressed="${agendaVista==='semana'}" onclick="cambiarVistaAgenda('semana')">Semana</button>
      </div>
    </div>
    <div id="agGrid"></div>`;
  $('#agFecha').onchange=e=>{agendaFecha=e.target.value;renderAgenda();};

function pintarGridAgenda(fechas){
  const cfg=datos.config||{};
  const iniMin=minutos(cfg.horaInicio||'08:00'), finMin=minutos(cfg.horaFin||'19:00');
  const intervalo=Number(cfg.intervalo)||30, px=0.85;
  const alto=Math.max(60,(finMin-iniMin)*px);
  const horasLineas=[];
  for(let hh=Math.ceil(iniMin/60);hh<=Math.floor(finMin/60);hh++) horasLineas.push(hh*60);
  const ahora=new Date(), minAhora=ahora.getHours()*60+ahora.getMinutes();

  const colsHTML=fechas.map(f=>{
    const citasDia=(datos.citas||[]).filter(c=>c.fecha===f);
    const slots=[];
    for(let m=iniMin;m<finMin;m+=intervalo)
      slots.push(`<div class="ag-slot" style="top:${(m-iniMin)*px}px;height:${intervalo*px}px" data-fecha="${f}" data-hora="${horaLabel(m)}"></div>`);
    const citasHTML=citasDia.map(c=>{
      const top=(minutos(c.hora)-iniMin)*px, h=Math.max(20,(Number(c.duracion)||30)*px-2);
      const cls=CLASE_ESTADO[c.estado]||'agendada';
      const cabe3=h>=44, cabe2=h>=30;
      return `<div class="ag-cita ${cls}" style="top:${top}px;height:${h}px" data-cita="${c.id}">
        ${cabe2?`<span class="hora">${esc(c.hora)}${c.duracion?' · '+c.duracion+' min':''}</span>`:''}
        <span class="nom">${esc(c.nombre)}</span>
        ${cabe3&&c.motivo?`<span class="mot">${esc(c.motivo)}</span>`:''}
        ${cabe3&&c.profesionalNombre?`<span class="mot">${esc(c.profesionalNombre)}</span>`:''}</div>`;
    }).join('');
    const lineasHTML=horasLineas.map(m=>`<div class="ag-linea" style="top:${(m-iniMin)*px}px"></div>`).join('');
    const lineaHoy=(f===hoy()&&minAhora>=iniMin&&minAhora<=finMin)?`<div class="ag-linea-hoy" style="top:${(minAhora-iniMin)*px}px"></div>`:'';
    const d=new Date(f+'T00:00:00'), dCorto=['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()];
    return `<div class="ag-dia-col">
      <div class="ag-dia-head ${f===hoy()?'hoy':''}">${dCorto}<b>${d.getDate()}</b></div>
      <div style="position:relative;height:${alto}px">${lineasHTML}${slots.join('')}${citasHTML}${lineaHoy}</div>
    </div>`;
  }).join('');
  const horasLabelsHTML=horasLineas.map(m=>`<div class="ag-hora-lbl" style="top:${(m-iniMin)*px}px">${horaLabel(m)}</div>`).join('');
  $('#agGrid').innerHTML=`<div class="ag-grid-wrap">
      <div class="ag-horas" style="height:${alto+16}px">${horasLabelsHTML}</div>
      <div class="ag-dias">${colsHTML}</div>
    </div>
    <div class="leyenda" style="margin-top:12px">${ESTADOS_CITA.map(e=>`<span><b style="color:${COLOR_ESTADO[e]}">●</b> ${e}</span>`).join('')}</div>`;
  $('#agGrid').querySelectorAll('.ag-slot').forEach(el=>el.onclick=()=>abrirCita(null,{fecha:el.dataset.fecha,hora:el.dataset.hora}));
  $('#agGrid').querySelectorAll('.ag-cita').forEach(el=>el.onclick=ev=>{ev.stopPropagation();abrirCita(el.dataset.cita);});
}

/* ---------- recordatorio por WhatsApp ---------- */
function telWhatsapp(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('593'))return d;
  if(d.startsWith('0'))return '593'+d.slice(1);
  if(d.length===9)return '593'+d;
  return d;
}
function mensajeRecordatorio(nombre,fecha,hora){
  const g=datos.config||{};
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const dfecha=new Date(fecha+'T00:00:00');
  const texto=`Hola ${nombre}, te recordamos tu cita en ${g.establecimiento||'el consultorio'} el ${dias[dfecha.getDay()]} ${dfecha.getDate()}/${dfecha.getMonth()+1} a las ${hora}. Si necesitas reprogramar, respóndenos por este medio. ¡Te esperamos!`;
  return texto;
}
function enlaceWhatsapp(tel,nombre,fecha,hora){
  const num=telWhatsapp(tel);
  const texto=encodeURIComponent(mensajeRecordatorio(nombre,fecha,hora));
  return num?`https://wa.me/${num}?text=${texto}`:`https://wa.me/?text=${texto}`;
}

function abrirCita(id,prefill){

const COLORES_PRESET=['#0E7C6B','#1F5FA8','#7A4FB5','#B24A35','#B98A2E','#2F7A3C','#0B4F6C','#8A2E5C'];
function aclararColor(hex,factor){
  hex=(hex||'#0E7C6B').replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  const mezc=(c)=>Math.round(c+(255-c)*factor);
  return `rgb(${mezc(r)},${mezc(g)},${mezc(b)})`;
}
function aplicarTema(){
  const cfg=datos.config||{};
  const color=cfg.colorPrimario||'#0E7C6B';
  document.documentElement.style.setProperty('--clinico',color);
  document.documentElement.style.setProperty('--clinico-claro',aclararColor(color,.87));
  const logoImg=document.getElementById('logoConsultorio');
  if(logoImg){
    if(cfg.logo){logoImg.src=cfg.logo;logoImg.style.display='inline-block';}
    else{logoImg.style.display='none';}
  }
  const marca=document.getElementById('marcaTexto');
  if(marca)marca.innerHTML=cfg.establecimiento?esc(cfg.establecimiento):'Historia clínica <em>033</em>';
}
function comprimirLogo(file){
  return new Promise((resolve,reject)=>{
    const lector=new FileReader();
    lector.onerror=()=>reject(new Error('lectura'));
    lector.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('imagen'));
      img.onload=()=>{
        const maxLado=200;
        let w=img.width,h=img.height;
        if(w>maxLado||h>maxLado){const esc=maxLado/Math.max(w,h);w=Math.round(w*esc);h=Math.round(h*esc);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/png'));
      };
      img.src=lector.result;
    };
    lector.readAsDataURL(file);
  });
}

  const bajar=(t,n,tipo)=>{const u=URL.createObjectURL(new Blob([t],{type:tipo}));
    const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);};
  const csv=f=>'\uFEFF'+f.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  $('#bkJson').onclick=()=>bajar(JSON.stringify(datos,null,2),`respaldo-consultorio-${hoy()}.json`,'application/json');
  $('#bkPac').onclick=()=>bajar(csv([['HC','Nombre','Cedula','Nacimiento','Sexo','Telefono','Alergias','Tratamientos','Abonado','Saldo'],
    ...datos.pacientes.map(p=>[p.hc,p.nombre,p.cedula,p.nacimiento,p.sexo,p.telefono,p.alergias,
      totalTrat(p).toFixed(2),totalAbon(p).toFixed(2),saldo(p).toFixed(2)])]),`pacientes-${hoy()}.csv`,'text/csv');
  $('#bkPag').onclick=()=>{const f=[['Fecha','Paciente','Forma de pago','Nota','Monto']];
    datos.pacientes.forEach(p=>(p.abonos||[]).forEach(a=>f.push([a.fecha,p.nombre,a.metodo,a.nota,(Number(a.monto)||0).toFixed(2)])));
    f.sort((x,y)=>String(x[0]).localeCompare(String(y[0])));bajar(csv(f),`pagos-${hoy()}.csv`,'text/csv');};
  $('#bkCitas').onclick=()=>{const f=[['Fecha','Hora','Paciente','Telefono','Motivo','Duracion','Estado','Nota']];
    [...(datos.citas||[])].sort((x,y)=>(x.fecha+x.hora).localeCompare(y.fecha+y.hora))
      .forEach(c=>f.push([c.fecha,c.hora,c.nombre,c.telefono,c.motivo,c.duracion,c.estado,c.nota]));
    bajar(csv(f),`citas-${hoy()}.csv`,'text/csv');};
  $('#bkImp').onclick=()=>$('#bkFile').click();
  $('#bkFile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pacientes)throw 0;
      if(!confirm('Esto reemplazará la información actual. ¿Continuar?'))return;
      datos=d;selId=null;guardar();$('#modal').close();pintar();avisar('Respaldo restaurado');}
      catch(e){avisar('El archivo no es un respaldo válido');}};
    r.readAsText(f);};
}

/* ---------- modal ---------- */
function abrirModal(titulo,html,onGuardar){
  $('#modalCont').innerHTML=`<h3>${esc(titulo)}</h3>${html}
    <div class="modal-pie"><button class="btn" id="mCancel">${onGuardar?'Cancelar':'Cerrar'}</button>
    ${onGuardar?'<button class="btn primario" id="mOk">Guardar</button>':''}</div>`;
  $('#modal').showModal();
  $('#mCancel').onclick=()=>$('#modal').close();
  if(onGuardar)$('#mOk').onclick=()=>{if(onGuardar()!==false)$('#modal').close();};
}

$('#btnAgenda').onclick=()=>verAgenda();
$('#btnTareas').onclick=()=>verTareas();
$('#btnGestion').onclick=(ev)=>{ev.stopPropagation();$('#gestionLista').classList.toggle('abierto');};
$('#gestionLista').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>$('#gestionLista').classList.remove('abierto')));
document.addEventListener('click',()=>$('#gestionLista').classList.remove('abierto'));
$('#btnProfesionales').onclick=()=>verProfesionales();
$('#btnGastos').onclick=()=>verGastos();
$('#btnInventario').onclick=()=>verInventario();
$('#btnNube').onclick=()=>abrirNube();
$('#btnResumen').onclick=()=>{ocultarPanel();verResumen();};
$('#btnPacientes').onclick=()=>verListaPacientes();
$('#btnConfig').onclick=()=>verConfig();
$('#btnPersonalizar').onclick=()=>abrirPersonalizar();
$('#btnRespaldo').onclick=()=>verRespaldo();
arrancar();
</script>

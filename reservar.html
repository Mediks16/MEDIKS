<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda tu cita</title>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<style>
:root{--fondo:#f3f6f6;--papel:#fff;--tinta:#16302d;--suave:#5b6e6b;--linea:#d9e3e1;--acento:#0f7b6c;--acento2:#0b5f53;--wsp:#25d366;--alerta:#b3372b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--tinta)}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.cab{text-align:center;margin:4px 0 14px}
.cab .logo{width:72px;height:72px;border-radius:22px;object-fit:cover;display:block;margin:0 auto 10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.cab .ico{width:56px;height:56px;border-radius:16px;background:var(--acento);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--suave);font-size:14px;margin:0}
.card{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
label{display:block;margin:0 0 14px}
label>span{display:block;font-size:13px;font-weight:600;color:var(--suave);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acento);outline-offset:0;border-color:var(--acento)}
textarea{min-height:70px;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-bottom:6px}
.horas button{-webkit-tap-highlight-color:transparent;font:inherit;font-size:16px;padding:12px 0;border:1px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta);cursor:pointer}
.horas button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600}
.horas button.ocup{background:#eef1f1;color:#9aa6a4;border-style:dashed;cursor:not-allowed;line-height:1.1}
.horas button.ocup small{display:block;font-size:11px}
a.btn{text-decoration:none}
.horas .vacio{grid-column:1/-1;color:var(--suave);font-size:14px;margin:0}
.btn{width:100%;font:inherit;font-weight:700;font-size:17px;padding:14px;border:0;border-radius:12px;background:var(--wsp);color:#073b1d;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--alerta);font-size:14px;margin:-4px 0 12px;min-height:0}
.nota{font-size:13px;color:var(--suave);text-align:center;margin:14px 0 0}
.pie{font-size:12px;color:var(--suave);text-align:center;margin-top:24px}
.pie a{color:var(--suave)}
.malo{text-align:center;padding:40px 10px;color:var(--suave)}
.paso{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:2px 0 10px}
.paso i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--acento);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.paso span{font-weight:400;color:var(--suave)}
#bloqueHora,#bloqueDatos{margin-top:18px}
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.dias button{-webkit-tap-highlight-color:transparent;flex:none;scroll-snap-align:start;min-width:64px;font:inherit;padding:8px 6px;border:1px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.dias button b{font-size:15px}.dias button span{font-size:12px;color:var(--suave)}
.dias button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
.dias button[aria-pressed="true"] span{color:#e6f4f1}
.vacio{color:var(--suave);font-size:14px;margin:0}
details.mas{margin:0 0 14px}details.mas summary{cursor:pointer;color:var(--acento);font-size:14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.horas button{transition:background .15s}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Página pública para pedir una cita.
   ?u=<uid>  → modo directo: lee el horario y las horas ocupadas del consultorio (agendaPublica/{uid}) y deja la solicitud
               en solicitudes/{uid}/items, donde solo el consultorio puede verla. Si algo falla, cae al modo WhatsApp.
   ?c=<...>  → modo WhatsApp: los datos del consultorio vienen en el enlace y se arma un mensaje para su WhatsApp. */
const APP='./';                 // dónde está la app del consultorio (relativo a esta página)
const PIE='';                   // texto al pie (vacío en Mediks)
const LOGO='icon-192.png';      // logo por defecto (vacío = diente)
const FB={proyecto:'mediks-cd708',clave:'AIzaSyB7P5khWZfGYzUWHltPtMsNs8QQHnL6Nvw'};
const RAIZ=`https://firestore.googleapis.com/v1/projects/${FB.proyecto}/databases/(default)/documents`;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const Q=new URLSearchParams(location.search),UID=(Q.get('u')||'').replace(/[^A-Za-z0-9_-]/g,'');
let cfg=null,directo=false,ocupadas={};
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
/* Fecha y hora de Ecuador, aunque el teléfono del paciente tenga otra zona horaria. */
function ahoraEc(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {fecha:`${p.year}-${p.month}-${p.day}`,min:(Number(p.hour)%24)*60+Number(p.minute)};
}
function sumarDias(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function diaSemana(iso){return new Date(iso+'T12:00:00Z').getUTCDay();}
function textoFecha(iso){const d=new Date(iso+'T12:00:00Z');return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}`;}
const aMin=h=>{const [a,b]=String(h).split(':').map(Number);return a*60+(b||0);};
const aHora=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
/* Firestore REST: de {stringValue…} a valores normales y al revés. */
function deFs(v){if(!v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;
  if('booleanValue'in v)return v.booleanValue;if('nullValue'in v)return null;if('arrayValue'in v)return (v.arrayValue.values||[]).map(deFs);
  if('mapValue'in v){const o={};Object.entries(v.mapValue.fields||{}).forEach(([k,x])=>o[k]=deFs(x));return o;}return null;}
async function leerAgenda(){
  const r=await fetch(`${RAIZ}/agendaPublica/${UID}?key=${FB.clave}`,{cache:'no-store'});
  if(!r.ok)throw new Error('agenda '+r.status);
  const j=await r.json(),o={};Object.entries(j.fields||{}).forEach(([k,x])=>o[k]=deFs(x));
  return {n:o.n||'',w:o.w||'',d:(o.d||[]).map(Number),h:(o.h||[]).map(x=>String(x).split('-')),m:Number(o.m)||30,logo:o.logo||'',ocupadas:o.ocupadas||{}};
}
async function enviarSolicitud(x){
  const fields={};Object.entries(x).forEach(([k,v])=>fields[k]={stringValue:String(v)});
  const r=await fetch(`${RAIZ}/solicitudes/${UID}/items?key=${FB.clave}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
  if(!r.ok)throw new Error('solicitud '+r.status);
}
function horasDe(iso){
  /* Horas cada 30 minutos (o cada lo que dure la cita, si es más corta), hasta la hora de cierre. */
  const paso=Math.min(Math.max(10,Number(cfg.m)||30),30),ahora=ahoraEc(),out=[];
  (cfg.h||[]).forEach(([a,b])=>{for(let t=aMin(a);t+paso<=aMin(b);t+=paso)out.push(t);});
  return out.filter(t=>iso!==ahora.fecha||t>=ahora.min+60).sort((x,y)=>x-y).map(aHora);
}
const ocupada=(f,h)=>(ocupadas[f]||[]).includes(h);
function fechasDisponibles(){
  const hoy=ahoraEc().fecha,out=[];
  for(let i=0;i<45&&out.length<30;i++){const f=sumarDias(hoy,i);if((cfg.d||[]).includes(diaSemana(f))&&horasDe(f).length)out.push(f);}
  return out;
}
function invalido(){$('#app').innerHTML='<div class="malo"><h1>Enlace no válido</h1><p>Pide al consultorio que te envíe de nuevo su enlace para agendar.</p></div>';}
function pintar(){
  if(!cfg||(!directo&&!cfg.w)||!Array.isArray(cfg.d)||!Array.isArray(cfg.h)){invalido();return;}
  document.title='Agenda tu cita · '+(cfg.n||'Consultorio');
  const fechas=fechasDisponibles(),logo=cfg.logo||LOGO,hoyEc=ahoraEc().fecha;
  const motivos=['Primera consulta / valoración','Limpieza dental','Dolor o urgencia','Control de ortodoncia','Blanqueamiento','Control','Otro'];
  const libresDe=f=>horasDe(f).filter(h=>!ocupada(f,h));
  const conLugar=fechas.filter(f=>libresDe(f).length);
  /* Se recuerdan nombre y teléfono en este celular, así la próxima vez no hay que escribirlos. */
  let guardado={};try{guardado=JSON.parse(localStorage.getItem('reserva-datos')||'{}')||{};}catch(e){}
  const etiquetaDia=f=>{const d=new Date(f+'T12:00:00Z');
    const arriba=f===hoyEc?'Hoy':f===sumarDias(hoyEc,1)?'Mañana':DIAS[d.getUTCDay()].slice(0,3).replace(/^./,c=>c.toUpperCase());
    return `<b>${arriba}</b><span>${d.getUTCDate()} ${MESES[d.getUTCMonth()].slice(0,3)}</span>`;};
  $('#app').innerHTML=`
    <div class="cab">${logo?`<img class="logo" src="${esc(logo)}" alt="${esc(cfg.n||'Logo del consultorio')}" width="72" height="72" decoding="async">`:'<div class="ico" aria-hidden="true">🦷</div>'}<h1>${esc(cfg.n||'Agenda tu cita')}</h1>
      <p class="sub">Toca el día y la hora. Te confirmamos por WhatsApp.</p></div>
    <form class="card" id="f" novalidate>
      <p class="paso"><i>1</i> Elige el día</p>
      ${conLugar.length?`<div class="dias" id="dias" role="group" aria-label="Día">${conLugar.map(f=>`<button type="button" data-f="${f}" aria-pressed="false">${etiquetaDia(f)}</button>`).join('')}</div>`
        :'<p class="vacio">Por ahora no hay horarios libres. Escríbenos por WhatsApp.</p>'}
      <div id="bloqueHora" hidden><p class="paso"><i>2</i> Elige la hora · <span id="diaTxt"></span></p><div class="horas" id="horas" role="group" aria-label="Hora"></div></div>
      <div id="bloqueDatos" hidden>
        <p class="paso"><i>3</i> Tus datos</p>
        <label><span>Nombre y apellido</span><input id="nombre" autocomplete="name" maxlength="120" required value="${esc(guardado.n||'')}"></label>
        <label><span>WhatsApp</span><input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="0991234567" required value="${esc(guardado.t||'')}"></label>
        <details class="mas"><summary>Agregar motivo o comentario (opcional)</summary>
          <label style="margin-top:10px"><span>Motivo</span><select id="motivo"><option value="">Consulta</option>${motivos.map(m=>`<option>${m}</option>`).join('')}</select></label>
          <label><span>Comentario</span><textarea id="nota" maxlength="1000" placeholder="Algo que debamos saber"></textarea></label>
        </details>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" id="enviar" type="submit">${directo?'Pedir mi cita':'Enviar por WhatsApp'}</button>
        <p class="nota">${directo?'Te confirmaremos por WhatsApp.':'Se abrirá WhatsApp con tu pedido listo: solo toca «Enviar».'}</p>
      </div>
    </form>
    ${PIE?`<p class="pie">${PIE}</p>`:''}`;
  let fecha='',hora='';
  const elegirDia=f=>{
    fecha=f;hora='';
    $('#dias').querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===f));
    $('#diaTxt').textContent=textoFecha(f);
    const hs=libresDe(f);
    $('#horas').innerHTML=hs.map(h=>`<button type="button" aria-pressed="false" data-h="${h}">${h}</button>`).join('');
    $('#horas').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>elegirHora(b.dataset.h));
    $('#bloqueHora').hidden=false;$('#bloqueDatos').hidden=true;
    $('#bloqueHora').scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  const elegirHora=h=>{
    hora=h;
    $('#horas').querySelectorAll('[data-h]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.h===h));
    $('#bloqueDatos').hidden=false;$('#err').textContent='';
    $('#enviar').textContent=`${directo?'Pedir mi cita':'Enviar por WhatsApp'} · ${textoFecha(fecha).split(' ').slice(0,2).join(' ')}, ${h}`;
    $('#bloqueDatos').scrollIntoView({behavior:'smooth',block:'nearest'});
    if(!$('#nombre').value)setTimeout(()=>$('#nombre').focus({preventScroll:true}),350);
  };
  if(conLugar.length){$('#dias').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>elegirDia(b.dataset.f));elegirDia(conLugar[0]);}
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const nombre=$('#nombre').value.trim(),tel=$('#tel').value.trim();
    const err=$('#err');
    if(!fecha){err.textContent='Elige un día.';return;}
    if(!hora){err.textContent='Elige una hora.';return;}
    if(nombre.length<2){err.textContent='Escribe tu nombre.';$('#nombre').focus();return;}
    if(tel.replace(/\D/g,'').length<9){err.textContent='Escribe tu número de WhatsApp completo.';$('#tel').focus();return;}
    err.textContent='';
    try{localStorage.setItem('reserva-datos',JSON.stringify({n:nombre,t:tel}));}catch(e){}
    const motivo=$('#motivo').value||'Consulta',nota=$('#nota').value.trim();
    if(directo){
      const b=$('#enviar'),textoBtn=b.textContent;b.disabled=true;b.textContent='Enviando…';
      try{
        const a=await leerAgenda();ocupadas=a.ocupadas||{};       // por si alguien tomó esa hora hace un momento
        if(ocupada(fecha,hora)){const f0=fecha;b.disabled=false;b.textContent=textoBtn;
          elegirDia(f0);$('#bloqueDatos').hidden=false;$('#err').textContent='Esa hora acaba de ocuparse. Elige otra, por favor.';return;}
        await enviarSolicitud({n:nombre,t:tel,f:fecha,h:hora,m:motivo,c:nota});
        listo({nombre,fecha,hora,motivo});
      }catch(x){b.disabled=false;b.textContent=textoBtn;
        err.textContent='No se pudo enviar. Revisa tu conexión e inténtalo de nuevo'+(cfg.w?', o escríbenos por WhatsApp.':'.');
        if(cfg.w&&!document.getElementById('wspAlt')){const a=document.createElement('a');a.id='wspAlt';a.className='btn';a.style.marginTop='10px';a.textContent='Pedir por WhatsApp';
          a.href=`https://wa.me/${String(cfg.w).replace(/\D/g,'')}?text=${encodeURIComponent(`Hola 👋 Quisiera agendar una cita.\n\n👤 Nombre: ${nombre}\n📱 Teléfono: ${tel}\n🦷 Motivo: ${motivo}\n📅 Día: ${textoFecha(fecha)}\n🕐 Hora: ${hora}`+(nota?`\n💬 Comentario: ${nota}`:''))}`;
          b.after(a);}}
      return;
    }
    const datosCita={i:Date.now().toString(36)+Math.random().toString(36).slice(2,6),n:nombre,t:tel,f:fecha,h:hora,m:motivo,c:nota,d:Number(cfg.m)||30};
    const enlace=new URL(APP,location.href).href.split('#')[0]+'#cita='+b64e(JSON.stringify(datosCita));
    const txt=`Hola 👋 Quisiera agendar una cita.\n\n👤 Nombre: ${nombre}\n📱 Teléfono: ${tel}\n🦷 Motivo: ${motivo}\n📅 Día: ${textoFecha(fecha)}\n🕐 Hora: ${hora}`+
      (nota?`\n💬 Comentario: ${nota}`:'')+`\n\n(Para el consultorio — agregar a la agenda: ${enlace} )`;
    location.href=`https://wa.me/${String(cfg.w).replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`;
  };
}
function listo(x){
  const logo=cfg.logo||LOGO;
  $('#app').innerHTML=`<div class="cab">${logo?`<img class="logo" src="${esc(logo)}" alt="">`:''}<h1>¡Solicitud enviada! ✅</h1></div>
    <div class="card" style="text-align:center"><p style="margin:0 0 8px">Gracias, <b>${esc(x.nombre)}</b>. Pediste tu cita para el</p>
      <p style="font-size:20px;font-weight:700;margin:0 0 4px">${esc(textoFecha(x.fecha))}</p><p style="font-size:20px;font-weight:700;margin:0 0 12px">a las ${esc(x.hora)}</p>
      <p class="sub" style="margin:0">${esc(cfg.n||'El consultorio')} te confirmará por WhatsApp.</p></div>`;
}
(async()=>{
  if(UID){
    $('#app').innerHTML='<p class="malo">Cargando horarios…</p>';
    try{cfg=await leerAgenda();ocupadas=cfg.ocupadas;directo=true;}catch(e){cfg=null;}
    if(!cfg){$('#app').innerHTML='<div class="malo"><h1>No se pudo cargar</h1><p>Revisa tu conexión y vuelve a abrir el enlace.</p></div>';return;}
  }else{
    try{cfg=JSON.parse(b64d(Q.get('c')||''));}catch(e){}
  }
  pintar();
})();
</script>
</body>
</html>
